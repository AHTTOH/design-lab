<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFTER DARK 인터랙션 더미</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg: #030306; --ink: #f4f4ff; --soft: #8d92ab; --accent: #4d5cff; --hot: #ff4fd8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Pretendard Variable', system-ui, sans-serif; overflow-x: clip; cursor: none; }
  a, button { cursor: none; }
  ::selection { background: var(--accent); }

  /* custom cursor */
  .cursor { position: fixed; left: 0; top: 0; width: 18px; height: 18px; border-radius: 50%; background: #fff; mix-blend-mode: difference; pointer-events: none; z-index: 100; transform: translate(-50%, -50%); transition: width .25s, height .25s; }
  .cursor.big { width: 90px; height: 90px; }

  /* hero shader */
  #shader { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; }
  .hero { position: relative; z-index: 1; height: 100vh; display: grid; place-items: center; text-align: center; padding: 0 4vw; }
  .kicker { font-size: 13px; letter-spacing: .3em; color: var(--soft); margin-bottom: 2vh; }
  .title { font-size: clamp(3.5rem, 1rem + 13vw, 15rem); font-weight: 900; line-height: .85; letter-spacing: -.06em; margin: 0; }
  .title .ch { display: inline-block; will-change: transform; }
  .scroll-cue { position: absolute; bottom: 4vh; left: 50%; transform: translateX(-50%); font-size: 12px; letter-spacing: .25em; color: var(--soft); }
  .scroll-cue::after { content: ''; display: block; width: 1px; height: 48px; margin: 10px auto 0; background: linear-gradient(var(--ink), transparent); animation: drip 1.8s infinite; transform-origin: top; }
  @keyframes drip { 0% { transform: scaleY(0); } 60% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }

  main { position: relative; z-index: 2; background: linear-gradient(transparent, var(--bg) 18vh); }

  /* marquee */
  .marquee { overflow: hidden; padding: 6vh 0; border-block: 1px solid #1c1d2b; }
  .marquee-track { display: flex; gap: 4vw; white-space: nowrap; font-size: clamp(3rem, 1rem + 8vw, 10rem); font-weight: 900; letter-spacing: -.04em; will-change: transform; }
  .marquee-track span:nth-child(odd) { -webkit-text-stroke: 1.5px var(--ink); color: transparent; }
  .marquee-track span:nth-child(3n) { color: var(--accent); -webkit-text-stroke: 0; }

  /* horizontal gallery */
  .gallery { height: 100vh; overflow: hidden; display: flex; align-items: center; }
  .rail { display: flex; gap: 4vw; padding: 0 10vw; will-change: transform; }
  .card { position: relative; flex: none; width: min(34vw, 460px); aspect-ratio: 2 / 3; border-radius: 22px; overflow: hidden; transform-style: preserve-3d; transition: transform .2s ease-out; box-shadow: 0 40px 80px -40px rgba(77, 92, 255, .6); }
  .card img { position: absolute; inset: -8% -8%; width: 116%; height: 116%; object-fit: cover; will-change: transform; }
  .card figcaption { position: absolute; left: 22px; bottom: 20px; right: 22px; z-index: 2; }
  .card figcaption b { display: block; font-size: 2rem; font-weight: 900; letter-spacing: -.03em; }
  .card figcaption span { color: #c7cbe0; font-size: .9rem; }
  .card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 55%, rgba(0,0,0,.85)); }
  .card .glare { position: absolute; inset: 0; z-index: 3; background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgba(255,255,255,.25), transparent 45%); mix-blend-mode: overlay; pointer-events: none; }
  .gallery-intro { flex: none; width: min(34vw, 420px); }
  .gallery-intro h2 { font-size: clamp(2.5rem, 1rem + 4vw, 5.5rem); line-height: .95; margin: 0 0 1rem; letter-spacing: -.05em; }
  .gallery-intro p { color: var(--soft); }

  /* word reveal */
  .reveal { min-height: 160vh; padding: 20vh 8vw; }
  .reveal p { position: sticky; top: 25vh; font-size: clamp(1.8rem, 1rem + 3.2vw, 4.4rem); line-height: 1.15; font-weight: 800; letter-spacing: -.03em; margin: 0; max-width: 18em; }
  .reveal .w { opacity: .12; transition: opacity .15s, color .15s; }
  .reveal .w.on { opacity: 1; }
  .reveal .w.hl.on { color: var(--hot); }

  /* finale */
  .finale { height: 100vh; display: grid; place-items: center; text-align: center; position: relative; overflow: hidden; }
  .finale h2 { font-size: clamp(3rem, 1rem + 9vw, 11rem); margin: 0 0 6vh; letter-spacing: -.06em; line-height: .9; }
  .magnet { display: inline-grid; place-items: center; width: 200px; height: 200px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; font-size: 1.1rem; border: 0; box-shadow: 0 0 80px rgba(77, 92, 255, .7); will-change: transform; }
  .magnet span { pointer-events: none; will-change: transform; }
  .progress { position: fixed; left: 0; top: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--hot)); width: 100%; transform-origin: left; transform: scaleX(0); z-index: 50; }

  @media (max-width: 760px) {
    .card { width: 70vw; }
    .gallery-intro { width: 70vw; }
    html, body, a, button { cursor: auto; }
    .cursor { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .scroll-cue::after { animation: none; }
  }
</style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<div class="progress" id="progress"></div>
<canvas id="shader"></canvas>

<header class="hero">
  <div>
    <div class="kicker">INTERACTION STUDY 2026</div>
    <h1 class="title" id="title">AFTER DARK</h1>
  </div>
  <div class="scroll-cue">SCROLL</div>
</header>

<main>
  <div class="marquee"><div class="marquee-track" id="marquee">
    <span>빛은</span><span>어둠에서</span><span>시작된다</span><span>AFTER</span><span>DARK</span><span>빛은</span><span>어둠에서</span><span>시작된다</span><span>AFTER</span><span>DARK</span>
  </div></div>

  <section class="gallery" id="gallery">
    <div class="rail" id="rail">
      <div class="gallery-intro"><h2>밤에만<br>보이는<br>것들</h2><p>스크롤하면 옆으로 흘러갑니다. 카드에 마우스를 올리면 기울어지고 빛이 따라옵니다.</p></div>
      <figure class="card"><img src="../assets/img/chrome.webp" alt="녹아내리는 크롬 조각"><div class="glare"></div><figcaption><b>Liquid</b><span>녹아내리는 크롬</span></figcaption></figure>
      <figure class="card"><img src="../assets/img/glass.webp" alt="별이 담긴 유리 두상"><div class="glare"></div><figcaption><b>Mind</b><span>별이 담긴 유리 두상</span></figcaption></figure>
      <figure class="card"><img src="../assets/img/orb.webp" alt="빛이 새어 나오는 흑요석 구체"><div class="glare"></div><figcaption><b>Core</b><span>갈라진 흑요석</span></figcaption></figure>
      <figure class="card"><img src="../assets/img/bloom.webp" alt="빛나는 광섬유 꽃"><div class="glare"></div><figcaption><b>Bloom</b><span>광섬유 꽃</span></figcaption></figure>
    </div>
  </section>

  <section class="reveal" id="reveal">
    <p id="reveal-text">화면은 가만히 있지 않는다. 스크롤 한 번에 글자가 깨어나고 마우스 한 번에 빛이 따라온다. 좋은 인터랙션은 설명하지 않고 반응한다.</p>
  </section>

  <section class="finale">
    <div>
      <h2>다시<br>처음으로</h2>
      <button class="magnet" id="magnet" type="button"><span>맨 위로</span></button>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  gsap.registerPlugin(ScrollTrigger);

  /* smooth scroll */
  let lenis = null;
  if (!reduce) {
    lenis = new Lenis({ lerp: 0.08 });
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add((t) => lenis.raf(t * 1000));
    gsap.ticker.lagSmoothing(0);
  }

  /* cursor */
  const cursor = document.getElementById('cursor');
  const pos = { x: innerWidth / 2, y: innerHeight / 2 }, target = { ...pos };
  addEventListener('pointermove', (e) => { target.x = e.clientX; target.y = e.clientY; });
  gsap.ticker.add(() => { pos.x += (target.x - pos.x) * 0.2; pos.y += (target.y - pos.y) * 0.2; cursor.style.transform = `translate(${pos.x}px, ${pos.y}px) translate(-50%, -50%)`; });
  document.querySelectorAll('.card, .magnet, .title').forEach((el) => {
    el.addEventListener('pointerenter', () => cursor.classList.add('big'));
    el.addEventListener('pointerleave', () => cursor.classList.remove('big'));
  });

  /* shader background: flowing aurora that bends toward the pointer */
  const canvas = document.getElementById('shader');
  const gl = canvas.getContext('webgl');
  if (gl) {
    const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
    const fs = `precision highp float;uniform vec2 r;uniform float t;uniform vec2 m;uniform float s;
      float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
      float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p*=2.;a*=.5;}return v;}
      void main(){vec2 uv=gl_FragCoord.xy/r;vec2 q=uv;q.x*=r.x/r.y;
        vec2 mm=m;mm.x*=r.x/r.y;float d=distance(q,mm);
        q+=(q-mm)*0.25*exp(-d*4.);
        float f=fbm(q*2.2+vec2(t*.05,-t*.08)+fbm(q*3.-t*.1));
        vec3 c=mix(vec3(.01,.01,.03),vec3(.18,.22,1.),smoothstep(.45,.9,f));
        c=mix(c,vec3(1.,.31,.85),smoothstep(.72,.98,f)*.55);
        c*=1.-s*.85; c+=vec3(.25,.3,1.)*exp(-d*9.)*.35;
        gl_FragColor=vec4(c,1.);}`;
    const sh = (type, src) => { const x = gl.createShader(type); gl.shaderSource(x, src); gl.compileShader(x); return x; };
    const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog); gl.useProgram(prog);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const u = { r: gl.getUniformLocation(prog, 'r'), t: gl.getUniformLocation(prog, 't'), m: gl.getUniformLocation(prog, 'm'), s: gl.getUniformLocation(prog, 's') };
    const mouse = { x: .5, y: .5 };
    addEventListener('pointermove', (e) => { mouse.x = e.clientX / innerWidth; mouse.y = 1 - e.clientY / innerHeight; });
    const fit = () => { const dpr = Math.min(devicePixelRatio, 1.5); canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr; gl.viewport(0, 0, canvas.width, canvas.height); };
    fit(); addEventListener('resize', fit);
    const start = performance.now();
    const draw = () => {
      const fade = Math.min(scrollY / innerHeight, 1);
      gl.uniform2f(u.r, canvas.width, canvas.height);
      gl.uniform1f(u.t, reduce ? 0 : (performance.now() - start) / 1000);
      gl.uniform2f(u.m, mouse.x, mouse.y);
      gl.uniform1f(u.s, fade);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(draw);
    };
    draw();
  }

  /* split title into letters: fly in, then scatter on scroll */
  const title = document.getElementById('title');
  title.innerHTML = [...title.textContent].map((c) => c === ' ' ? '&nbsp;' : `<span class="ch">${c}</span>`).join('');
  const chars = title.querySelectorAll('.ch');
  if (!reduce) {
    gsap.from(chars, { yPercent: 120, rotate: 12, opacity: 0, stagger: 0.05, duration: 1.1, ease: 'expo.out' });
    chars.forEach((ch) => {
      gsap.to(ch, { y: () => gsap.utils.random(-260, 260), x: () => gsap.utils.random(-120, 120), rotate: () => gsap.utils.random(-50, 50), opacity: 0, ease: 'none',
        scrollTrigger: { trigger: '.hero', start: 'top top', end: 'bottom top', scrub: true } });
    });
  }

  /* marquee: drifts on its own, speeds up and skews with scroll velocity */
  const track = document.getElementById('marquee');
  let mx = 0, skew = 0;
  gsap.ticker.add(() => {
    const v = lenis ? lenis.velocity : 0;
    mx -= 1.2 + Math.abs(v) * 0.6;
    const half = track.scrollWidth / 2;
    if (-mx > half) mx += half;
    skew += (Math.max(-20, Math.min(20, v * 0.8)) - skew) * 0.1;
    track.style.transform = `translateX(${mx}px) skewX(${-skew}deg)`;
  });

  /* horizontal gallery pinned to the viewport */
  const rail = document.getElementById('rail');
  const horizontal = gsap.to(rail, { x: () => -(rail.scrollWidth - innerWidth), ease: 'none',
    scrollTrigger: { trigger: '#gallery', pin: true, scrub: 1, end: () => '+=' + (rail.scrollWidth - innerWidth), invalidateOnRefresh: true } });
  document.querySelectorAll('.card img').forEach((img) => {
    gsap.fromTo(img, { xPercent: -6 }, { xPercent: 6, ease: 'none', scrollTrigger: { trigger: img.parentElement, containerAnimation: horizontal, start: 'left right', end: 'right left', scrub: true } });
  });
  document.querySelectorAll('.card').forEach((card) => {
    card.addEventListener('pointermove', (e) => {
      const r = card.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      card.style.transform = `perspective(900px) rotateY(${(px - .5) * 18}deg) rotateX(${(.5 - py) * 18}deg) scale(1.03)`;
      card.style.setProperty('--gx', px * 100 + '%'); card.style.setProperty('--gy', py * 100 + '%');
    });
    card.addEventListener('pointerleave', () => { card.style.transform = ''; });
  });

  /* word-by-word reveal */
  const text = document.getElementById('reveal-text');
  const HIGHLIGHT = ['깨어나고', '빛이', '반응한다.'];
  text.innerHTML = text.textContent.split(' ').map((w) => `<span class="w${HIGHLIGHT.includes(w) ? ' hl' : ''}">${w}</span>`).join(' ');
  const words = text.querySelectorAll('.w');
  ScrollTrigger.create({ trigger: '#reveal', start: 'top 60%', end: 'bottom 80%', scrub: true,
    onUpdate: (self) => { const k = Math.round(self.progress * words.length); words.forEach((w, i) => w.classList.toggle('on', i < k)); } });

  /* magnetic button */
  const magnet = document.getElementById('magnet'), label = magnet.querySelector('span');
  magnet.addEventListener('pointermove', (e) => {
    const r = magnet.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    gsap.to(magnet, { x: dx * 0.45, y: dy * 0.45, duration: .4, ease: 'power3.out' });
    gsap.to(label, { x: dx * 0.2, y: dy * 0.2, duration: .4, ease: 'power3.out' });
  });
  magnet.addEventListener('pointerleave', () => { gsap.to([magnet, label], { x: 0, y: 0, duration: .8, ease: 'elastic.out(1, .4)' }); });
  magnet.addEventListener('click', () => lenis ? lenis.scrollTo(0, { duration: 2 }) : scrollTo({ top: 0, behavior: 'smooth' }));

  /* page progress */
  const progress = document.getElementById('progress');
  ScrollTrigger.create({ start: 0, end: 'max', onUpdate: (s) => { progress.style.transform = `scaleX(${s.progress})`; } });
})();
</script>
</body>
</html>
