<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8BIT</title>
<meta name="description" content="스크롤이 곧 컨트롤러인 8비트 횡스크롤 연습. 초원, 동굴, 설원, 용암성, 구름 위를 지나 깃발까지 달린다.">
<meta property="og:title" content="8BIT">
<meta property="og:image" content="https://ahttoh.github.io/design-lab/assets/thumb/8bit.webp">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    /* Every scene's --len is multiplied by this. 2026-09-28: batch lesson, about 7,000vh at 1 */
    --scroll-stretch: 1;
    --ink: #16171f; --sky: #2e8fff; --sun: #ffd23f; --white: #ffffff; --red: #ff3b4f; --teal: #1ed6c4;
    /* Press Start 2P is drawn on an 8px grid, so sizes stay on multiples of 8 for crisp glyph edges */
    --title: 160px;
    --word: 56px;
    --gutter: clamp(16px, 5vw, 72px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--white); overflow-x: clip; }
  ::selection { background: var(--sun); color: var(--ink); }

  #stage { position: fixed; inset: 0; overflow: hidden; z-index: 0; background: var(--sky); }
  #px { position: absolute; left: 0; top: 0; image-rendering: crisp-edges; image-rendering: pixelated; }
  main { position: relative; z-index: 1; }
  .scene { position: relative; height: calc(var(--len) * var(--scroll-stretch)); }
  .pin { position: sticky; top: 0; height: 100vh; overflow: hidden; pointer-events: none; }

  /* chunky pixel lettering: 8-way hard outline in ink plus a hard drop */
  .title, .word {
    --u: .0625em;
    margin: 0; font-family: 'Press Start 2P', monospace; font-weight: 400; line-height: 1; white-space: nowrap; color: var(--c);
    text-shadow:
      var(--u) 0 0 var(--ink), calc(var(--u) * -1) 0 0 var(--ink), 0 var(--u) 0 var(--ink), 0 calc(var(--u) * -1) 0 var(--ink),
      var(--u) var(--u) 0 var(--ink), calc(var(--u) * -1) var(--u) 0 var(--ink), var(--u) calc(var(--u) * -1) 0 var(--ink), calc(var(--u) * -1) calc(var(--u) * -1) 0 var(--ink),
      0 calc(var(--u) * 2) 0 var(--ink), var(--u) calc(var(--u) * 2) 0 var(--ink), calc(var(--u) * -1) calc(var(--u) * 2) 0 var(--ink);
  }
  .ch { visibility: hidden; }
  .ch.on { visibility: visible; }
  .title { position: absolute; left: 0; right: 0; top: 13vh; text-align: center; font-size: var(--title); }
  .word { position: absolute; left: var(--gutter); top: 11vh; font-size: var(--word); }
  .word.right { left: auto; right: var(--gutter); }
  #w-end { top: 7vh; font-size: 120px; }

  .cue { position: absolute; left: 50%; bottom: 6vh; transform: translateX(-50%); display: grid; justify-items: center; gap: 10px;
    font: 700 15px 'Pretendard Variable', system-ui, sans-serif; color: var(--white); text-shadow: 2px 2px 0 var(--ink); transition: opacity .3s steps(3); }
  .cue.off { opacity: 0; }
  .arrow { width: 6px; height: 6px; background: var(--sun); box-shadow: -6px -6px 0 var(--sun), 6px -6px 0 var(--sun), -12px -12px 0 var(--sun), 12px -12px 0 var(--sun), 0 6px 0 var(--ink), -6px 0 0 var(--ink), 6px 0 0 var(--ink); animation: hop 1s steps(2) infinite; }
  @keyframes hop { from { transform: translateY(-4px); } to { transform: translateY(4px); } }

  .fin { position: absolute; left: 0; right: 0; bottom: 9vh; display: grid; place-items: center; opacity: 0; transition: opacity .35s steps(4); }
  .fin.on { opacity: 1; }
  .magnet { display: grid; place-items: center; min-width: 176px; height: 72px; padding: 0 28px; background: var(--sun); color: var(--ink);
    border: 4px solid var(--ink); box-shadow: 0 8px 0 var(--ink), inset -4px -4px 0 #e0a018, inset 4px 4px 0 #fff29a;
    font: 800 19px 'Pretendard Variable', system-ui, sans-serif; text-decoration: none; will-change: transform; pointer-events: none; }
  .fin.on .magnet { pointer-events: auto; }
  .magnet span { pointer-events: none; will-change: transform; }
  .magnet:hover { background: var(--teal); box-shadow: 0 8px 0 var(--ink), inset -4px -4px 0 #10a092, inset 4px 4px 0 #9ff5ea; }
  .magnet:active { box-shadow: 0 2px 0 var(--ink); }
  .magnet:focus-visible { outline: 4px dashed var(--white); outline-offset: 8px; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  @media (max-width: 1100px) { :root { --title: 120px; --word: 40px; } #w-end { font-size: 96px; } }
  @media (max-width: 760px) {
    :root { --title: 64px; --word: 24px; }
    .title { top: 10vh; }
    .word { top: 8vh; }
    #w-end { font-size: 56px; }
    .fin { justify-items: end; padding-right: var(--gutter); }
    .magnet { min-width: 152px; height: 64px; }
  }
  /* reduced motion: one still frame per world, every word and the button visible */
  .reduce .scene { height: 100vh; }
  .reduce .cue { display: none; }
  .reduce .ch { visibility: visible; }
  .reduce .fin { opacity: 1; transition: none; }
  .reduce .magnet { pointer-events: auto; }
  .reduce #w-grass { display: none; }
  @media (prefers-reduced-motion: reduce) { .arrow { animation: none; } }
</style>
</head>
<body>
<div id="stage" aria-hidden="true"><canvas id="px"></canvas></div>
<p class="sr">스크롤을 내리면 작은 픽셀 주인공이 오른쪽으로 달리고, 올리면 왼쪽으로 돌아간다. 초원, 동굴, 설원, 용암성, 구름 위를 지나 성 앞 깃발에서 끝난다.</p>

<main>
  <section class="scene" id="s-grass" style="--len:1300vh">
    <div class="pin">
      <h1 class="title" id="title" data-type style="--c: var(--sun)">8BIT</h1>
      <div class="cue" id="cue"><span class="arrow" aria-hidden="true"></span>스크롤</div>
      <h2 class="word" id="w-grass" data-type style="--c: #ffffff">GREEN HILLS</h2>
    </div>
  </section>
  <section class="scene" id="s-cave" style="--len:1300vh">
    <div class="pin"><h2 class="word" id="w-cave" data-type style="--c: #6ff0ff">CRYSTAL CAVE</h2></div>
  </section>
  <section class="scene" id="s-ice" style="--len:1200vh">
    <div class="pin"><h2 class="word right" id="w-ice" data-type style="--c: #e6f7ff">SNOW PEAKS</h2></div>
  </section>
  <section class="scene" id="s-lava" style="--len:1300vh">
    <div class="pin"><h2 class="word" id="w-lava" data-type style="--c: #ffb020">LAVA KEEP</h2></div>
  </section>
  <section class="scene" id="s-sky" style="--len:1200vh">
    <div class="pin"><h2 class="word right" id="w-sky" data-type style="--c: #ff5ec4">SKY ROAD</h2></div>
  </section>
  <section class="scene" id="s-end" style="--len:700vh">
    <div class="pin">
      <h2 class="title" id="w-end" data-type style="--c: var(--sun)">CLEAR</h2>
      <div class="fin" id="fin"><a class="magnet" id="magnet" href="../"><span>목록으로</span></a></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>

// between world i and i+1: +1 means the next world sits below, -1 above
const LINKS = [
  { dir: 1, kind: 'pipe' },
  { dir: -1, kind: 'shaft', pose: 'jump' },
  { dir: 1, kind: 'shaft', pose: 'fall' },

];

/* ───────── helpers ───────── */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce) document.documentElement.classList.add('reduce');
const T = CONFIG.tile;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const clamp01 = (v) => clamp(v, 0, 1);
const seg = (p, a, b) => clamp01((p - a) / (b - a));
const smooth = (x) => x * x * (3 - 2 * x);
const lerp = (a, b, t) => a + (b - a) * t;
const mod = (a, n) => ((a % n) + n) % n;
function mulberry32(a) {
  return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
const rrange = (rng, r) => lerp(r[0], r[1], rng());

function mk(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').imageSmoothingEnabled = false;
  return c;
}
function painter(w, h, fn) {
  const c = mk(w, h), g = c.getContext('2d');
  const px = (x, y, ww, hh, col) => { g.fillStyle = col; g.fillRect(x, y, ww, hh); };
  fn(px, g);
  return c;
}
function sprite(rows, swap) {
  return painter(rows[0].length, rows.length, (px) => {
    rows.forEach((row, y) => [...row].forEach((ch, x) => {
      if (ch === '.') return;
      const col = swap && ch in swap ? swap[ch] : PAL[ch];
      if (!col) throw new Error(`sprite: no colour for "${ch}"`);
      px(x, y, 1, 1, col);
    }));
  });
}
function flipX(c) {
  const o = mk(c.width, c.height), g = o.getContext('2d');
  g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0);
  return o;
}
function flipY(c) {
  const o = mk(c.width, c.height), g = o.getContext('2d');
  g.translate(0, c.height); g.scale(1, -1); g.drawImage(c, 0, 0);
  return o;
}
function tint(c, col) {
  const o = mk(c.width, c.height), g = o.getContext('2d');
  g.drawImage(c, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
  return o;
}

  for (let dy = -r; dy <= r; dy++) { const hw = Math.floor(Math.sqrt(r * r - dy * dy)); px(cx - hw, cy + dy, hw * 2 + 1, 1, col); }
}
function speck(px, rng, n, cols, x0 = 0, y0 = 0, w = 16, h = 16) {
  for (let i = 0; i < n; i++) px(x0 + Math.floor(rng() * w), y0 + Math.floor(rng() * h), 1, 1, pick(rng, cols));
}

/* ───────── sprites ───────── */
const HEAD = ['....kkkk....', '...krrrrk...', '..krrrrrrk..', '..kRRRRRRRRk', '..kNssskssk.', '..kNssskssk.', '..kksssssssk', '...kkSSSSkk.'];

const BODY = {
  idle: ['..kttttttk..', '.kbbttbbbbk.', '.kbbbbbbbbk.', '.ksbbbbbbsk.', '..kyBBBBBk..', '..kBBk.kBBk.', '.knnnk.knnnk', '.kkkkk.kkkkk'],
  run1: ['ttkttttttk..', '.kbbttbbbbk.', 'kbbbbbbbbbsk', 'ksbbbbbbbkk.', '..kBBBBBBk..', '.kBBk..kBBk.', 'knnk....knnk', 'kkk......kkk'],

function groundTiles(st, rng) {

      speck(px, rng, 6, [st.fillLo], 0, 6, 16, 10);
      return;
    }
    px(0, 0, 16, 16, st.fill);
    speck(px, rng, 16, [st.fillLo, st.fillHi]);
    if (st.kind === 'grass') {
      px(0, 0, 16, 4, st.top); px(0, 0, 16, 1, st.hi);
      [1, 2, 1, 0, 1, 2, 2, 1, 0, 1, 2, 1, 1, 0, 1, 2].forEach((d, x) => { px(x, 4, 1, d, st.top); px(x, 4 + d, 1, 1, st.lo); });
    } else if (st.kind === 'rock') {

      px(3 + Math.floor(rng() * 9), 7 + Math.floor(rng() * 6), 1, 2, st.glint);

      for (let i = 0; i < 3; i++) { const x = Math.floor(rng() * 12), y = 9 + Math.floor(rng() * 4); px(x, y, 3, 1, st.fillHi); }
    } else if (st.kind === 'stone') {

  });
  const bottom = painter(T, T, (px) => {

}

class Path {

  }
  fall(x1, y1) { return this.add({ k: 'j', fall: true, entry: true, x0: this.x, y0: this.y, x1, y1, L: Math.abs(x1 - this.x) + Math.abs(y1 - this.y) * 0.6 }); }

/* ───────── level builder ───────── */
function buildLevel(w, wi) {
  const rng = mulberry32(CONFIG.seed * 97 + wi * 131);
  const L = { top: new Map(), ceil: new Map(), blocks: [], coins: [], enemies: [], decor: [], fixtures: [], lava: [], path: new Path() };
  const P = L.path;
  let tx = 0, h = 0;
  const surf = () => -h * T;
  const col = (i, hh) => { L.top.set(i, hh); if (w.ceiling) L.ceil.set(i, hh + w.ceiling); };
  const ground = (n) => { for (let k = 0; k < n; k++) col(tx + k, h); };
  const gap = (n) => { for (let k = 0; k < n; k++) { L.top.set(tx + k, null); if (w.ceiling) L.ceil.set(tx + k, h + w.ceiling); } };
  const coin = (x, y, s) => L.coins.push({ x, y, s });
  const decorate = (n) => {
    for (let k = 0; k < n; k++) if (rng() < w.decorRate) L.decor.push({ k: pick(rng, w.decor), x: (tx + k) * T + Math.floor(rng() * 8), y: surf(), v: Math.floor(rng() * 4) });
    if (w.ceilDecor) for (let k = 0; k < n; k++) if (rng() < 0.2) L.decor.push({ k: w.ceilDecor, x: (tx + k) * T + 4, y: -(h + w.ceiling) * T, v: 2 + Math.floor(rng() * 4) });
  };
  const arcCoins = (g, n) => { for (let k = 1; k <= n; k++) { const u = k / (n + 1), p = segPos(g, u); coin(p.x, p.y - 9, g.s0 + u * g.L); } };
  const hurdle = (kind) => {
    ground(6); decorate(1);
    const cx = (tx + 3) * T, top = surf() - 2 * T;
    if (kind === 'pipe') L.fixtures.push({ k: 'pipe', x: cx, top, base: surf() });
    else for (const bx of [tx + 2, tx + 3]) for (const by of [top, top + T]) L.blocks.push({ x: bx * T, y: by, t: 'brick' });
    P.walk(cx - 40); P.jump(cx, top, 12); P.jump(cx + 42, surf(), 10); tx += 6;
  };
  const OPS = {
    r(n) { ground(n); decorate(n); tx += n; P.walk(tx * T - 12); },
    c(n) { ground(n); decorate(n); for (let k = 0; k < n; k++) coin((tx + k) * T + 8, surf() - 9, null); tx += n; P.walk(tx * T - 12); },
    p(n) {
      const edge = tx * T; P.walk(edge - 6); gap(n);
      if (w.lava) L.lava.push({ x0: edge, x1: edge + n * T, y: surf() + 6, ph: rng() * 6 });
      tx += n; ground(2);
      const g = P.jump(tx * T + 10, surf(), 22 + n * 5); arcCoins(g, n + 1); tx += 2;
    },
    e() { ground(8); decorate(2); const ex = (tx + 4) * T; L.enemies.push({ x: ex, y: surf(), kind: 'blob', amp: CONFIG.enemy.amp, ph: rng() * 6 }); P.walk(ex - 30); P.jump(ex + 30, surf(), 26); tx += 8; },
    s() {
      ground(8); const ex = (tx + 4) * T; P.walk(ex - 36);
      const g = P.jump(ex, surf() - 10, 24); P.jump(ex + 38, surf(), 20);
      L.enemies.push({ x: ex, y: surf(), kind: 'blob', amp: 0, ph: rng() * 6, stompS: g.s1 }); tx += 8;
    },
    f() { ground(8); decorate(3); L.enemies.push({ x: (tx + 4) * T, y: surf() - 36, kind: 'fly', amp: 6, ph: rng() * 6 }); tx += 8; P.walk(tx * T - 12); },
    u(n) { P.walk(tx * T - 14); h += n; ground(3); P.jump(tx * T + 12, surf(), 14); tx += 3; },
    d(n) { P.walk(tx * T - 4); h -= n; ground(3); P.jump(tx * T + 18, surf(), 6); tx += 3; },
    P(n) {
      ground(n + 6); decorate(2);
      const x0 = (tx + 3) * T, top = surf() - 3 * T;
      for (let k = 0; k < n; k++) { L.blocks.push({ x: x0 + k * T, y: top, t: 'brick' }); coin(x0 + k * T + 8, top - 9, null); }
      P.walk(x0 - 22); P.jump(x0 + 10, top, 12); P.walk(x0 + n * T - 6); P.jump(x0 + n * T + 22, surf(), 8); tx += n + 6;
    },
    q() {
      ground(6); decorate(2);
      const bx = (tx + 3) * T, block = { x: bx - 8, y: surf() - 4 * T, t: 'gem' };

    },
    i() { hurdle('pipe'); },
    x() { hurdle('pillar'); },
  };
  const ENTRY = {
    start() { ground(8); decorate(8); P.start(3 * T, surf()); tx = 8; P.walk(tx * T - 12); },
    pipeDown() { ground(6); const x = 2 * T, mouth = surf() - (w.ceiling - 3) * T; L.fixtures.push({ k: 'pipeDown', x, mouth }); P.start(x, mouth + 16); P.fall(x + 26, surf()); tx = 6; },
    holeUp() { ground(1); tx = 1; gap(2); const x = 2 * T; tx = 3; ground(5); P.start(x, surf() + 12); P.jump(x + 30, surf(), 26, { entry: true }); tx = 8; },
    ceilHole() { ground(6); L.ceil.set(2, null); L.ceil.set(3, null); const x = 3 * T; P.start(x, surf() - w.ceiling * T + 10); P.fall(x + 24, surf()); tx = 6; },
    vineUp() { gap(2); const x = T; tx = 2; ground(6); L.fixtures.push({ k: 'vineUp', x, y: surf() - 20 }); P.start(x, surf() - 4); P.jump(x + 30, surf(), 12, { entry: true }); tx = 8; },
    skyFall() { ground(6); decorate(6); const x = 3 * T; P.start(x, surf() - 8 * T); P.fall(x + 20, surf()); tx = 6; },
  };
  const EXIT = {
    pipe() { ground(8); decorate(2); const cx = (tx + 4) * T, top = surf() - 2 * T; L.fixtures.push({ k: 'pipe', x: cx, top, base: surf(), exit: true }); P.walk(cx - 40); P.jump(cx, top, 14); tx += 8; return { x: cx, y: top }; },
    spring() { ground(8); decorate(2); const cx = (tx + 4) * T; L.ceil.set(tx + 3, null); L.ceil.set(tx + 4, null); L.fixtures.push({ k: 'spring', x: cx, y: surf() }); P.walk(cx - 34); P.jump(cx, surf() - 8, 14); tx += 8; return { x: cx, y: surf() - 8 }; },
    hole() { ground(4); decorate(3); tx += 4; const cx = (tx + 1) * T; gap(2); P.walk(tx * T - 4); P.jump(cx, surf() + 4, 6); tx += 2; return { x: cx, y: surf() + 4 }; },
    vine() { ground(8); decorate(2); const cx = (tx + 4) * T; L.ceil.set(tx + 3, null); L.ceil.set(tx + 4, null); const f = { k: 'vine', x: cx, y: surf() }; L.fixtures.push(f); P.walk(cx); f.s0 = P.len; tx += 8; return { x: cx, y: surf() }; },
    cliff() { ground(3); tx += 3; P.walk(tx * T - 6); const ex = tx * T + 22; P.jump(ex, surf() + 16, 10); return { x: ex, y: surf() + 16 }; },
    castle() {
      ground(10); decorate(4);
      const pole = (tx + 8) * T; tx += 10; ground(22);
      const poleTop = surf() - 8 * T;
      L.fixtures.push({ k: 'flagpole', x: pole, y: surf(), top: poleTop });
      P.walk(pole - 46); P.jump(pole - 5, poleTop + 14, 10);
      const slide = P.vert(surf(), 'slide');
      const cx = pole + 5 * T; L.fixtures.push({ k: 'castle', x: cx, y: surf(), slide });

      tx += 22; return { x: P.x, y: P.y };
    },
  };
  for (let i = -CONFIG.pad; i < 0; i++) col(i, 0);
  ENTRY[w.entry]();
  L.entry = { x: P.segs.length ? P.segs[0].x0 : P.x, y: P.segs.length ? P.segs[0].y0 : P.y };
  for (const tok of w.script.split(/\s+/).filter(Boolean)) {
    const op = OPS[tok[0]]; if (!op) throw new Error(`level ${w.id}: unknown op ${tok}`);
    op(tok.length > 1 ? Number(tok.slice(1)) : undefined);

  L.exit = EXIT[w.exit]();

  if (w.thin) for (let k = 0; k < CONFIG.pad; k++) if ((k % 9) > 5) L.top.set(tx + k, null);
  for (const c of L.coins) if (c.s === null) c.s = P.sFromX(c.x);
  for (const e of L.enemies) e.passS = P.sFromX(e.x);
  L.coins.sort((a, b) => a.s - b.s);
  L.coinS = L.coins.map((c) => c.s);
  return L;
}

    if (k < 0.25 && Math.floor(p.life * 20) % 2) continue;
    ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
    if (k > 0.5) { ctx.fillRect(Math.round(p.px), Math.round(p.py), 1, 1); }
  }
}
function staticBursts() {
  const rng = mulberry32(77);
  for (let b = 0; b < 4; b++) {
    const cx = view.W * (0.18 + b * 0.22), cy = view.H * (0.14 + (b % 2) * 0.14), r = 18 + rng() * 10, cols = FW_COLS[b];
    for (let k = 0; k < 32; k++) { const a = (k / 32) * Math.PI * 2; for (let q = 0; q < 3; q++) { ctx.fillStyle = cols[q % 2]; ctx.fillRect(Math.round(cx + Math.cos(a) * r * (0.6 + q * 0.2)), Math.round(cy + Math.sin(a) * r * (0.6 + q * 0.2) + q), 1, 1); } }
  }
}

/* ───────── band + conduit between stacked worlds ───────── */
function fillBand(W, kind, y0, y1, camX) {
  if (y1 <= y0) return;
  ctx.save(); ctx.beginPath(); ctx.rect(0, y0, view.W, y1 - y0); ctx.clip();
  if (kind === 'sky') { ctx.fillStyle = W.sky[0]; ctx.fillRect(0, y0, view.W, y1 - y0); drawStars(W, y0, 0); }
  else { const ox = -mod(camX, T); for (let y = y0; y < y1; y += T) for (let x = ox; x < view.W; x += T) ctx.drawImage(W.tiles.fill, x, y); }
  ctx.restore();
}
function drawBand(A, B, dir, top, bottom, camX) {
  const mid = Math.round((top + bottom) / 2);
  const upper = dir > 0 ? A : B, lower = dir > 0 ? B : A;
  fillBand(upper, upper.bandBelow, top, mid, camX);
  fillBand(lower, lower.bandAbove, mid, bottom, camX);
  ctx.fillStyle = PAL.k;
  for (let x = 0; x < view.W; x += 4) ctx.fillRect(x, mid + (((x / 4) | 0) % 3) - 1, 4, 2);
}
function drawConduit(link, A, pA, pB, bandTop, bandBot, t) {
  const x = view.sx, yTop = Math.min(pA.y, pB.y), yBot = Math.max(pA.y, pB.y);
  if (link.kind === 'pipe') { drawPipe(x, pA.y + 12, pB.y - 28, A.pipe, null); return; }
  if (link.kind === 'vine') { drawVine(x, yBot, yTop, t); return; }
  if (link.kind === 'shaft') {
    ctx.save(); ctx.beginPath(); ctx.rect(0, bandTop, view.W, bandBot - bandTop); ctx.clip();
    ctx.fillStyle = PAL.k; ctx.fillRect(x - 13, yTop, 26, yBot - yTop);
    ctx.fillStyle = '#0d0a1f'; ctx.fillRect(x - 11, yTop, 22, yBot - yTop);
    ctx.fillStyle = '#6ff0ff';
    for (let i = 0; i < 7; i++) { const lx = x - 9 + ((i * 7) % 19), ly = Math.round(yTop + mod(i * 29 + t * 140 * link.dir, Math.max(1, yBot - yTop))); ctx.fillRect(lx, ly, 1, 6); }
    ctx.restore();
  }
}

/* ───────── DOM words ───────── */
const typers = [...document.querySelectorAll('[data-type]')].map((el) => {
  const text = el.textContent; el.setAttribute('aria-label', text); el.textContent = '';
  const chars = [...text].map((ch) => { const s = document.createElement('span'); s.className = 'ch'; s.setAttribute('aria-hidden', 'true'); s.textContent = ch; el.appendChild(s); return s; });
  return { el, chars, shown: -1 };
});
const typer = (id) => typers.find((t) => t.el.id === id);
function setTyped(tp, frac) {
  const n = Math.round(clamp01(frac) * tp.chars.length);
  if (n === tp.shown) return;
  tp.chars.forEach((c, i) => c.classList.toggle('on', i < n));
  tp.shown = n;
}
const WORD_IDS = ['w-grass', 'w-cave', 'w-ice', 'w-lava', 'w-sky'];
const cue = document.getElementById('cue'), fin = document.getElementById('fin');
function updateWords(y) {
  const W = CONFIG.words, l0 = layout[0];
  const u0 = (y - l0.top) / l0.span;
  setTyped(typer('title'), 1 - seg(u0, W.title[0], W.title[1]));
  cue.classList.toggle('off', u0 > W.title[0] * 0.5);
  WORD_IDS.forEach((id, i) => { const l = layout[i], u = (y - l.top) / l.span; setTyped(typer(id), seg(u, W.in[0], W.in[1]) * (1 - seg(u, W.out[0], W.out[1]))); });
  const le = layout[layout.length - 1], ue = (y - le.top) / le.span;
  setTyped(typer('w-end'), seg(ue, CONFIG.finale.word[0], CONFIG.finale.word[1]));
  fin.classList.toggle('on', ue >= CONFIG.finale.button);
}

/* ───────── magnet button ───────── */
const magnet = document.getElementById('magnet'), label = magnet.querySelector('span');
const mag = { x: 0, y: 0, tx: 0, ty: 0 };
magnet.addEventListener('pointermove', (e) => { const r = magnet.getBoundingClientRect(); mag.tx = (e.clientX - (r.left + r.width / 2)) * 0.4; mag.ty = (e.clientY - (r.top + r.height / 2)) * 0.4; });
magnet.addEventListener('pointerleave', () => { mag.tx = 0; mag.ty = 0; });
function updateMagnet() {
  mag.x += (mag.tx - mag.x) * 0.18; mag.y += (mag.ty - mag.y) * 0.18;
  const sx = Math.round(mag.x / 2) * 2, sy = Math.round(mag.y / 2) * 2;
  magnet.style.transform = `translate(${sx}px, ${sy}px)`; label.style.transform = `translate(${Math.round(mag.x * 0.3)}px, ${Math.round(mag.y * 0.3)}px)`;
}

/* ───────── frame ───────── */
const lenis = reduce ? null : new Lenis({ lerp: CONFIG.lenisLerp });
let dirty = true, lastT = 0;

function handleEvents(W, wi, S, t) {
  if (heroState.lastW !== wi) { W.lastS = S; return; }
  const from = W.lastS; W.lastS = S;
  if (S <= from) return;
  let budget = CONFIG.coin.maxEventsPerFrame;
  const cam = camFor(W, S);
  for (const c of W.coins) {
    if (c.s <= from || c.s > S || budget-- <= 0) continue;
    if (c.pop) { parts.push({ wi, kind: 'pop', x: c.x, y: c.y, vx: 0, vy: -CONFIG.coin.popRise / CONFIG.coin.popFor, life: 0, max: CONFIG.coin.popFor }); }
    spark(wi, c.x, c.y - (c.pop ? 10 : 0), CONFIG.coin.sparkles);
    flying.push({ x: c.x - cam.x, y: c.y - cam.y, life: 0 });
  }
  for (const b of W.blocks) if (b.bumpS !== undefined && b.bumpS > from && b.bumpS <= S) W.bump.set(b, t);
  for (const e of W.enemies) if (e.stompS !== undefined && e.stompS > from && e.stompS <= S) puffAt(wi, e.x, e.y - 4);
}
function coinCount(wi, S) {
  const arr = worlds[wi].coinS; let lo = 0, hi = arr.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m] <= S) lo = m + 1; else hi = m; }
  return coinsBefore[wi] + lo;
}

function renderWorld(st, t, dt) {
  const wi = st.w, W = worlds[wi], S = st.S, cam0 = camFor(W, S), p = cam0.p;
  const lower = W.finale ? Math.round(smooth(seg(st.fu, CONFIG.finale.lower[0], CONFIG.finale.lower[1])) * view.H * CONFIG.finale.lowerBy) : 0;
  const cam = { ...cam0, y: cam0.y - lower };
  if (!reduce) handleEvents(W, wi, S, t);
  const dx = heroState.lastW === wi && heroState.lastX !== null ? p.x - heroState.lastX : 0;
  heroState.lastX = p.x; heroState.lastW = wi; heroState.lastTY = null;
  if (Math.abs(dx) > 0.02) { heroState.face = Math.sign(dx); heroState.idle = 0; heroState.phase += Math.abs(dx); } else heroState.idle += dt;
  drawWorld(W, cam, 0, 0, view.H, S, t, st.fu);
  let pose;
  if (W.finale && st.fu >= CONFIG.finale.cheer) pose = 'cheer';
  else if (p.g.k === 'slide') pose = 'fall';
  else if (p.g.k === 'j') pose = rising(p.g, p.u) ? 'jump' : 'fall';
  else pose = heroState.idle > CONFIG.hero.idleAfter ? 'idle' : 'run';
  const vel = lenis ? lenis.velocity : 0;
  if (pose === 'run' && Math.abs(vel) > CONFIG.hero.dustVel) { heroState.dustT -= dt; if (heroState.dustT <= 0) { heroState.dustT = CONFIG.hero.dustEvery; dust(wi, p.x, p.y, heroState.face); } }
  drawParts(wi, cam, 0);
  let feet = p.y - cam.y, frame = heroFrame(pose, t), face = heroState.face;
  if (pose === 'cheer') { feet -= Math.round(Math.abs(Math.sin(t * 5)) * 10); frame = Math.sin(t * 5) > 0 ? 'jump' : 'idle'; face = 1; }
  if (pose === 'idle' && heroState.idle > CONFIG.hero.lookAfter) face = mod(heroState.idle, 4) < 2 ? heroState.face : -heroState.face;
  drawHero(p.x - cam.x, feet, frame, face, vel);
  if (W.finale) {
    const active = !reduce && st.fu >= CONFIG.finale.fireworks;
    if (!reduce) { updateFireworks(dt, active); drawFireworks(); }
    else if (st.fu >= CONFIG.finale.fireworks) staticBursts();
  } else if (fw.length) fw = [];
  return coinCount(wi, S);
}
function renderTrans(st, t) {
  const A = worlds[st.a], B = worlds[st.b], link = LINKS[st.a], dir = link.dir, TT = st.T;
  const camA = camFor(A, A.path.len), camB = camFor(B, 0);
  const e = smooth(seg(TT, CONFIG.trans.pan[0], CONFIG.trans.pan[1])), D = view.H + view.band;
  const oA = Math.round(-dir * e * D), oB = Math.round(dir * (1 - e) * D);
  drawWorld(A, camA, oA, Math.max(0, oA), Math.min(view.H, oA + view.H), A.path.len, t, 1);
  drawWorld(B, camB, oB, Math.max(0, oB), Math.min(view.H, oB + view.H), 0, t, 0);
  const bandTop = dir > 0 ? oA + view.H : oB + view.H, bandBot = dir > 0 ? oB : oA;
  drawBand(A, B, dir, bandTop, bandBot, camA.x);
  const pA = { x: A.exit.x - camA.x, y: A.exit.y - camA.y + oA }, pB = { x: B.entry.x - camB.x, y: B.entry.y - camB.y + oB };
  const hv = smooth(seg(TT, CONFIG.trans.travel[0], CONFIG.trans.travel[1]));
  const hx = lerp(pA.x, pB.x, hv), hy = lerp(pA.y, pB.y, hv);
  if (heroState.lastTY !== null) heroState.phase += Math.abs(hy - heroState.lastTY);
  heroState.lastTY = hy; heroState.lastW = -1; heroState.lastX = null;
  const frame = link.kind === 'pipe' ? 'idle' : link.pose === 'climb' ? heroFrame('climb', t) : link.pose;
  if (link.kind === 'pipe') { drawHero(hx, hy, frame, 1, 0); drawConduit(link, A, pA, pB, bandTop, bandBot, t); }
  else { drawConduit(link, A, pA, pB, bandTop, bandBot, t); drawHero(hx, hy, frame, 1, 0); }
  return coinsBefore[st.b];
}

function render(t, dt) {
  const y = lenis ? lenis.scroll : scrollY;
  const st = locate(y);
  ctx.imageSmoothingEnabled = false;
  const count = st.mode === 'world' ? renderWorld(st, t, dt) : renderTrans(st, t);
  drawPile(count);
  updateWords(y);
}

function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { lastT = now / 1000; return; }
  const t = now / 1000, dt = clamp(t - lastT, 0, 0.05); lastT = t;
  if (lenis) lenis.raf(now);
  updateParts(dt);
  render(t, dt);
  updateMagnet();
}

/* reduced motion: a still frame of the world under the viewport centre, redrawn only on scroll or resize */
function renderStill() {
  if (!dirty) return;
  dirty = false;
  const mid = scrollY + innerHeight / 2;
  let i = sections.length - 1;
  while (i > 0 && mid < layout[i].top) i--;
  const W = worlds[i], last = i === sections.length - 1;
  const S = last ? W.path.len : W.path.len * 0.42;
  heroState.lastW = -2; heroState.idle = 1;
  const count = renderWorld({ mode: 'world', w: i, S, fu: last ? 1 : 0.5 }, 0, 0);
  drawPile(count);
}

addEventListener('resize', resize);
resize();
if (reduce) {
  addEventListener('scroll', () => { dirty = true; requestAnimationFrame(renderStill); }, { passive: true });
  addEventListener('resize', () => requestAnimationFrame(renderStill));
  document.fonts.ready.then(() => { resize(); renderStill(); });
  renderStill();
} else {
  document.fonts.ready.then(resize);
  requestAnimationFrame((now) => { lastT = now / 1000; frame(now); });
}
})();
</script>
</body>
