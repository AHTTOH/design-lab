<script type="module">
import * as THREE from 'three';
/* ── js/config.js ── */
/* SEASONS config. Every tunable number lives here. Colours are sRGB hex, converted to linear by THREE.Color. */
const CONFIG = {

  /* distant rolling hills ring that fades into the horizon */

    trunkLean: [0.18, 0.06], step: 0.24, influence: 2.0, kill: 0.45, maxIter: 320, tropism: 0.16, jitter: 0.22,
    smoothPasses: 3, minTwig: 4, tipR: 0.014, pipeExp: 2.3, flareR: 1.55, flareH: 0.9,

  house: { pos: [-7.4, 4.2], yaw: 0.95, w: 2.4, d: 2.0, h: 1.5, roof: 1.05 },
  birds: { count: 9 },

  /* leaf colour ramp (per-instance progress 0..1), plus young spring green and fallen brown */
  leafRamp: ['#4f9a2f', '#b3c93a', '#f2c83a', '#f08526', '#d0392a'],
  leafYoung: '#9ad64a', leafDead: '#8a5a33',

  /* season keys along the year clock t (0 = late winter bare, 4 wraps). */
  year: {
    bud: [-0.1, 0.16], bloom: [0.2, 0.44], shed: [0.52, 0.8], petal: [0.44, 0.58, 0.8, 0.95],
    leaf: [0.56, 1.05], autumn: [1.95, 2.65], fall: [2.35, 3.08],
    snowIn: [3.14, 3.55], snowOut: [3.86, 4.02], flowers: [0.3, 0.6, 1.3, 1.7],
  },
  /* year clock at each scene's start and end */
  sceneYear: { spring: [-0.12, 0.85], summer: [0.85, 1.9], autumn: [1.9, 3.08], winter: [3.08, 3.8], year: [3.8, 11.8], finale: [3.8, 4.45] },

  /* sky palette keyed on the year clock: [t, zenith, horizon, sun colour, sun elevation (rad), grass, grass tip] */
  skyKeys: [
    [0.0, '#5b93d0', '#d3e6f6', '#fff3e2', 0.62, '#7f9a55', '#b9c982'],
    [0.5, '#3b86d6', '#c6e3fa', '#fff4df', 0.78, '#5fae3c', '#b4e070'],
    [1.4, '#2272d0', '#b5dcfb', '#fffaf0', 0.95, '#3f8f30', '#8fcf52'],
    [2.3, '#3f82cc', '#c3dbee', '#ffc271', 0.3, '#8d9a3c', '#d7c46a'],
    [2.9, '#4a86c6', '#c9dbeb', '#ffcb80', 0.27, '#8a7f45', '#c7ad6a'],
    [3.4, '#3f7fcc', '#b4cfea', '#fff1e0', 0.4, '#7d8f64', '#aab98a'],
    [4.0, '#5b93d0', '#d3e6f6', '#fff3e2', 0.62, '#7f9a55', '#b9c982'],
  ],
  rainSky: { zenith: '#6f8497', horizon: '#aebcc7', dim: 0.32 },
  duskSky: { zenith: '#2f4f8e', horizon: '#f4a66a', sun: '#ff9a55', el: 0.06 },
  nightSky: { zenith: '#0c1a33', horizon: '#2c4467', moon: '#9fb8e6', el: 0.9 },
  snowColor: '#f6f9ff', wetDark: 0.55,
  light: { sun: 3.1, hemi: 1.35, moon: 0.55, hemiNight: 0.35, window: '#ffb45c', exposure: 1.05 },
  shadow: { map: 2048, mapMobile: 1024, extent: 17, bias: 0.0016 },

  /* per-scene overlays on scene progress: [start, full, fadeStart, end] */
  overlay: {
    summerRain: [0.3, 0.38, 0.56, 0.64], summerWet: [0.34, 0.45, 0.8, 0.95], summerDusk: [0.68, 0.84],
    fireflies: [0.8, 0.92], autumnDuskOut: [0, 0.12],
    winterSnow: [0.04, 0.14, 0.86, 0.98], winterNight: [0.5, 0.66], yearNightOut: [0, 0.08],
    birdsIn: [0.36, 0.7], birdsOut: [0.5, 0.78], finaleBirds: [0.3, 0.7],
  },

  /* camera keys per scene: [progress, target x, y, z, azimuth, elevation, distance, fov] */
  cam: {
    spring: [[0, 0, 7.6, 0, 0.4, 0.06, 12, 42], [0.3, 0.4, 8.2, 0.4, 0.75, 0.12, 9.5, 40], [0.56, 0, 7, 0, 1.05, 0.13, 21, 40], [0.8, 0.3, 8.6, 0.3, 1.5, -0.42, 8.6, 58], [1, 0, 6.6, 0, 1.9, 0.1, 22, 40]],
    summer: [[0, 0, 6.6, 0, 1.9, 0.1, 22, 40], [0.26, 0, 6.8, 0, 2.3, 0.15, 21, 40], [0.4, 3.4, 2.4, -4.9, 2.62, 0.3, 8.5, 46], [0.6, 3.4, 2.6, -5.1, 2.74, 0.26, 9, 46], [0.78, 0, 5.4, 0, 2.95, 0.06, 20, 46], [1, 0, 5.2, 0, 3.25, 0.05, 18, 46]],
    autumn: [[0, 0, 5.2, 0, 3.25, 0.05, 18, 46], [0.3, 1.0, 8.2, 1.0, 3.6, 0.1, 14, 38], [0.58, 0, 6.4, 0, 4.0, 0.12, 20, 40], [0.86, 0, 2.8, 0, 4.4, 0.2, 12.5, 46], [1, 0, 5.4, 0, 4.75, 0.12, 22, 40]],
    winter: [[0, 0, 5.4, 0, 4.75, 0.12, 22, 40], [0.36, 0, 6.2, 0, 5.0, 0.34, 24, 40], [0.62, -3.2, 4.0, 1.8, 5.75, 0.12, 24, 40], [0.9, -5.6, 2.9, 3.4, 5.95, 0.08, 10, 42], [1, -2.8, 4.6, 1.4, 6.1, 0.12, 23, 40]],
    finale: [[0, 0, 5.6, 0, 6.1, 0.16, 23, 40], [0.5, 0, 6.6, 0, 6.5, 0.14, 21, 40], [1, 0, 7.2, 0, 6.8, 0.2, 26, 40]],
  },
  yearCam: { target: [0, 5.6, 0], el: 0.16, dist: 23, fov: 40, turns: 2, blendIn: 0.07, blendOut: 0.93 },
  /* scroll velocity (px per frame from Lenis) feeds gusts and the montage */
  velocity: { gust: 0.018, gustMax: 1.6, spin: 0.0009, yearPush: 0.004, yearPushMax: 0.9, stiffness: 0.08, damping: 0.82 },
  wind: { base: 0.3, pointer: 0.8, ease: 0.04 },

  /* reduced motion: one still per scene at these progress points */
  stills: { spring: 0.58, summer: 0.22, autumn: 0.42, winter: 0.72, year: 0.2, finale: 0.95 },
  words: { in: [0.04, 0.2], out: [0.72, 0.92], titleOut: [0.06, 0.16] },
};

/* ── js/core.js ── */
/* SEASONS core: math helpers, seeded random, scroll engine, scene progress, pointer. */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce) document.documentElement.classList.add('reduce');

const clamp01 = (v) => Math.min(1, Math.max(0, v));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const seg = (p, a, b) => clamp01((p - a) / (b - a));
const smooth = (x) => x * x * (3 - 2 * x);
const lerp = (a, b, t) => a + (b - a) * t;
/** 0 before a, rises to 1 at b, holds, falls back to 0 between c and d. */
const plateau = (p, r) => smooth(seg(p, r[0], r[1])) * (1 - smooth(seg(p, r[2], r[3])));
const $ = (s) => document.querySelector(s);
const isNarrow = () => innerWidth < CONFIG.mobileBreak;
const NARROW_AT_LOAD = isNarrow();
const pick = (desk, mob) => (NARROW_AT_LOAD ? mob : desk);

/** Seeded PRNG so the tree grows the same on every visit. */
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Hill height, mirrored by hillH() in GLSL. */
const hillY = (x, z) => {
  const r = Math.hypot(x, z) / CONFIG.hill.s;
  return CONFIG.hill.h * Math.exp(-r * r * r);
};

/* ───────── scroll engine ───────── */
const lenis = reduce ? null : new Lenis({ lerp: CONFIG.lenisLerp });
const velocity = () => (lenis ? lenis.velocity : 0);

const SCENE_IDS = ['spring', 'summer', 'autumn', 'winter', 'year', 'finale'];
const sceneEls = SCENE_IDS.map((id) => $(`#s-${id}`));
let sceneTops = [], docEnd = 1;
function measureScenes() {
  sceneTops = sceneEls.map((el) => el.offsetTop);
  docEnd = document.documentElement.scrollHeight - innerHeight;
}

/**
 * Where the scroll sits. `world` runs from one scene's top to the next scene's top, so the 3D state never
 * pauses between pins. `pin` is the sticky-pin progress used for words.
 */
function scrollState() {
  const y = window.scrollY, n = sceneTops.length;
  let i = 0;
  for (let k = 0; k < n; k++) if (y >= sceneTops[k] - 1) i = k;
  const top = sceneTops[i], next = i < n - 1 ? sceneTops[i + 1] : docEnd;
  const world = clamp01((y - top) / Math.max(1, next - top));
  const pins = sceneEls.map((el, k) => clamp01((y - sceneTops[k]) / Math.max(1, el.offsetHeight - innerHeight)));
  return { index: i, id: SCENE_IDS[i], world, pins };
}

/** Reduced motion: the scene whose screen holds the viewport centre. */
function stillState() {
  const mid = window.scrollY + innerHeight / 2;
  let i = 0;
  for (let k = 0; k < sceneTops.length; k++) if (mid >= sceneTops[k]) i = k;
  const id = SCENE_IDS[i];
  return { index: i, id, world: CONFIG.stills[id], pins: SCENE_IDS.map(() => 1) };
}

/* ───────── pointer ───────── */
const pointer = { nx: 0, ny: 0, active: false };
addEventListener('pointermove', (e) => {
  pointer.nx = (e.clientX / innerWidth) * 2 - 1;
  pointer.ny = (e.clientY / innerHeight) * 2 - 1;
  pointer.active = true;
});

/** Critically damped-ish spring used for gusts and montage push. */
function spring(stiffness, damping) {
  let x = 0, v = 0;
  return {
    step(target) { v = (v + (target - x) * stiffness) * damping; x += v; return x; },
    get value() { return x; },
    reset() { x = 0; v = 0; },
  };
}

/* ── js/glsl.js ── */
/* SEASONS shared shader uniforms and GLSL helpers. Every material points at the same uniform objects. */
const U = {
  uTime: { value: 0 },
  uWind: { value: new THREE.Vector3(0.3, 0, 0.1) },
  uGust: { value: 0 },
  uSunDir: { value: new THREE.Vector3(0.4, 0.8, 0.3).normalize() },
  uSunCol: { value: new THREE.Color(1, 1, 1) },
  uHemiSky: { value: new THREE.Color(0.5, 0.6, 0.7) },
  uHemiGround: { value: new THREE.Color(0.3, 0.3, 0.2) },
  uSnow: { value: 0 },
  uSnowCol: { value: new THREE.Color(CONFIG.snowColor) },
  uWet: { value: 0 },
  uShadowMap: { value: null },
  uShadowMatrix: { value: new THREE.Matrix4() },
  uShadowTexel: { value: new THREE.Vector2(1 / 2048, 1 / 2048) },
  uShadowOn: { value: 0 },
  uWindowGlow: { value: 0 },
  uWindowPos: { value: new THREE.Vector3() },
  uWindowCol: { value: new THREE.Color(CONFIG.light.window) },
  /* season state, written once per frame by applySeason() */
  uGrow: { value: 0 }, uAutumn: { value: 0 }, uFall: { value: 0 },
  uBud: { value: 0 }, uBloom: { value: 0 }, uShed: { value: 0 }, uPetal: { value: 0 },
  uPetalGround: { value: 0 }, uLitter: { value: 0 }, uFlowers: { value: 0 },
  uGrass: { value: new THREE.Color() }, uGrassTip: { value: new THREE.Color() },
  uRain: { value: 0 }, uSnowFall: { value: 0 }, uFire: { value: 0 }, uNight: { value: 0 },
  uCamTarget: { value: new THREE.Vector3() },
};

const f3 = (v) => v.toFixed(4);

const GLSL_COMMON = /* glsl */ `
#define HILL_H ${f3(CONFIG.hill.h)}
#define HILL_S ${f3(CONFIG.hill.s)}
uniform float uTime;
uniform vec3 uWind;
uniform float uGust;
uniform vec3 uSunDir;
uniform vec3 uSunCol;
uniform vec3 uHemiSky;
uniform vec3 uHemiGround;
uniform float uSnow;
uniform vec3 uSnowCol;
uniform float uWet;
uniform float uWindowGlow;
uniform vec3 uWindowPos;
uniform vec3 uWindowCol;
uniform float uGrow, uAutumn, uFall, uBud, uBloom, uShed, uPetal, uPetalGround, uLitter, uFlowers;
uniform vec3 uGrass, uGrassTip;
uniform float uRain, uSnowFall, uFire, uNight;
uniform vec3 uCamTarget;

float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3. - 2. * f);
  return mix(mix(hash12(i), hash12(i + vec2(1., 0.)), u.x), mix(hash12(i + vec2(0., 1.)), hash12(i + vec2(1., 1.)), u.x), u.y);
}
float fbm(vec2 p) { float a = .5, s = 0.; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= .5; } return s; }
float hillH(vec2 xz) { float r = length(xz) / HILL_S; return HILL_H * exp(-r * r * r); }

/* branch sway: stronger for flexible wood, phase shifts across the crown so it ripples */
vec3 swayOffset(vec3 p, float flex) {
  float ph = dot(p.xz, vec2(.23, .17)) + p.y * .11;
  float s = sin(uTime * 1.25 + ph) * .6 + sin(uTime * 2.6 + ph * 1.7) * .28 + sin(uTime * 5.1 + ph * 3.1) * .12;
  float strength = length(uWind) * .55 + uGust;
  vec3 w = uWind + vec3(1e-4, 0., 0.);
  return (w * (.55 + .45 * s) * .55 + normalize(w) * uGust * (.35 + .3 * s)) * flex + vec3(0., -abs(s) * .05 * strength * flex, 0.);
}

/* warm light from the cottage window, a soft falloff for nearby surfaces */
vec3 windowLight(vec3 wp) {
  float d = distance(wp, uWindowPos);
  return uWindowCol * uWindowGlow * 2.2 / (1. + d * d * .35);
}
`;

/* manual shadow lookup for custom shaders: packed depth from the sun's shadow map, 3x3 PCF */
const GLSL_SHADOW = /* glsl */ `
uniform sampler2D uShadowMap;
uniform vec2 uShadowTexel;
uniform float uShadowOn;
float shadowAt(vec4 sc, float bias) {
  vec3 c = sc.xyz / sc.w;
  if (uShadowOn < .5 || c.x < 0. || c.x > 1. || c.y < 0. || c.y > 1. || c.z > 1.) return 1.;
  float s = 0.;
  for (int i = -1; i <= 1; i++) for (int j = -1; j <= 1; j++) {
    float d = unpackRGBAToDepth(textureLod(uShadowMap, c.xy + vec2(float(i), float(j)) * uShadowTexel * 1.4, 0.));
    s += step(c.z - bias, d);
  }
  return s / 9.;
}
`;

/* simple lit colour for card-like foliage: hemisphere + sun + translucency, with shadow and window glow */
const GLSL_FOLIAGE_LIGHT = /* glsl */ `
vec3 foliageLight(vec3 albedo, vec3 N, float ao, float sh, float trans, vec3 wp) {
  float ndl = dot(N, uSunDir);
  vec3 hemi = mix(uHemiGround, uHemiSky, N.y * .5 + .5);
  vec3 lit = hemi * ao * 1.35 + uSunCol * (max(ndl, 0.) + max(-ndl, 0.) * trans) * sh;
  return albedo * lit * ${f3(1 / Math.PI)} + albedo * windowLight(wp) * .35;
}
`;

/** Adds the common helpers and sway to a built-in material (bark, house). */
let patchSerial = 0;
function patchStandard(material, { sway = false, snow = false, colorCode = '' } = {}) {
  /* three caches programs by onBeforeCompile source; every patch variant needs its own key */
  const key = `seasons-${patchSerial++}-${sway}-${snow}`;
  material.customProgramCacheKey = () => key;
  material.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, U);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>\n${GLSL_COMMON}\n${sway ? 'attribute float aFlex;' : ''}\nvarying vec3 vWP;\nvarying vec3 vWN;`)
      .replace('#include <begin_vertex>', `vec3 transformed = vec3(position);\n${sway ? 'transformed += swayOffset(position, aFlex);' : ''}`)
      .replace('#include <beginnormal_vertex>', '#include <beginnormal_vertex>\nvWN = normalize(mat3(modelMatrix) * objectNormal);')
      .replace('#include <project_vertex>', '#include <project_vertex>\nvWP = (modelMatrix * vec4(transformed, 1.)).xyz;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>\n${GLSL_COMMON}\nvarying vec3 vWP;\nvarying vec3 vWN;`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        ${colorCode}
        ${snow ? `float snowN = fbm(vWP.xz * 2.1 + vWP.y * 1.3) * .5 + vnoise(vWP.xz * 9.) * .12;
        float snowM = smoothstep(.97 - uSnow * .75, 1.05 - uSnow * .5, vWN.y + (snowN - .3) * .45) * step(.01, uSnow);
        diffuseColor.rgb = mix(diffuseColor.rgb, uSnowCol, snowM);` : ''}
        diffuseColor.rgb *= mix(1., ${f3(CONFIG.wetDark)}, uWet * .6);`)
      .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance += diffuseColor.rgb * windowLight(vWP) * .3;');
  };
  return material;
}

/** Depth material for shadows of swaying bark, so shadows follow the wind. */
function swayDepthMaterial() {
  const m = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });
  m.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, U);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>\n${GLSL_COMMON}\nattribute float aFlex;`)
      .replace('#include <begin_vertex>', 'vec3 transformed = vec3(position) + swayOffset(position, aFlex);');
  };
  return m;
}

/** Fog uniforms a custom ShaderMaterial needs when `fog: true`. */
const fogUniforms = () => THREE.UniformsUtils.clone(THREE.UniformsLib.fog);

/* ── js/world.js ── */
/* SEASONS world: renderer, camera, lights, sky dome with clouds and stars, hill, far hills, cottage. */
const canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, CONFIG.dprMax));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = CONFIG.light.exposure;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe6f7, 45, 260);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 1200);

/* ───────── lights ───────── */
const sun = new THREE.DirectionalLight(0xffffff, CONFIG.light.sun);
sun.castShadow = true;
{
  const S = CONFIG.shadow, m = pick(S.map, S.mapMobile);
  sun.shadow.mapSize.set(m, m);

/* ───────── hill ground: radial rings dense near the tree ───────── */
function radialGround(R, rings, segs, heightAt) {
  const pos = [], idx = [];
  pos.push(0, heightAt(0, 0), 0);
  for (let i = 1; i <= rings; i++) {
    const r = R * Math.pow(i / rings, 2.1);
    for (let j = 0; j < segs; j++) {
      const a = (j / segs) * Math.PI * 2, x = Math.sin(a) * r, z = Math.cos(a) * r;
      pos.push(x, heightAt(x, z), z);
    }
  }
  for (let j = 0; j < segs; j++) idx.push(0, 1 + j, 1 + ((j + 1) % segs));
  for (let i = 1; i < rings; i++) {
    const a0 = 1 + (i - 1) * segs, a1 = 1 + i * segs;
    for (let j = 0; j < segs; j++) {
      const j1 = (j + 1) % segs;
      idx.push(a0 + j, a1 + j, a1 + j1, a0 + j, a1 + j1, a0 + j1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

const GROUND_COLOR = /* glsl */ `
  float gn = fbm(vWP.xz * .32), gn2 = vnoise(vWP.xz * 3.3), rr = length(vWP.xz);
  vec3 g = mix(uGrass * .72, uGrassTip * .95, gn * .75 + gn2 * .25);
  float pet = uPetalGround * smoothstep(8., 3., rr + (gn - .5) * 5.) * smoothstep(.62, .85, vnoise(vWP.xz * 11.) + gn * .35);
  g = mix(g, vec3(.95, .5, .62), pet * .75);
  float lit = uLitter * smoothstep(10., 2.5, rr + (gn - .5) * 5.5) * smoothstep(.25, .6, vnoise(vWP.xz * 6.) * .7 + gn * .5);
  g = mix(g, mix(vec3(.62, .26, .06), vec3(.78, .5, .1), gn2), lit * .8);
  g = mix(g, vec3(.2, .15, .1), smoothstep(1.4, .5, rr) * .55);
  diffuseColor.rgb = g;
  float snowEdge = gn * .8 + vnoise(vWP.xz * 1.7) * .2;
  float snowG = smoothstep(snowEdge - .05, snowEdge + .05, uSnow * 1.3 - .2);
  diffuseColor.rgb = mix(diffuseColor.rgb, uSnowCol * (.94 + gn2 * .06), snowG);
`;

/* distant hills: a noisy ring, coloured with the season and faded by fog */
function farHills() {
  const F = CONFIG.far, rnd = mulberry32(CONFIG.seed + 5), segs = F.segs;
  const ph = [rnd() * 9, rnd() * 9, rnd() * 9];
  const heightAt = (a, ring) => {
    const base = F.h[0] + (F.h[1] - F.h[0]) * (0.5 + 0.28 * Math.sin(a * 3 + ph[0]) + 0.15 * Math.sin(a * 7 + ph[1]) + 0.07 * Math.sin(a * 17 + ph[2]));
    return ring === 0 ? -1 : base * (ring === 1 ? 0.55 : 1);
  };
  const pos = [], idx = [];
  const radii = [F.r[0], lerp(F.r[0], F.r[1], 0.4), F.r[1]];
  for (let k = 0; k < 3; k++) for (let j = 0; j <= segs; j++) {
    const a = (j / segs) * Math.PI * 2;
    pos.push(Math.sin(a) * radii[k], heightAt(a, k), Math.cos(a) * radii[k]);
  }
  for (let k = 0; k < 2; k++) for (let j = 0; j < segs; j++) {
    const a = k * (segs + 1) + j, b = a + segs + 1;
    idx.push(a, b, b + 1, a, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();

/* ── js/tree.js ── */
/* SEASONS tree: space colonisation growth, pipe-model radii, parallel-transport tubes with bark. */

/** Grows the branch skeleton. Returns flat node arrays; parents always have a lower index than children. */
function growSkeleton() {
  const C = CONFIG.tree, rnd = mulberry32(CONFIG.seed);
  const y0 = CONFIG.hill.h;
  const cc = new THREE.Vector3(0, y0 + C.crown.y, 0);

  /* attractors: a dome-shaped crown, denser toward its shell so leaves sit on the outside */
  const A = [];
  const nA = pick(C.attractors, C.attractorsMobile);
  while (A.length < nA) {
    const u = rnd() * 2 - 1, v = rnd() * 2 - 1, w = rnd() * 2 - 1, d2 = u * u + v * v + w * w;
    if (d2 > 1) continue;
    if (Math.sqrt(d2) < C.crown.shell && rnd() > 0.2) continue;
    if (v < -0.55 && rnd() > 0.25) continue;
    A.push({ p: new THREE.Vector3(cc.x + u * C.crown.rx, cc.y + v * C.crown.ry, cc.z + w * C.crown.rz), alive: true });
  }

  const pos = [], parent = [], children = [];
  const add = (p, par) => { pos.push(p); parent.push(par); children.push([]); if (par >= 0) children[par].push(pos.length - 1); return pos.length - 1; };

  /* trunk: leaning, gently curving, grows until the crown is within reach */
  let cur = add(new THREE.Vector3(0, y0 - 0.4, 0), -1);
  const lean = new THREE.Vector3(C.trunkLean[0], 1, C.trunkLean[1]).normalize();
  const nearAny = (p) => A.some((a) => a.p.distanceTo(p) < C.influence);
  for (let k = 0; k < 60 && !nearAny(pos[cur]); k++) {
    const d = lean.clone().add(new THREE.Vector3(Math.sin(k * 0.45) * 0.12, 0, Math.cos(k * 0.3) * 0.1)).normalize();
    cur = add(pos[cur].clone().addScaledVector(d, C.step), cur);
  }

  /* spatial hash of nodes, cell size = influence radius */
  const cell = C.influence, grid = new Map();
  const keyOf = (x, y, z) => ((Math.floor(x / cell) + 512) * 1024 + (Math.floor(y / cell) + 512)) * 1024 + (Math.floor(z / cell) + 512);
  const insert = (i) => { const p = pos[i], k = keyOf(p.x, p.y, p.z); if (!grid.has(k)) grid.set(k, []); grid.get(k).push(i); };
  pos.forEach((_, i) => insert(i));
  const nearest = (p) => {
    let best = -1, bd = C.influence;
    const cx = Math.floor(p.x / cell), cy = Math.floor(p.y / cell), cz = Math.floor(p.z / cell);
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
      const list = grid.get(((cx + dx + 512) * 1024 + (cy + dy + 512)) * 1024 + (cz + dz + 512));
      if (!list) continue;
      for (const i of list) { const d = pos[i].distanceTo(p); if (d < bd) { bd = d; best = i; } }
    }
    return [best, bd];
  };

  const up = new THREE.Vector3(0, 1, 0);
  for (let iter = 0; iter < C.maxIter; iter++) {
    const pull = new Map();
    for (const a of A) {
      if (!a.alive) continue;
      const [i, d] = nearest(a.p);
      if (i < 0) continue;
      if (d < C.kill) { a.alive = false; continue; }
      const v = a.p.clone().sub(pos[i]).normalize();
      if (!pull.has(i)) pull.set(i, new THREE.Vector3());
      pull.get(i).add(v);
    }
    if (!pull.size) break;
    let grew = 0;
    for (const [i, sum] of pull) {
      const d = sum.normalize().addScaledVector(up, C.tropism)
        .add(new THREE.Vector3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).multiplyScalar(C.jitter)).normalize();
      const np = pos[i].clone().addScaledVector(d, C.step);
      if (children[i].some((c) => pos[c].distanceTo(np) < C.step * 0.35)) continue;
      insert(add(np, i));
      grew++;
    }
    if (!grew) break;
  }

  /* pipe model radii, trunk flare near the ground */
  const n = pos.length, r = new Float32Array(n), depth = new Int16Array(n), size = new Int32Array(n).fill(1);
  for (let i = n - 1; i >= 0; i--) {
    const ch = children[i];
    if (!ch.length) { r[i] = C.tipR; depth[i] = 0; continue; }
    let s = 0, dmin = 999;
    for (const c of ch) { s += Math.pow(r[c], C.pipeExp); dmin = Math.min(dmin, depth[c]); size[i] += size[c]; }
    r[i] = Math.pow(s, 1 / C.pipeExp);
    depth[i] = dmin + 1;
  }
  for (let i = 0; i < n; i++) {
    const h = (pos[i].y - (y0 - 0.4)) / C.flareH;
    if (h < 1) r[i] *= 1 + (C.flareR - 1) * Math.pow(1 - Math.max(h, 0), 2);
  }

  /* main child = thickest; used for chains and for smoothing */
  const main = children.map((ch) => (ch.length ? ch.reduce((m, c) => (r[c] > r[m] ? c : m), ch[0]) : -1));
  for (let pass = 0; pass < C.smoothPasses; pass++) {
    const next = pos.map((p) => p.clone());
    for (let i = 1; i < n; i++) {
      if (main[i] < 0 || parent[i] < 0) continue;
      next[i].copy(pos[i]).multiplyScalar(0.5).addScaledVector(pos[parent[i]], 0.25).addScaledVector(pos[main[i]], 0.25);
    }
    for (let i = 0; i < n; i++) pos[i].copy(next[i]);
  }

  const rMax = r[0];
  const flex = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const thin = Math.pow(clamp01(1 - r[i] / 0.32), 2.2);
    flex[i] = thin * smooth(seg(pos[i].y, y0 + 2.5, y0 + C.crown.y + C.crown.ry)) + 0.04 * smooth(seg(pos[i].y, y0, y0 + 6));
  }
  return { pos, parent, children, main, r, depth, size, flex, rMax, cc, n };
}

/** Bark canvas: grey-brown with horizontal lenticels (cherry-like) and faint vertical fissures. */
function barkTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const x = c.getContext('2d'), rnd = mulberry32(CONFIG.seed + 1);
  x.fillStyle = '#e4ded6'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 90; i++) {
    x.strokeStyle = `rgba(70,55,45,${0.08 + rnd() * 0.14})`; x.lineWidth = 1 + rnd() * 2.5;
    const px = rnd() * 256; x.beginPath(); x.moveTo(px, 0);
    for (let y = 0; y <= 256; y += 16) x.lineTo(px + Math.sin(y * 0.05 + i) * 4, y);
    x.stroke();
  }
  for (let i = 0; i < 140; i++) {
    x.fillStyle = `rgba(${rnd() < 0.5 ? '60,45,38' : '235,228,220'},${0.35 + rnd() * 0.35})`;
    const w = 8 + rnd() * 22;
    x.fillRect(rnd() * 256, rnd() * 256, w, 1.5 + rnd() * 1.5);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

/** One tube per chain (follows the thickest child), rings oriented with parallel transport. */
function barkGeometry(sk) {
  const C = CONFIG.tree, rnd = mulberry32(CONFIG.seed + 2);
  const chains = [], stack = [[0, -1]];
  sk.drawn = new Uint8Array(sk.n);
  while (stack.length) {
    const [start, from] = stack.pop();
    const pts = from >= 0 ? [from] : [];
    let i = start;
    for (;;) {
      pts.push(i);
      /* side shoots of only a node or two read as thorns; leave them out of the wood (foliage still uses them) */
      for (const c of sk.children[i]) if (c !== sk.main[i] && sk.size[c] >= C.minTwig) stack.push([c, i]);
      if (sk.main[i] < 0) break;
      i = sk.main[i];
    }
    if (pts.length >= 2) { chains.push(pts); for (const k of pts) sk.drawn[k] = 1; }
  }

  const P = [], N = [], UV = [], F = [], COL = [], I = [];
  const bark = new THREE.Color(C.bark), dark = new THREE.Color(C.barkDark), moss = new THREE.Color(C.moss), young = new THREE.Color('#7b4a3c');
  const tmp = new THREE.Color();
  for (const ch of chains) {
    const r0 = sk.r[ch[1]];
    const segs = C.rings.find(([lim]) => r0 > lim)[1];
    const radius = ch.map((k, j) => (j === 0 && ch.length > 1 ? sk.r[ch[1]] * 1.08 : sk.r[k]) * (j === ch.length - 1 && !sk.children[k].length ? 0.3 : 1));
    const pts = ch.map((k) => sk.pos[k]);
    const tangents = pts.map((p, j) => pts[Math.min(j + 1, pts.length - 1)].clone().sub(pts[Math.max(j - 1, 0)]).normalize());
    let normal = new THREE.Vector3(1, 0, 0);
    if (Math.abs(tangents[0].x) > 0.9) normal.set(0, 0, 1);
    normal.sub(tangents[0].clone().multiplyScalar(normal.dot(tangents[0]))).normalize();
    const base = P.length / 3;
    let len = 0;
    const twist = rnd() * Math.PI * 2;
    for (let j = 0; j < pts.length; j++) {
      if (j > 0) {
        const axis = new THREE.Vector3().crossVectors(tangents[j - 1], tangents[j]);
        const s = axis.length();
        if (s > 1e-5) normal.applyAxisAngle(axis.normalize(), Math.asin(Math.min(1, s)));
        len += pts[j].distanceTo(pts[j - 1]);
      }
      const T = tangents[j], B = new THREE.Vector3().crossVectors(T, normal).normalize();
      const rr = radius[j], k = ch[j];
      const thin = clamp01(1 - rr / 0.12);
      for (let s = 0; s <= segs; s++) {
        const a = (s / segs) * Math.PI * 2 + twist;
        const dir = normal.clone().multiplyScalar(Math.cos(a)).addScaledVector(B, Math.sin(a));
        const wob = 1 + 0.06 * Math.sin(a * 3 + len * 2.3) * (1 - thin);
        const p = pts[j].clone().addScaledVector(dir, rr * wob);
        P.push(p.x, p.y, p.z); N.push(dir.x, dir.y, dir.z);
        UV.push(s / segs * Math.max(1, Math.round(rr * 9)), len / Math.max(0.25, rr * 4.5));
        F.push(sk.flex[k]);
        tmp.copy(bark).lerp(dark, 0.35 * (0.5 - 0.5 * dir.y)).lerp(young, thin * 0.7);
        if (rr > 0.14) tmp.lerp(moss, clamp01(-dir.z * 0.7 + 0.1) * 0.45 * smooth(seg(p.y - CONFIG.hill.h, 3.2, 0.6)));
        COL.push(tmp.r, tmp.g, tmp.b);
      }
    }
    const ring = segs + 1;
    for (let j = 0; j < pts.length - 1; j++) for (let s = 0; s < segs; s++) {
      const a = base + j * ring + s, b = a + ring;
      I.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(UV, 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(COL, 3));
  g.setAttribute('aFlex', new THREE.Float32BufferAttribute(F, 1));
  g.setIndex(I);
  return g;
}

const SK = growSkeleton();
const barkMap = barkTexture();
const tree = new THREE.Mesh(
  barkGeometry(SK),
  patchStandard(new THREE.MeshStandardMaterial({ vertexColors: true, map: barkMap, bumpMap: barkMap, bumpScale: 2.2, roughness: 0.92 }), { sway: true, snow: true }),
);
tree.castShadow = true;
tree.receiveShadow = true;
tree.customDepthMaterial = swayDepthMaterial();
tree.frustumCulled = false;
scene.add(tree);

/** Picks skeleton nodes near branch tips, above the trunk, weighted toward thinner wood. */
function tipNodes(maxDepth) {
  const out = [];
  for (let i = 0; i < SK.n; i++) if (SK.drawn[i] && SK.depth[i] <= maxDepth && SK.pos[i].y > CONFIG.hill.h + 3.2) out.push(i);
  return out;
}

/* SEASONS foliage: canvas-drawn leaf and blossom cards, instanced, animated entirely in the vertex shader. */

function canvasTexture(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  /* canvas pixels are premultiplied; keep them so, mipmaps then average without dark fringes, shader divides */
  t.premultiplyAlpha = true;
  return t;
}

/** Leaf: stem at the bottom, pointed tip at the top, light body with darker midrib and veins (tinted per instance). */

/** Shared vertex header for instanced cards: attributes, shadow coord, fog. */
const CARD_HEAD = /* glsl */ `
  ${GLSL_COMMON}
  uniform mat4 uShadowMatrix;
  uniform vec3 uCrownC, uCrownR, uR0, uR1, uR2, uR3, uR4, uYoung, uDead;
  uniform vec2 uSize;
  uniform float uBudSize, uPSize;
  attribute vec3 aPos;
  attribute vec3 aDir;
  attribute vec4 aRnd;
  attribute float aFlex;
  varying vec2 vUv;
  varying vec3 vCol;
  varying vec3 vN;
  varying float vAO;
  varying vec3 vWP;
  varying vec4 vSC;
  #include <fog_pars_vertex>
  /* card basis around the facing direction n, spun by ang */
  void cardBasis(vec3 n, float ang, out vec3 T, out vec3 B) {
    vec3 up = abs(n.y) > .95 ? vec3(1., 0., 0.) : vec3(0., 1., 0.);
    vec3 t = normalize(cross(up, n)), b = cross(n, t);
    T = t * cos(ang) + b * sin(ang);
    B = b * cos(ang) - t * sin(ang);
  }
`;
const CARD_TAIL = /* glsl */ `
  vWP = pos;
  vSC = uShadowMatrix * vec4(pos, 1.);
  vec4 mvPosition = viewMatrix * vec4(pos, 1.);
  gl_Position = projectionMatrix * mvPosition;
  #include <fog_vertex>
`;

const CARD_FRAG = /* glsl */ `
  ${GLSL_COMMON}
  #include <packing>
  ${GLSL_SHADOW}
  ${GLSL_FOLIAGE_LIGHT}
  #include <fog_pars_fragment>
  uniform sampler2D uTex;
  uniform float uTrans;
  uniform float uSelf;
  varying vec2 vUv;
  varying vec3 vCol;
  varying vec3 vN;
  varying float vAO;
  varying vec3 vWP;
  varying vec4 vSC;
  void main() {
    vec4 tx = texture2D(uTex, vUv);
    if (tx.a < .42) discard;
    tx.rgb /= max(tx.a, 1e-3);
    vec3 N = normalize(vN);
    if (dot(N, cameraPosition - vWP) < 0.) N = -N;
    float sh = shadowAt(vSC, .0022);
    vec3 c = foliageLight(vCol * tx.rgb, N, vAO, sh, uTrans, vWP);
    c += vCol * tx.rgb * (uHemiSky + uSunCol * .25) * uSelf * .12;
    gl_FragColor = vec4(c, smoothstep(.42, .7, tx.a));
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
    #include <fog_fragment>
  }
`;
const CARD_DEPTH_FRAG = /* glsl */ `
  #include <packing>
  uniform sampler2D uTex;
  varying vec2 vUv;
  void main() {
    if (texture2D(uTex, vUv).a < .42) discard;
    gl_FragColor = packDepthToRGBA(gl_FragCoord.z);
  }
`;

/** Builds an instanced card mesh from per-instance arrays and a vertex body. */
function cardMesh({ attrs, count, body, tex, extraUniforms = {}, trans, self, center = false }) {
  const plane = new THREE.PlaneGeometry(1, 1);
  if (!center) plane.translate(0, 0.5, 0);
  const g = new THREE.InstancedBufferGeometry();
  g.index = plane.index;
  g.setAttribute('position', plane.getAttribute('position'));
  g.setAttribute('uv', plane.getAttribute('uv'));
  for (const [name, [arr, size]] of Object.entries(attrs)) g.setAttribute(name, new THREE.InstancedBufferAttribute(arr, size));
  g.instanceCount = count;
  const uniforms = { ...U, ...fogUniforms(), uTex: { value: tex }, uTrans: { value: trans }, uSelf: { value: self }, ...extraUniforms };
  const vertexShader = `${CARD_HEAD}\nvoid main() {\n${body}\n${CARD_TAIL}\n}`;
  const mat = new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader: CARD_FRAG, side: THREE.DoubleSide, fog: true, alphaToCoverage: true });
  const mesh = new THREE.Mesh(g, mat);
  mesh.frustumCulled = false;
  mesh.castShadow = true;
  mesh.customDepthMaterial = new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader: CARD_DEPTH_FRAG, side: THREE.DoubleSide });
  return mesh;
}

/** Scatters per-instance data around tip nodes. */
function scatterOnTips(count, maxDepth, spread, seed) {
  const rnd = mulberry32(seed), tips = tipNodes(maxDepth);
  const pos = new Float32Array(count * 3), dir = new Float32Array(count * 3), rn = new Float32Array(count * 4), flex = new Float32Array(count);
  const C = CONFIG.tree.crown, cc = SK.cc, v = new THREE.Vector3();
  for (let i = 0; i < count; i++) {
    /* anchor on the twig itself, somewhere between a tip node and its parent */
    const k = tips[Math.floor(rnd() * tips.length)], pk = SK.parent[k] >= 0 ? SK.parent[k] : k, u = rnd();
    const p = SK.pos[k].clone().lerp(SK.pos[pk], u);
    const o = new THREE.Vector3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).multiplyScalar(spread * 2);
    pos.set([p.x + o.x, p.y + o.y, p.z + o.z], i * 3);
    v.set((p.x - cc.x) / C.rx, (p.y - cc.y) / C.ry, (p.z - cc.z) / C.rz).normalize()
      .add(new THREE.Vector3(rnd() - 0.5, rnd() - 0.5 + 0.35, rnd() - 0.5).multiplyScalar(1.6)).normalize();
    dir.set([v.x, v.y, v.z], i * 3);
    rn.set([rnd(), rnd(), rnd(), rnd()], i * 4);
    flex[i] = lerp(SK.flex[k], SK.flex[pk], u);
  }
  return { pos, dir, rn, flex };
}

const crownUniforms = {
  uCrownC: { value: SK.cc.clone() },
  uCrownR: { value: new THREE.Vector3(CONFIG.tree.crown.rx, CONFIG.tree.crown.ry, CONFIG.tree.crown.rz) },
};

/* ───────── leaves: grow, turn, fall, lie on the ground, vanish under snow ───────── */
const leaves = (() => {
  const L = CONFIG.leaves, count = pick(L.count, L.countMobile);
  const d = scatterOnTips(count, L.tipDepth, L.spread, CONFIG.seed + 11);
  const ramp = CONFIG.leafRamp.map((c) => ({ value: new THREE.Color(c) }));
  return cardMesh({
    count, tex: leafTex, trans: 0.85, self: 0.15,
    attrs: { aPos: [d.pos, 3], aDir: [d.dir, 3], aRnd: [d.rn, 4], aFlex: [d.flex, 1] },
    extraUniforms: {
      ...crownUniforms, uR0: ramp[0], uR1: ramp[1], uR2: ramp[2], uR3: ramp[3], uR4: ramp[4],
      uYoung: { value: new THREE.Color(CONFIG.leafYoung) }, uDead: { value: new THREE.Color(CONFIG.leafDead) },
      uSize: { value: new THREE.Vector2(...L.size) },
    },
    body: /* glsl */ `
      float g = smoothstep(aRnd.x * .45, aRnd.x * .45 + .55, uGrow);
      float f = clamp((uFall - aRnd.w * .86) / .14, 0., 1.);
      float landed = step(.999, f);
      vec3 n = normalize(aDir), T, B;
      float ang = aRnd.z * 6.2831;
      cardBasis(n, ang, T, B);
      float flut = sin(uTime * (2.5 + aRnd.y * 4.) + aRnd.z * 40.) * (.14 + .45 * uGust + .3 * length(uWind));
      B = normalize(B + n * flut);
      vec3 N = normalize(cross(T, B));
      vec3 pos = aPos + swayOffset(aPos, aFlex);
      if (f > 0.) {
        float da = aRnd.y * 6.2831;
        vec2 landXZ = aPos.xz + vec2(cos(da), sin(da)) * (.3 + 2.4 * aRnd.x) + vec2(1.1, .5) * aRnd.z;
        float landY = hillH(landXZ) + .02 + aRnd.w * .03;
        float e = f * f * (3. - 2. * f), air = sin(3.1416 * f);
        pos.xz = mix(pos.xz, landXZ, e) + vec2(cos(f * 9. + aRnd.z * 6.), sin(f * 9. + aRnd.z * 6.)) * .7 * air + (uWind.xz * 2.2 + normalize(uWind.xz + 1e-4) * uGust * 2.) * air;
        pos.y = mix(pos.y, landY, f);
        float tum = f * 11. * (.5 + aRnd.x), k = smoothstep(.86, 1., f);
        vec3 Ta = normalize(T * cos(tum) + N * sin(tum));
        T = normalize(mix(Ta, vec3(cos(ang), 0., sin(ang)), k));
        B = normalize(mix(B, vec3(-sin(ang), 0., cos(ang)), k));
        N = normalize(cross(T, B));
      }
      float size = mix(uSize.x, uSize.y, aRnd.x) * g * (1. - smoothstep(.25, .6, uSnow) * landed);
      pos += (T * position.x + B * position.y) * size;
      /* each leaf turns quickly at its own moment and stops at its own peak: some yellow, some orange, some red */
      float a = smoothstep(aRnd.y * .68, aRnd.y * .68 + .32, uAutumn) * mix(.5, 1., fract(aRnd.x * 7.31));
      float r4 = a * 4.;
      vec3 turned = r4 < 1. ? mix(uR0, uR1, r4) : (r4 < 2. ? mix(uR1, uR2, r4 - 1.) : (r4 < 3. ? mix(uR2, uR3, r4 - 2.) : mix(uR3, uR4, r4 - 3.)));
      vec3 col = a > 0. ? turned : mix(uYoung, uR0, smoothstep(.5, 1., uGrow));
      col *= .8 + .4 * fract(aRnd.z * 13.7);
      col = mix(col, uDead, landed * (.3 + .4 * uSnow));
      vCol = col;
      vec3 q = (aPos - uCrownC) / uCrownR;
      vAO = mix(.3, 1., smoothstep(.2, 1.05, length(q))) * mix(.72, 1., smoothstep(-.8, .6, q.y));
      vAO = mix(vAO, .85, step(.001, f));
      vN = N;
      vUv = uv;`,
  });
})();

/* ───────── blossoms: buds swell, open, shed ───────── */
const blossoms = (() => {
  const Bc = CONFIG.blossoms, count = pick(Bc.count, Bc.countMobile);
  const d = scatterOnTips(count, Bc.tipDepth, Bc.spread, CONFIG.seed + 21);
  return {
    data: d,
    mesh: cardMesh({
      count, tex: blossomTex, trans: 0.95, self: 1,
      attrs: { aPos: [d.pos, 3], aDir: [d.dir, 3], aRnd: [d.rn, 4], aFlex: [d.flex, 1] },
      extraUniforms: { ...crownUniforms, uSize: { value: new THREE.Vector2(...Bc.size) }, uBudSize: { value: Bc.budSize } },
      body: /* glsl */ `
        float open = smoothstep(aRnd.x * .5, aRnd.x * .5 + .38, uBloom);
        float shed = smoothstep(aRnd.w * .62, aRnd.w * .62 + .32, uShed);
        float bud = smoothstep(aRnd.y * .45, aRnd.y * .45 + .5, uBud);
        float flower = step(.3, open);
        float size = mix(uBudSize * bud * (.7 + .5 * aRnd.z), mix(uSize.x, uSize.y, aRnd.x) * mix(.45, 1., smoothstep(.3, 1., open)), flower) * (1. - shed);
        vec3 n = normalize(aDir), T, B;
        cardBasis(n, aRnd.z * 6.2831, T, B);
        float flut = sin(uTime * (2. + aRnd.y * 3.) + aRnd.z * 30.) * (.08 + .3 * uGust);
        B = normalize(B + n * flut);
        vec3 pos = aPos + swayOffset(aPos, aFlex);
        vec2 c = position.xy - vec2(0., .5 * flower);
        pos += (T * c.x + B * c.y) * size;
        vUv = vec2((uv.x + flower) / 3., uv.y);
        vCol = mix(vec3(1., .96, .98), vec3(1., .76, .86), aRnd.y);
        vec3 q = (aPos - uCrownC) / uCrownR;
        vAO = mix(.45, 1., smoothstep(.2, 1., length(q)));
        vN = normalize(cross(T, B));`,
    }),
  };
})();

/* ───────── petals adrift: spawn at blossoms, fall with the wind, fade on the grass ───────── */
const petals = (() => {
  const count = pick(CONFIG.petals.count, CONFIG.petals.countMobile), rnd = mulberry32(CONFIG.seed + 31);
  const src = blossoms.data, nSrc = src.pos.length / 3;
  const pos = new Float32Array(count * 3), dir = new Float32Array(count * 3), rn = new Float32Array(count * 4), flex = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const k = Math.floor(rnd() * nSrc);
    pos.set(src.pos.subarray(k * 3, k * 3 + 3), i * 3);
    dir.set([rnd() - 0.5, rnd(), rnd() - 0.5], i * 3);
    rn.set([rnd(), rnd(), rnd(), rnd()], i * 4);
  }
  return cardMesh({
    count, tex: blossomTex, trans: 0.95, self: 1, center: true,
    attrs: { aPos: [pos, 3], aDir: [dir, 3], aRnd: [rn, 4], aFlex: [flex, 1] },
    extraUniforms: { uPSize: { value: CONFIG.petals.size } },
    body: /* glsl */ `
      float on = step(aRnd.z, uPetal);
      float life = fract(uTime * (.045 + .05 * aRnd.x) + aRnd.y);
      float fl = min(life, .8);
      vec3 pos = aPos;
      float ground = hillH(pos.xz) + .03;
      vec2 wind = vec2(.9, .35) + uWind.xz * 1.6 + normalize(uWind.xz + 1e-4) * uGust * 2.;
      pos.xz += wind * fl * 5. + vec2(sin(fl * 20. + aRnd.w * 9.), cos(fl * 17. + aRnd.w * 5.)) * .45;
      pos.y = max(ground, aPos.y - fl * 1.25 * (aPos.y - ground));
      float spin = uTime * (2. + aRnd.x * 3.) * step(life, .8) + aRnd.w * 6.28;
      vec3 n = normalize(aDir + vec3(sin(spin), cos(spin * .7), 0.)), T, B;
      cardBasis(n, spin * .5, T, B);
      float size = uPSize * on * smoothstep(1., .9, life) * smoothstep(0., .03, life);
      pos += (T * position.x + B * position.y) * size;
      vUv = vec2((uv.x + 2.) / 3., uv.y);
      vCol = vec3(1.);
      vAO = .9;
      vN = normalize(cross(T, B));`,
  });
})();

scene.add(leaves, blossoms.mesh, petals);

/* ── js/weather.js ── */
/* SEASONS weather and ground cover: grass blades, rain streaks, rippling puddles, snowfall, fireflies. */

/* ───────── grass: instanced tapered blades, bend with wind, sink under snow ───────── */
const grass = (() => {
  const G = CONFIG.grass, count = pick(G.count, G.countMobile), rnd = mulberry32(CONFIG.seed + 41);
  const blade = new THREE.BufferGeometry();
  const bx = [-1, 1, -0.75, 0.75, -0.42, 0.42, 0], by = [0, 0, 0.35, 0.35, 0.7, 0.7, 1];
  blade.setAttribute('position', new THREE.Float32BufferAttribute(bx.flatMap((x, i) => [x, by[i], 0]), 3));
  blade.setIndex([0, 1, 2, 1, 3, 2, 2, 3, 4, 3, 5, 4, 4, 5, 6]);
  const g = new THREE.InstancedBufferGeometry();
  g.index = blade.index;
  g.setAttribute('position', blade.getAttribute('position'));
  const pos = new Float32Array(count * 3), rn = new Float32Array(count * 4);
  for (let i = 0; i < count; i++) {
    const near = rnd() < 0.7;
    const r0 = near ? G.r[0] : 13, r1 = near ? 13 : G.r[1];
    const r = Math.sqrt(lerp(r0 * r0, r1 * r1, rnd())), a = rnd() * Math.PI * 2;
    const x = Math.sin(a) * r, z = Math.cos(a) * r;
    pos.set([x, hillY(x, z), z], i * 3);
    rn.set([rnd(), rnd(), rnd(), rnd()], i * 4);
  }
  g.setAttribute('aPos', new THREE.InstancedBufferAttribute(pos, 3));
  g.setAttribute('aRnd', new THREE.InstancedBufferAttribute(rn, 4));
  g.instanceCount = count;
  const mat = new THREE.ShaderMaterial({
    side: THREE.DoubleSide, fog: true,
    uniforms: { ...U, ...fogUniforms() },
    vertexShader: /* glsl */ `
      ${GLSL_COMMON}
      uniform mat4 uShadowMatrix;
      attribute vec3 aPos;
      attribute vec4 aRnd;
      varying vec3 vCol;
      varying vec3 vWP;
      varying vec4 vSC;
      varying float vY;
      #include <fog_pars_vertex>
      void main() {
        float h = mix(${f3(G.h[0])}, ${f3(G.h[1])}, aRnd.x) * (1. - smoothstep(.12, .6, uSnow + (aRnd.y - .5) * .25));
        float flower = step(.94, aRnd.w) * uFlowers;
        h *= mix(1., .75, flower);
        float yaw = aRnd.y * 6.2831, y = position.y;
        vec3 side = vec3(cos(yaw), 0., sin(yaw));
        vec3 pos = aPos + side * position.x * .028 * (1. + flower * 1.6 * step(.9, y));
        pos.y += y * h;
        vec2 lean = vec2(cos(yaw * 1.7), sin(yaw * 1.7)) * .3;
        vec2 wind = uWind.xz * .9 + normalize(uWind.xz + 1e-4) * uGust * .9;
        lean += wind * (.6 + .4 * sin(uTime * 2.3 + aPos.x * .7 + aPos.z * .5));
        pos.xz += lean * y * y * h;
        pos.y -= dot(lean, lean) * y * y * h * .25;
        vec3 col = mix(uGrass * .45, uGrassTip, y) * (.78 + .44 * aRnd.z);
        vec3 fc = aRnd.z > .5 ? vec3(1., .97, .92) : vec3(1., .82, .2);
        vCol = mix(col, fc, flower * step(.9, y));
        vY = y;
        vWP = pos;
        vSC = uShadowMatrix * vec4(pos, 1.);
        vec4 mvPosition = viewMatrix * vec4(pos, 1.);
        gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: /* glsl */ `
      ${GLSL_COMMON}
      #include <packing>
      ${GLSL_SHADOW}
      #include <fog_pars_fragment>
      varying vec3 vCol;
      varying vec3 vWP;
      varying vec4 vSC;
      varying float vY;
      void main() {
        float sh = shadowAt(vSC, .002);
        vec3 N = normalize(vec3(0., 1., 0.) + (cameraPosition - vWP) * .02);
        vec3 lit = mix(uHemiGround, uHemiSky, .8) * mix(.45, 1., vY) + uSunCol * (max(dot(N, uSunDir), 0.) * .8 + .25) * sh;
        vec3 c = vCol * lit * ${f3(1 / Math.PI)} + vCol * windowLight(vWP) * .3;
        c *= mix(1., ${f3(CONFIG.wetDark)}, uWet * .5);
        gl_FragColor = vec4(c, 1.);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
        #include <fog_fragment>
      }`,
  });
  const m = new THREE.Mesh(g, mat);
  m.frustumCulled = false;
  return m;
})();
scene.add(grass);

/* ───────── rain: streaks in a box that wraps around the camera target ───────── */
const rain = (() => {
  const R = CONFIG.rain, count = pick(R.count, R.countMobile), rnd = mulberry32(CONFIG.seed + 51);
  const pos = new Float32Array(count * 6), end = new Float32Array(count * 2);
  for (let i = 0; i < count; i++) {
    const x = rnd() * R.box[0], y = rnd() * R.box[1], z = rnd() * R.box[2];
    pos.set([x, y, z, x, y, z], i * 6);
    end.set([0, 1], i * 2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aEnd', new THREE.BufferAttribute(end, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, fog: true,
    uniforms: { ...U, ...fogUniforms(), uBox: { value: new THREE.Vector3(...R.box) } },
    vertexShader: /* glsl */ `
      ${GLSL_COMMON}
      uniform vec3 uBox;
      attribute float aEnd;
      varying float vA;
      #include <fog_pars_vertex>
      void main() {
        vec3 p = position;
        p.y = mod(p.y - uTime * 16., uBox.y);
        vec3 wrapped = mod(p - uCamTarget + uBox * .5, uBox) - uBox * .5 + uCamTarget;
        wrapped.y = uCamTarget.y - 6. + p.y;
        vec3 fallDir = normalize(vec3(uWind.x * .5, -1., uWind.z * .5));
        wrapped -= fallDir * aEnd * .55;
        vA = uRain * (1. - aEnd * .7) * step(hillH(wrapped.xz), wrapped.y);
        vec4 mvPosition = viewMatrix * vec4(wrapped, 1.);
        gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: /* glsl */ `
      #include <fog_pars_fragment>
      varying float vA;
      void main() {
        gl_FragColor = vec4(vec3(.82, .88, .95), vA * .55);
        #include <colorspace_fragment>
        #include <fog_fragment>
      }`,
  });
  const m = new THREE.LineSegments(g, mat);
  m.frustumCulled = false;
  return m;
})();
scene.add(rain);

/* ───────── puddles: sky reflection plus expanding ripple rings while it rains ───────── */
const PUDDLE = { uZen: { value: new THREE.Color() }, uHor: { value: new THREE.Color() } };
const puddles = CONFIG.puddles.map(([px, pz, rad], i) => {
  const geo = new THREE.CircleGeometry(1, 48);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, fog: true,
    uniforms: { ...U, ...PUDDLE, ...fogUniforms(), uC: { value: new THREE.Vector3(px, 0, pz) }, uRad: { value: rad }, uSeed: { value: i * 7.3 } },
    vertexShader: /* glsl */ `
      ${GLSL_COMMON}
      uniform vec3 uC;
      uniform float uRad;
      varying vec2 vL;
      varying vec3 vWP;
      #include <fog_pars_vertex>
      void main() {
        float wob = 1. + .18 * sin(atan(position.z, position.x) * 3. + uC.x) + .1 * sin(atan(position.z, position.x) * 5. + uC.z);
        vec3 p = uC + vec3(position.x * uRad * wob, 0., position.z * uRad * .72 * wob);
        p.y = hillH(p.xz) + .025;
        vL = position.xz * wob;
        vWP = p;
        vec4 mvPosition = viewMatrix * vec4(p, 1.);
        gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: /* glsl */ `
      ${GLSL_COMMON}
      uniform vec3 uZen, uHor;
      uniform float uSeed;
      varying vec2 vL;
      varying vec3 vWP;
      #include <fog_pars_fragment>
      void main() {
        float edge = smoothstep(1., .72, length(vL / vec2(1., 1.)));
        vec2 q = vWP.xz * 1.6;
        float ring = 0.;
        for (int k = 0; k < 4; k++) {
          vec2 cell = floor(q + float(k) * .37);
          vec2 f = fract(q + float(k) * .37) - .5;
          float h = hash12(cell + uSeed + float(k) * 11.);
          vec2 c0 = vec2(hash12(cell + 2.3), hash12(cell + 5.9)) - .5;
          float t = fract(uTime * (.9 + h * .6) + h);
          float d = length(f - c0 * .5);
          ring += smoothstep(.035, 0., abs(d - t * .5)) * (1. - t) * step(.35, h);
        }
        ring *= uRain;
        vec3 V = normalize(cameraPosition - vWP);
        float fres = pow(1. - max(V.y, 0.), 3.);
        vec3 refl = mix(uZen, uHor, fres);
        vec3 col = refl * (.8 + ring * .8) + windowLight(vWP) * .4;
        gl_FragColor = vec4(col, edge * uWet * (.75 + ring * .25));
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
        #include <fog_fragment>
      }`,
  });
  const m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false;
  m.renderOrder = 1;
  scene.add(m);
  return m;
});

/* ───────── snowfall and fireflies share one soft point sprite shader ───────── */
function pointField({ count, box, seed, vertexBody, color, additive, sizePx }) {
  const rnd = mulberry32(seed), pos = new Float32Array(count * 3), rn = new Float32Array(count * 4);
  for (let i = 0; i < count; i++) {
    pos.set([rnd() * box[0], rnd() * box[1], rnd() * box[2]], i * 3);
    rn.set([rnd(), rnd(), rnd(), rnd()], i * 4);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aRnd', new THREE.BufferAttribute(rn, 4));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, fog: !additive,
    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    uniforms: { ...U, ...fogUniforms(), uBox: { value: new THREE.Vector3(...box) }, uCol: { value: new THREE.Color(color) }, uPx: { value: sizePx } },
    vertexShader: /* glsl */ `
      ${GLSL_COMMON}
      uniform vec3 uBox;
      uniform float uPx;
      attribute vec4 aRnd;
      varying float vA;
      #include <fog_pars_vertex>
      void main() {
        vec3 p; float a;
        ${vertexBody}
        vA = a;
        vec4 mvPosition = viewMatrix * vec4(p, 1.);
        gl_Position = projectionMatrix * mvPosition;
        gl_PointSize = uPx * (.6 + aRnd.w * .8) * ${f3(1)} / max(-mvPosition.z, .5) * (a > .001 ? 1. : 0.);
        #include <fog_vertex>
      }`,
    fragmentShader: /* glsl */ `
      uniform vec3 uCol;
      varying float vA;
      #include <fog_pars_fragment>
      void main() {
        float d = length(gl_PointCoord - .5);
        float m = smoothstep(.5, .1, d);
        gl_FragColor = vec4(uCol * (1. + smoothstep(.2, 0., d) * .6), m * vA);
        #include <colorspace_fragment>
        #include <fog_fragment>
      }`,
  });
  const m = new THREE.Points(g, mat);
  m.frustumCulled = false;
  return m;
}

const snowfall = pointField({
  count: pick(CONFIG.snow.count, CONFIG.snow.countMobile), box: CONFIG.snow.box, seed: CONFIG.seed + 61,
  color: '#ffffff', additive: false, sizePx: 55,
  vertexBody: /* glsl */ `
    p = position;
    p.y = mod(p.y - uTime * (.7 + aRnd.x * .6), uBox.y);
    p.x += sin(uTime * (.6 + aRnd.y) + aRnd.z * 9.) * .6 + uWind.x * p.y * .25;
    p.z += cos(uTime * (.5 + aRnd.x) + aRnd.w * 9.) * .6 + uWind.z * p.y * .25;
    p = mod(p - uCamTarget + uBox * .5, uBox) - uBox * .5 + uCamTarget;
    p.y = uCamTarget.y - 8. + mod(position.y - uTime * (.7 + aRnd.x * .6), uBox.y);
    a = uSnowFall * step(hillH(p.xz), p.y) * .95;`,
});
const fireflies = pointField({
  count: pick(CONFIG.fireflies.count, CONFIG.fireflies.countMobile), box: [1, 1, 1], seed: CONFIG.seed + 71,
  color: '#e6f57a', additive: true, sizePx: 150,
  vertexBody: /* glsl */ `
    float ang = aRnd.x * 6.2831 + uTime * .05 * (aRnd.y - .5), rad = 2.5 + aRnd.y * 11.;
    p = vec3(sin(ang) * rad, 0., cos(ang) * rad);
    p.x += sin(uTime * (.3 + aRnd.z * .4) + aRnd.w * 20.) * 1.1;
    p.z += cos(uTime * (.25 + aRnd.w * .4) + aRnd.z * 20.) * 1.1;
    p.y = hillH(p.xz) + .3 + aRnd.z * 2.6 + sin(uTime * .8 + aRnd.x * 30.) * .35;
    a = uFire * pow(max(sin(uTime * (1.2 + aRnd.w * 1.5) + aRnd.y * 40.), 0.), 4.);`,
});
scene.add(snowfall, fireflies);

/* ── js/birds.js ── */
/* SEASONS birds: small songbirds fly in along arcs, perch on outer branches, fly off in autumn. */
const birds = (() => {
  const rnd = mulberry32(CONFIG.seed + 81), count = CONFIG.birds.count;
  const bodyM = new THREE.MeshStandardMaterial({ color: '#46505f', roughness: 0.75 });
  const bellyM = new THREE.MeshStandardMaterial({ color: '#d9895a', roughness: 0.8 });
  const beakM = new THREE.MeshStandardMaterial({ color: '#e8b04a', roughness: 0.6 });
  const wingGeo = new THREE.BufferGeometry();
  wingGeo.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0.07, 0, 0, -0.08, 0.3, 0.01, -0.1, 0.22, 0.01, 0.02], 3));
  wingGeo.setIndex([0, 1, 2, 0, 2, 3]);
  wingGeo.computeVertexNormals();
  const wingM = new THREE.MeshStandardMaterial({ color: '#39414e', roughness: 0.8, side: THREE.DoubleSide });

  /* perches: medium outer branches in the upper crown */
  const perches = [];
  for (let i = 0; i < SK.n; i++) {
    const p = SK.pos[i], q = new THREE.Vector3((p.x - SK.cc.x) / CONFIG.tree.crown.rx, (p.y - SK.cc.y) / CONFIG.tree.crown.ry, (p.z - SK.cc.z) / CONFIG.tree.crown.rz);
    if (SK.r[i] > 0.035 && SK.r[i] < 0.09 && q.length() > 0.55 && q.y > -0.4) perches.push(i);
  }

  const list = [];
  for (let i = 0; i < count; i++) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), bodyM);
    body.scale.set(0.85, 0.85, 1.5);
    const belly = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), bellyM);
    belly.scale.set(0.9, 0.8, 1.3); belly.position.set(0, -0.025, 0.02);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), bodyM);
    head.position.set(0, 0.06, 0.12);
    const beak = new THREE.Mesh(new THREE.ConeGeometry(0.018, 0.06, 6), beakM);
    beak.rotation.x = Math.PI / 2; beak.position.set(0, 0.055, 0.19);
    const tail = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.012, 0.13), bodyM);
    tail.position.set(0, 0.01, -0.17); tail.rotation.x = -0.35;
    const wl = new THREE.Mesh(wingGeo, wingM), wr = new THREE.Mesh(wingGeo, wingM);
    wr.scale.x = -1;
    wl.position.set(0.05, 0.03, 0); wr.position.set(-0.05, 0.03, 0);
    g.add(body, belly, head, beak, tail, wl, wr);
    g.scale.setScalar(1.7);
    g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
    const perch = SK.pos[perches[Math.floor(rnd() * perches.length)]].clone().add(new THREE.Vector3(0, 0.14, 0));
    const a0 = rnd() * Math.PI * 2, a1 = a0 + Math.PI * (0.6 + rnd() * 0.8);
    list.push({
      g, wl, wr, head, perch,
      from: new THREE.Vector3(Math.sin(a0) * 60, 16 + rnd() * 10, Math.cos(a0) * 60),
      to: new THREE.Vector3(Math.sin(a1) * 70, 24 + rnd() * 10, Math.cos(a1) * 70),
      lift: 5 + rnd() * 5, phase: rnd() * 10, lag: i / count,
    });
    g.visible = false;
    scene.add(g);
  }

  const bez = (a, c, b, t, out) => out.copy(a).multiplyScalar((1 - t) ** 2).addScaledVector(c, 2 * (1 - t) * t).addScaledVector(b, t * t);
  const P = new THREE.Vector3(), Q = new THREE.Vector3(), C = new THREE.Vector3();

  /** arrive and leave are 0..1 for the whole flock; each bird takes its own slice. */
  function update(arrive, leave, time) {
    for (const b of list) {
      const ai = smooth(seg(arrive, b.lag * 0.45, b.lag * 0.45 + 0.55));
      const li = smooth(seg(leave, b.lag * 0.4, b.lag * 0.4 + 0.6));
      b.g.visible = ai > 0 && li < 1;
      if (!b.g.visible) continue;
      let t, A, B;
      if (li > 0) { t = li; A = b.perch; B = b.to; } else { t = ai; A = b.from; B = b.perch; }
      C.copy(A).lerp(B, 0.5).add(new THREE.Vector3(0, b.lift, 0));
      bez(A, C, B, t, P);
      bez(A, C, B, Math.min(1, t + 0.01), Q);
      const perched = li === 0 && ai >= 1;
      b.g.position.copy(P);
      if (!perched) {
        if (Q.distanceToSquared(P) > 1e-8) b.g.lookAt(Q);
        const flap = Math.sin(time * 16 + b.phase) * 0.9;
        b.wl.rotation.z = flap; b.wr.rotation.z = -flap;
        b.wl.scale.x = 1; b.wr.scale.x = -1;
      } else {
        b.g.rotation.set(0, b.phase + Math.sin(time * 0.5 + b.phase) * 0.4, 0);
        b.g.position.y += Math.abs(Math.sin(time * 3 + b.phase)) < 0.08 ? 0.02 : 0;
        b.wl.rotation.z = -0.45; b.wr.rotation.z = 0.45;
        b.wl.scale.x = 0.4; b.wr.scale.x = -0.4;
        b.head.rotation.y = Math.sin(time * 1.7 + b.phase * 3) * 0.6;
      }
    }
  }
  return { update };
})();

/* ── js/seasons.js ── */
/* SEASONS timeline: scroll state -> year clock -> every season uniform, light and sky colour. */
const TAU = Math.PI * 2;
const wrap4 = (t) => ((t % 4) + 4) % 4;

/** Foliage and ground state along the year clock. */
function yearState(t) {
  const Y = CONFIG.year, tt = wrap4(t);
  return {
    /* buds start swelling before the clock wraps, so measure them on a clock shifted into late winter */
    bud: smooth(seg(tt > 3.5 ? tt - 4 : tt, Y.bud[0], Y.bud[1])) * (tt < 2 || tt > 3.5 ? 1 : 0),
    bloom: smooth(seg(tt, Y.bloom[0], Y.bloom[1])),
    shed: smooth(seg(tt, Y.shed[0], Y.shed[1])),
    petal: plateau(tt, Y.petal),
    /* fallen leaves rot away under the snow, so they are gone before it melts */
    grow: smooth(seg(tt, Y.leaf[0], Y.leaf[1])) * (1 - smooth(seg(tt, 3.5, 3.78))),
    autumn: smooth(seg(tt, Y.autumn[0], Y.autumn[1])),
    fall: seg(tt, Y.fall[0], Y.fall[1]),
    snow: smooth(seg(tt, Y.snowIn[0], Y.snowIn[1])) * (1 - smooth(seg(tt, Y.snowOut[0], Y.snowOut[1]))),
    flowers: plateau(tt, Y.flowers),
    petalGround: plateau(tt, [0.55, 0.8, 0.95, 1.15]),
    litter: plateau(tt, [2.45, 3.0, 3.5, 3.8]),
    snowFall: plateau(tt, [3.1, 3.2, 3.62, 3.8]),
  };
}

/** Sky, sun and grass colours interpolated between the season keys. */
const SKY_KEYS = CONFIG.skyKeys.map(([t, zen, hor, sunC, el, gr, tip]) => ({
  t, zen: new THREE.Color(zen), hor: new THREE.Color(hor), sun: new THREE.Color(sunC), el, grass: new THREE.Color(gr), tip: new THREE.Color(tip),
}));
function skyAt(t) {
  const tt = wrap4(t);
  let k = 0;
  while (k < SKY_KEYS.length - 2 && tt > SKY_KEYS[k + 1].t) k++;
  const a = SKY_KEYS[k], b = SKY_KEYS[k + 1], m = smooth(seg(tt, a.t, b.t));
  return {
    zen: a.zen.clone().lerp(b.zen, m), hor: a.hor.clone().lerp(b.hor, m), sun: a.sun.clone().lerp(b.sun, m),
    el: lerp(a.el, b.el, m), grass: a.grass.clone().lerp(b.grass, m), tip: a.tip.clone().lerp(b.tip, m),
  };
}

const RAIN = { zen: new THREE.Color(CONFIG.rainSky.zenith), hor: new THREE.Color(CONFIG.rainSky.horizon) };
const DUSK = { zen: new THREE.Color(CONFIG.duskSky.zenith), hor: new THREE.Color(CONFIG.duskSky.horizon), sun: new THREE.Color(CONFIG.duskSky.sun) };
const NIGHT = { zen: new THREE.Color(CONFIG.nightSky.zenith), hor: new THREE.Color(CONFIG.nightSky.horizon), moon: new THREE.Color(CONFIG.nightSky.moon) };

/** Scene overlays (rain, dusk, night, birds) on top of the year clock. */
function overlays(id, p) {
  const O = CONFIG.overlay;
  const o = { rain: 0, wet: 0, dusk: 0, night: 0, fire: 0, snowFall: 0, arrive: 0, leave: 0, montage: 0 };
  if (id === 'spring') o.arrive = seg(p, ...O.birdsIn);
  if (id === 'summer') {
    o.arrive = 1;
    o.rain = plateau(p, O.summerRain);
    o.wet = plateau(p, O.summerWet);
    o.dusk = smooth(seg(p, ...O.summerDusk));
    o.fire = smooth(seg(p, ...O.fireflies));
  }
  if (id === 'autumn') {
    o.arrive = 1;
    o.leave = seg(p, ...O.birdsOut);
    o.dusk = 1 - smooth(seg(p, ...O.autumnDuskOut));
    o.fire = o.dusk * o.dusk;
  }
  if (id === 'winter') {
    o.snowFall = plateau(p, O.winterSnow);
    o.night = smooth(seg(p, ...O.winterNight));
  }
  if (id === 'year') {
    o.night = 1 - smooth(seg(p, ...O.yearNightOut));
    o.montage = plateau(p, [0, CONFIG.yearCam.blendIn, CONFIG.yearCam.blendOut, 1]);
  }
  if (id === 'finale') o.arrive = seg(p, ...O.finaleBirds);
  return o;
}

const CONFIG_SNOW = new THREE.Color(CONFIG.snowColor);
const yearPush = spring(CONFIG.velocity.stiffness, CONFIG.velocity.damping);
const env = { t: 0, montage: 0, night: 0 };
const tmpDir = new THREE.Vector3();

/** Writes the whole season into uniforms, lights and sky. */
function applySeason(st) {
  const [t0, t1] = CONFIG.sceneYear[st.id];
  const o = overlays(st.id, st.world);
  const V = CONFIG.velocity;
  const push = yearPush.step(reduce ? 0 : clamp(Math.abs(velocity()) * V.yearPush, 0, V.yearPushMax) * o.montage);
  const t = lerp(t0, t1, st.world) + push;
  const y = yearState(t), s = skyAt(t);
  env.t = t; env.montage = o.montage; env.night = o.night;

  U.uBud.value = y.bud; U.uBloom.value = y.bloom; U.uShed.value = y.shed; U.uPetal.value = y.petal;
  U.uGrow.value = y.grow; U.uAutumn.value = y.autumn; U.uFall.value = y.fall;
  U.uSnow.value = y.snow; U.uFlowers.value = y.flowers; U.uPetalGround.value = y.petalGround; U.uLitter.value = y.litter;
  U.uSnowFall.value = Math.max(o.snowFall, st.id === 'year' ? y.snowFall : 0);
  U.uRain.value = o.rain; U.uWet.value = o.wet; U.uFire.value = o.fire; U.uNight.value = o.night;

  /* sky: season key, then rain, dusk and night on top */
  const zen = s.zen.clone().lerp(RAIN.zen, o.rain * 0.85).lerp(DUSK.zen, o.dusk).lerp(NIGHT.zen, o.night);
  const hor = s.hor.clone().lerp(RAIN.hor, o.rain * 0.85).lerp(DUSK.hor, o.dusk).lerp(NIGHT.hor, o.night);
  SKY.uZen.value.copy(zen); SKY.uHor.value.copy(hor);
  PUDDLE.uZen.value.copy(zen); PUDDLE.uHor.value.copy(hor);
  scene.fog.color.copy(hor);
  scene.fog.near = lerp(30, 18, o.rain);
  scene.fog.far = lerp(210, 110, o.rain) * lerp(1, 0.7, o.night);

  /* sun: season elevation, sweeping round during the montage, low and behind the tree at dusk */
  const sunAz = 0.9 + (st.id === 'year' ? (t - t0) * Math.PI : 0);
  const el = lerp(lerp(s.el, CONFIG.duskSky.el, o.dusk), CONFIG.nightSky.el, o.night);
  const az = lerp(sunAz, 0.05, o.dusk);
  tmpDir.set(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)).normalize();
  U.uSunDir.value.copy(tmpDir);
  const sunCol = s.sun.clone().lerp(DUSK.sun, o.dusk).lerp(NIGHT.moon, o.night);
  const L = CONFIG.light;
  const sunI = lerp(L.sun * (1 - o.rain * CONFIG.rainSky.dim * 2) * lerp(1, 0.75, o.dusk), L.moon, o.night);
  sun.color.copy(sunCol); sun.intensity = sunI;
  sun.position.copy(sun.target.position).addScaledVector(tmpDir, 50);
  U.uSunCol.value.copy(sunCol).multiplyScalar(sunI);

  const hemiSky = zen.clone().lerp(hor, 0.45).lerp(new THREE.Color(1, 1, 1), 0.25 * (1 - o.night));
  const hemiGround = s.grass.clone().multiplyScalar(0.55).lerp(CONFIG_SNOW, y.snow * 0.8);
  const hemiI = lerp(L.hemi, L.hemiNight, o.night) * lerp(1, 0.8, o.dusk);
  hemi.color.copy(hemiSky); hemi.groundColor.copy(hemiGround); hemi.intensity = hemiI;
  U.uHemiSky.value.copy(hemiSky).multiplyScalar(hemiI);
  U.uHemiGround.value.copy(hemiGround).multiplyScalar(hemiI);

  SKY.uSunDisc.value.copy(sunCol).multiplyScalar((1 - o.rain * 0.9) * (1 - o.night * 0.85));
  SKY.uGlow.value = lerp(1, 1.8, o.dusk);
  SKY.uCloud.value = clamp(lerp(wrap4(t) > 1 && wrap4(t) < 2 ? 0.52 : 0.4, 0.95, o.rain) - o.night * 0.25, 0, 1);
  SKY.uCloudLit.value.set(1, 1, 1).lerp(DUSK.sun, o.dusk * 0.7).lerp(NIGHT.hor, o.night).lerp(RAIN.hor, o.rain * 0.7);
  SKY.uCloudShade.value.copy(hor).multiplyScalar(0.72).lerp(RAIN.zen, o.rain * 0.8);
  SKY.uStars.value = Math.max(o.night, o.dusk * 0.12);

  /* skip both render passes for anything the season has switched off */
  blossoms.mesh.visible = y.bud > 0 || (y.bloom > 0 && y.shed < 1);
  petals.visible = y.petal > 0;
  leaves.visible = y.grow > 0;
  rain.visible = o.rain > 0;
  snowfall.visible = U.uSnowFall.value > 0;
  fireflies.visible = o.fire > 0;
  for (const m of puddles) m.visible = o.wet > 0;

  U.uGrass.value.copy(s.grass); U.uGrassTip.value.copy(s.tip);
  house.set(smooth(seg(o.night, 0.25, 0.8)) + o.dusk * 0.55);
  birds.update(o.arrive, st.id === 'year' ? 1 : o.leave, U.uTime.value);
  return o;
}

/* ── js/camera.js ── */
/* SEASONS camera: keyed orbit poses per scene, a velocity-driven spin during the year montage. */
const spinVel = spring(CONFIG.velocity.stiffness, CONFIG.velocity.damping);
let spinOffset = 0;

/** Interpolated pose [p, tx, ty, tz, az, el, dist, fov] from a key list. */
function poseAt(keys, p) {
  let k = 0;
  while (k < keys.length - 2 && p > keys[k + 1][0]) k++;
  const a = keys[k], b = keys[k + 1], m = smooth(seg(p, a[0], b[0]));
  return a.map((v, i) => lerp(v, b[i], m));
}
const lastPose = (keys) => keys[keys.length - 1];

function yearPose(p) {
  const Y = CONFIG.yearCam, from = lastPose(CONFIG.cam.winter), to = CONFIG.cam.finale[0];
  const turn = from[4] + p * Y.turns * TAU;
  const mid = [p, ...Y.target, turn, Y.el, Y.dist, Y.fov];
  const inK = smooth(seg(p, 0, Y.blendIn)), outK = smooth(seg(p, Y.blendOut, 1));
  /* azimuth needs no blend: winter ends and the finale starts on the same angle, a whole number of turns apart */
  return mid.map((v, i) => (i === 4 ? v : lerp(lerp(from[i], v, inK), to[i], outK)));
}

function updateCamera(st, dt, montage) {
  const P = st.id === 'year' ? yearPose(st.world) : poseAt(CONFIG.cam[st.id], st.world);
  /* scroll speed spins the tree while the montage runs; the extra angle unwinds outside it */
  const V = CONFIG.velocity;
  const w = spinVel.step(reduce ? 0 : Math.abs(velocity()) * V.spin * montage);
  spinOffset = montage > 0 ? spinOffset + w * dt * 60 : spinOffset * Math.pow(0.02, dt);
  const [, tx, ty, tz, az0, el, dist0, fov] = P;
  const az = az0 + spinOffset * montage;
  const portrait = clamp(0.95 / camera.aspect, 1, 1.75);
  const dist = dist0 * portrait;
  camera.position.set(tx + dist * Math.sin(az) * Math.cos(el), ty + dist * Math.sin(el), tz + dist * Math.cos(az) * Math.cos(el));
  const floor = hillY(camera.position.x, camera.position.z) + 0.45;
  if (camera.position.y < floor) camera.position.y = floor;
  camera.lookAt(tx, ty + (portrait - 1) * 1.5, tz);
  camera.fov = fov;
  camera.updateProjectionMatrix();
  U.uCamTarget.value.set(tx, ty, tz).lerp(camera.position, 0.45);
  sky.position.copy(camera.position);
}

/* ── js/ui.js ── */
/* SEASONS words and the magnetic button. */

/** Wrap each glyph so words can rise out of a blur one letter at a time. */
function splitWord(el) {
  const text = el.textContent;
  el.setAttribute('aria-label', text);
  el.innerHTML = [...text].map((c) => `<span class="c" aria-hidden="true">${c === ' ' ? '&nbsp;' : c}</span>`).join('');
  return [...el.querySelectorAll('.c')];
}

/* per word: which scene pin drives it and its in/out windows on that pin's progress */
const WORDS = [
  { sel: '#title', scene: 0, in: null, out: [0.05, 0.14] },
  { sel: '#w-spring', scene: 0, in: [0.18, 0.32], out: [0.74, 0.9] },
  { sel: '#w-summer', scene: 1, in: [0.03, 0.18], out: [0.28, 0.4] },
  { sel: '#w-autumn', scene: 2, in: [0.06, 0.22], out: [0.7, 0.86] },
  { sel: '#w-winter', scene: 3, in: [0.08, 0.24], out: [0.8, 0.94] },
  { sel: '#w-year', scene: 4, in: [0.06, 0.18], out: [0.5, 0.68] },
  { sel: '#w-finale', scene: 5, in: [0.06, 0.26], out: null },
].map((w) => ({ ...w, el: $(w.sel), chars: splitWord($(w.sel)) }));

function drawWord(w, p) {
  const n = w.chars.length;
  const kIn = w.in ? p : 1, kOut = w.out ? seg(p, w.out[0], w.out[1]) : 0;
  w.chars.forEach((c, i) => {
    const off = (i / Math.max(1, n)) * 0.35;
    const a = w.in ? smooth(seg(kIn, w.in[0] + off * (w.in[1] - w.in[0]), w.in[1])) : 1;
    const b = smooth(clamp01(kOut * 1.3 - off * 0.3));
    const v = a * (1 - b);
    c.style.opacity = v.toFixed(3);
    c.style.transform = `translate3d(0, ${((1 - a) * 0.35 - b * 0.25).toFixed(3)}em, 0)`;
    c.style.filter = v >= 0.999 || v <= 0.001 ? 'none' : `blur(${((1 - v) * 10).toFixed(1)}px)`;
  });
}

const cue = $('#cue'), fin = $('#fin'), magnet = $('#magnet'), magnetLabel = magnet.querySelector('span');

function updateWords(st) {
  if (reduce) return;
  for (const w of WORDS) drawWord(w, st.pins[w.scene]);
  cue.style.opacity = (1 - seg(st.pins[0], 0.005, 0.03)).toFixed(3);
  const f = smooth(seg(st.pins[5], 0.4, 0.55));
  fin.style.opacity = f.toFixed(3);
  fin.style.pointerEvents = f > 0.5 ? 'auto' : 'none';
  fin.style.visibility = f > 0.01 ? 'visible' : 'hidden';
}

/* magnet: the disc leans toward the pointer, the label a little further, both spring back */
const mag = { tx: 0, ty: 0, x: 0, y: 0, vx: 0, vy: 0 };
if (!reduce) {
  magnet.addEventListener('pointermove', (e) => {
    const r = magnet.getBoundingClientRect();
    mag.tx = (e.clientX - (r.left + r.width / 2)) * 0.42;
    mag.ty = (e.clientY - (r.top + r.height / 2)) * 0.42;
  });
  magnet.addEventListener('pointerleave', () => { mag.tx = 0; mag.ty = 0; });
}
function updateMagnet() {
  if (reduce) return;
  mag.vx = (mag.vx + (mag.tx - mag.x) * 0.12) * 0.78;
  mag.vy = (mag.vy + (mag.ty - mag.y) * 0.12) * 0.78;
  mag.x += mag.vx; mag.y += mag.vy;
  magnet.style.transform = `translate3d(${mag.x.toFixed(2)}px, ${mag.y.toFixed(2)}px, 0)`;
  magnetLabel.style.transform = `translate3d(${(mag.x * 0.35).toFixed(2)}px, ${(mag.y * 0.35).toFixed(2)}px, 0)`;
}

/* ── js/main.js ── */
/* SEASONS main loop: wind from the pointer, gusts from scroll speed, one render per frame. */
const gust = spring(CONFIG.velocity.stiffness, CONFIG.velocity.damping);
const windNow = new THREE.Vector3(CONFIG.wind.base, 0, 0);
const windGoal = new THREE.Vector3();
const camRight = new THREE.Vector3(), camFwd = new THREE.Vector3();

/** Pointer x steers wind across the view, pointer y pushes it toward or away from the camera. */
function updateWind() {
  const W = CONFIG.wind;
  camera.getWorldDirection(camFwd); camFwd.y = 0; camFwd.normalize();
  camRight.crossVectors(camFwd, camera.up).normalize();
  const nx = pointer.active ? pointer.nx : 0.35, ny = pointer.active ? pointer.ny : 0;
  const strength = W.base + W.pointer * Math.min(1, Math.hypot(nx, ny));
  windGoal.copy(camRight).multiplyScalar(nx).addScaledVector(camFwd, -ny * 0.6);
  if (windGoal.lengthSq() < 1e-4) windGoal.copy(camRight);
  windGoal.normalize().multiplyScalar(strength);
  windNow.lerp(windGoal, W.ease);
  U.uWind.value.copy(windNow);
  const V = CONFIG.velocity;
  U.uGust.value = Math.max(0, gust.step(Math.min(V.gustMax, Math.abs(velocity()) * V.gust)));
}

let clock = 0, last = performance.now(), stillKey = '';
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (document.hidden) return;
  if (lenis) lenis.raf(now);

  if (reduce) {
    const st = stillState(), key = `${st.id}:${innerWidth}x${innerHeight}`;
    if (key === stillKey) return;
    stillKey = key;
    U.uTime.value = 12;
    const o = applySeason(st);
    updateCamera(st, 0, o.montage);
    updateWind();
    renderFrame();
    return;
  }

  clock += dt;
  U.uTime.value = clock;
  const st = scrollState();
  const o = applySeason(st);
  SKY.uCloudTime.value += dt * (1 + o.montage * 18 + Math.abs(velocity()) * 0.05 * o.montage);
  updateCamera(st, dt, o.montage);
  updateWind();
  updateWords(st);
  updateMagnet();
  renderFrame();
}

function renderFrame() {
  renderer.render(scene, camera);
  if (sun.shadow.map && !U.uShadowMap.value) {
    U.uShadowMap.value = sun.shadow.map.texture;
    U.uShadowMatrix.value = sun.shadow.matrix;
    U.uShadowOn.value = 1;
    stillKey = '';
  }
}

function onResize() {
  resize();
  measureScenes();
  stillKey = '';
}
addEventListener('resize', onResize);
onResize();
document.fonts.ready.then(measureScenes);
requestAnimationFrame(frame);

</script>
</body>
