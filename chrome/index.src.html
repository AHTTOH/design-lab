<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHROME</title>
<meta name="description" content="액체 크롬, 비눗방울, 홀로그램 카드, 녹는 글자, 하늘 비행. Y2K 크롬 인터랙션 연습.">
<meta property="og:title" content="CHROME">
<meta property="og:image" content="https://ahttoh.github.io/design-lab/assets/thumb/chrome.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    /* Every scene's --len is multiplied by this. 2026-09-28: the owner found 4,850vh too fast, so scenes start long and stretch 1.5x. */
    --scroll-stretch: 1;
    --sky-deep: #1d56d8; --sky: #5f8ff5; --sky-soft: #9db8ff; --peri: #b4b9ff; --lilac: #cdbdff;
    --ink: #0f2a78; --ink-soft: #3651a8; --pearl: #f4f7ff;
    --holo-pink: #ff9fe4; --holo-aqua: #86f2ff; --holo-gold: #ffe7a3;
    --chrome: linear-gradient(180deg, #ffffff 0%, #eef2ff 26%, #a9bbec 45%, #22397f 50%, #5d78c9 56%, #d9e3ff 76%, #ffffff 100%);
    --display: 'Unbounded', 'Pretendard Variable', system-ui, sans-serif;
    --korean: 'Pretendard Variable', system-ui, sans-serif;
    --hero-size: min(15vw, 15rem);
    --big: clamp(3rem, 1rem + 10vw, 12rem);
    --kor: clamp(2rem, 1rem + 5vw, 6.2rem);
    --gutter: clamp(16px, 5vw, 80px);
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    /* Poster states do not change while scrolling, so the long runway is shortened. */
    :root { --scroll-stretch: .4; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: clip; }
  body { background: var(--sky); color: var(--ink); font-family: var(--korean); }
  ::selection { background: var(--holo-pink); color: var(--ink); }

  /* The WebGL canvas sits above every pin (pins are below it) and lets the pointer through,
     so chrome objects float in front of the type. The flight pin is the one pin placed above it. */
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; display: block; pointer-events: none; }

  main { position: relative; }
  .scene { position: relative; height: calc(var(--len) * var(--scroll-stretch)); }
  .pin { position: sticky; top: 0; height: 100vh; overflow: hidden; z-index: 1; }
  .sky { background: linear-gradient(180deg, var(--sky-deep) 0%, var(--sky) 42%, var(--sky-soft) 72%, var(--lilac) 100%); }
  .sky::before { content: ''; position: absolute; inset: 0; background: url('../assets/chrome/sky.webp') center 58% / cover no-repeat; opacity: var(--sky-img, .55); mix-blend-mode: screen; pointer-events: none; }

  .ln { display: block; }
  .ch { display: inline-block; will-change: transform; }
  .chrome-type { filter: drop-shadow(0 .035em 0 #1b3285) drop-shadow(0 .1em .22em rgba(16, 36, 120, .35)); }
  /* background-clip text does not paint through transformed child spans, so every letter carries its own chrome. */
  .chrome-type:not([data-split]), .chrome-type .ch { background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .display { margin: 0; font-family: var(--display); font-weight: 900; line-height: .86; letter-spacing: -.035em; white-space: nowrap; pointer-events: none; }
  .kor { margin: 0; font-family: var(--korean); font-weight: 800; font-size: var(--kor); letter-spacing: -.04em; line-height: 1; white-space: nowrap; pointer-events: none; }

  /* hero */
  .hero .pin { --sky-img: .7; }
  .hero-title { position: absolute; left: 50%; bottom: 6vh; transform: translateX(-50%); font-size: var(--hero-size); }
  .hero-kor { position: absolute; left: var(--gutter); top: 16vh; color: var(--pearl); opacity: 0; text-shadow: 0 6px 40px rgba(20, 50, 160, .35); will-change: opacity, transform; }
  .cue { position: absolute; left: 50%; top: 4vh; width: 2px; height: 56px; margin-left: -1px; border-radius: 2px; overflow: hidden; background: rgba(255, 255, 255, .25); }
  .cue::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent, #fff); transform-origin: top; animation: cue 1.8s var(--ease) infinite; }
  @keyframes cue { 0% { transform: scaleY(0); opacity: 1; } 60% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }

  /* bubbles */
  .bubbles .pin { --sky-img: .45; background: linear-gradient(170deg, #4d7df0 0%, #8fb0ff 48%, #c9c2ff 100%); }
  .pop { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: clamp(6rem, 2rem + 24vw, 26rem); color: rgba(255, 255, 255, .9); text-shadow: 0 .03em 0 #b8c6ff, 0 .08em .3em rgba(40, 70, 190, .3); will-change: transform, opacity; }
  .bub-kor { position: absolute; right: var(--gutter); bottom: 12vh; color: var(--ink); opacity: 0; will-change: opacity, transform; }

  /* holo cards */
  .holo .pin { --sky-img: .3; background: radial-gradient(120% 90% at 50% 110%, #d7c9ff 0%, #7c9cff 45%, #2451cf 100%); }
  .holo-word { position: absolute; left: var(--gutter); top: 8vh; font-size: var(--big); color: transparent; -webkit-text-stroke: 2px rgba(255, 255, 255, .7); will-change: opacity, transform; }
  .holo-kor { position: absolute; right: var(--gutter); bottom: 9vh; color: var(--pearl); opacity: 0; will-change: opacity, transform; }
  .tilt-btn { position: absolute; left: 50%; bottom: 3.5vh; transform: translateX(-50%); padding: 12px 22px; border: 0; border-radius: 999px; font: 700 15px var(--korean); color: var(--ink);
    background: linear-gradient(100deg, #fff 0%, #dfe6ff 40%, #ffe3f6 70%, #e3fbff 100%); box-shadow: 0 6px 24px rgba(20, 50, 160, .3), inset 0 -2px 0 rgba(15, 42, 120, .2); }
  .tilt-btn:focus-visible { outline: 3px solid var(--holo-pink); outline-offset: 4px; }

  /* liquid type */
  .melt .pin { --sky-img: .6; background: linear-gradient(180deg, #7aa3ff 0%, #b7c7ff 55%, #e0d2ff 100%); }
  .melt-kor { position: absolute; left: 50%; top: 5vh; transform: translateX(-50%); font-size: clamp(2.6rem, 1rem + 7vw, 8rem); color: #fff; opacity: .92; text-shadow: 0 8px 50px rgba(40, 70, 190, .35); will-change: opacity, transform; }

  /* sky flight: this pin is above the canvas and carries only type */
  .flight .pin { z-index: 3; pointer-events: none; }
  .fly-word { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: clamp(6rem, 2rem + 22vw, 24rem); will-change: transform, opacity; }
  .fly-kor { position: absolute; left: var(--gutter); bottom: 10vh; color: #fff; opacity: 0; text-shadow: 0 6px 40px rgba(20, 50, 160, .45); will-change: opacity, transform; }

  /* finale */
  .fin .pin { --sky-img: .75; }
  .fin-title { position: absolute; left: 50%; top: 61%; transform: translate(-50%, -50%); font-size: min(var(--hero-size), 15vw); }
  .fin-copy { position: absolute; left: 0; right: 0; bottom: 5vh; display: grid; place-items: center; opacity: 0; }
  .magnet { position: relative; display: grid; place-items: center; width: 124px; height: 124px; border-radius: 50%; text-decoration: none; color: var(--ink); font: 800 1rem var(--korean);
    border: 5px solid transparent;
    background: radial-gradient(circle at 35% 28%, #fff 0%, #e8eeff 30%, #9fb1e8 58%, #eef2ff 80%, #b9c6f2 100%) padding-box,
      conic-gradient(from var(--spin, 0deg), var(--holo-pink), var(--holo-aqua), var(--holo-gold), #c9b6ff, var(--holo-pink)) border-box;
    box-shadow: 0 18px 50px rgba(20, 50, 160, .35), inset 0 -6px 14px rgba(15, 42, 120, .25), inset 0 6px 10px rgba(255, 255, 255, .9); will-change: transform; }
  .magnet span { pointer-events: none; will-change: transform; }
  .magnet:focus-visible { outline: 3px solid #fff; outline-offset: 8px; }

  @media (max-width: 760px) {
    .hero-title { bottom: 12vh; }
    .hero-kor { top: 14vh; }
    .holo-word { -webkit-text-stroke-width: 1.5px; }
    .melt-kor { top: 9vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cue::after { animation: none; }
  }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>

<main>
  <section class="scene hero" id="s-hero" style="--len:1100vh">
    <div class="pin sky" id="hero-pin">
      <div class="cue" aria-hidden="true"></div>
      <p class="kor hero-kor" id="hero-kor">액체 금속</p>
      <h1 class="display chrome-type hero-title" id="hero-title" data-split>CHROME</h1>
    </div>
  </section>

  <section class="scene bubbles" id="s-bubbles" style="--len:1200vh">
    <div class="pin sky" id="bub-pin">
      <h2 class="display pop" id="pop">POP</h2>
      <p class="kor bub-kor" id="bub-kor">비눗방울</p>
    </div>
  </section>

  <section class="scene holo" id="s-holo" style="--len:1200vh">
    <div class="pin sky" id="holo-pin">
      <h2 class="display holo-word" id="holo-word">HOLO</h2>
      <p class="kor holo-kor" id="holo-kor">홀로그램</p>
      <button class="tilt-btn" id="tilt-btn" type="button" hidden>기울기 켜기</button>
    </div>
  </section>

  <section class="scene melt" id="s-melt" style="--len:1200vh">
    <div class="pin sky" id="melt-pin" role="img" aria-label="녹아내리는 크롬 글자 MELT">
      <p class="kor melt-kor" id="melt-kor">녹는 크롬</p>
    </div>
  </section>

  <section class="scene flight" id="s-flight" style="--len:1400vh">
    <div class="pin" id="flight-pin">
      <h2 class="display chrome-type fly-word" id="fly-word">SKY</h2>
      <p class="kor fly-kor" id="fly-kor">하늘로</p>
    </div>
  </section>

  <section class="scene fin" id="s-finale" style="--len:900vh">
    <div class="pin sky" id="fin-pin">
      <h2 class="display chrome-type fin-title" id="fin-title" data-split>CHROME</h2>
      <div class="fin-copy" id="fin-copy"><a class="magnet" id="magnet" href="../"><span>목록으로</span></a></div>
    </div>
  </section>
</main>

  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

</body>
</html>
