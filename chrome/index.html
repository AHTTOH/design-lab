<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHROME</title>
<meta name="description" content="액체 크롬, 비눗방울, 홀로그램 카드, 녹는 글자, 하늘 비행. Y2K 크롬 인터랙션 연습.">
<meta property="og:title" content="CHROME">
<meta property="og:image" content="https://ahttoh.github.io/design-lab/assets/thumb/chrome.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    /* Every scene's --len is multiplied by this. 2026-09-28: the owner found 4,850vh too fast, so scenes start long and stretch 1.5x. */
    --scroll-stretch: 1;
    --sky-deep: #1d56d8; --sky: #5f8ff5; --sky-soft: #9db8ff; --peri: #b4b9ff; --lilac: #cdbdff;
    --ink: #0f2a78; --ink-soft: #3651a8; --pearl: #f4f7ff;
    --holo-pink: #ff9fe4; --holo-aqua: #86f2ff; --holo-gold: #ffe7a3;
    --chrome: linear-gradient(180deg, #ffffff 0%, #eef2ff 26%, #a9bbec 45%, #22397f 50%, #5d78c9 56%, #d9e3ff 76%, #ffffff 100%);
    --display: 'Unbounded', 'Pretendard Variable', system-ui, sans-serif;
    --korean: 'Pretendard Variable', system-ui, sans-serif;
    --hero-size: min(15vw, 15rem);
    --big: clamp(3rem, 1rem + 10vw, 12rem);
    --kor: clamp(2rem, 1rem + 5vw, 6.2rem);
    --gutter: clamp(16px, 5vw, 80px);
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    /* Poster states do not change while scrolling, so the long runway is shortened. */
    :root { --scroll-stretch: .4; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: clip; }
  body { background: var(--sky); color: var(--ink); font-family: var(--korean); }
  ::selection { background: var(--holo-pink); color: var(--ink); }

  /* The WebGL canvas sits above every pin (pins are below it) and lets the pointer through,
     so chrome objects float in front of the type. The flight pin is the one pin placed above it. */
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; display: block; pointer-events: none; }

  main { position: relative; }
  .scene { position: relative; height: calc(var(--len) * var(--scroll-stretch)); }
  .pin { position: sticky; top: 0; height: 100vh; overflow: hidden; z-index: 1; }
  .sky { background: linear-gradient(180deg, var(--sky-deep) 0%, var(--sky) 42%, var(--sky-soft) 72%, var(--lilac) 100%); }
  .sky::before { content: ''; position: absolute; inset: 0; background: url('../assets/chrome/sky.webp') center 58% / cover no-repeat; opacity: var(--sky-img, .55); mix-blend-mode: screen; pointer-events: none; }

  .ln { display: block; }
  .ch { display: inline-block; will-change: transform; }
  .chrome-type { filter: drop-shadow(0 .035em 0 #1b3285) drop-shadow(0 .1em .22em rgba(16, 36, 120, .35)); }
  /* background-clip text does not paint through transformed child spans, so every letter carries its own chrome. */
  .chrome-type:not([data-split]), .chrome-type .ch { background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .display { margin: 0; font-family: var(--display); font-weight: 900; line-height: .86; letter-spacing: -.035em; white-space: nowrap; pointer-events: none; }
  .kor { margin: 0; font-family: var(--korean); font-weight: 800; font-size: var(--kor); letter-spacing: -.04em; line-height: 1; white-space: nowrap; pointer-events: none; }

  /* hero */
  .hero .pin { --sky-img: .7; }
  .hero-title { position: absolute; left: 50%; bottom: 6vh; transform: translateX(-50%); font-size: var(--hero-size); }
  .hero-kor { position: absolute; left: var(--gutter); top: 16vh; color: var(--pearl); opacity: 0; text-shadow: 0 6px 40px rgba(20, 50, 160, .35); will-change: opacity, transform; }
  .cue { position: absolute; left: 50%; top: 4vh; width: 2px; height: 56px; margin-left: -1px; border-radius: 2px; overflow: hidden; background: rgba(255, 255, 255, .25); }
  .cue::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent, #fff); transform-origin: top; animation: cue 1.8s var(--ease) infinite; }
  @keyframes cue { 0% { transform: scaleY(0); opacity: 1; } 60% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }

  /* bubbles */
  .bubbles .pin { --sky-img: .45; background: linear-gradient(170deg, #4d7df0 0%, #8fb0ff 48%, #c9c2ff 100%); }
  .pop { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: clamp(6rem, 2rem + 24vw, 26rem); color: rgba(255, 255, 255, .9); text-shadow: 0 .03em 0 #b8c6ff, 0 .08em .3em rgba(40, 70, 190, .3); will-change: transform, opacity; }
  .bub-kor { position: absolute; right: var(--gutter); bottom: 12vh; color: var(--ink); opacity: 0; will-change: opacity, transform; }

  /* holo cards */
  .holo .pin { --sky-img: .3; background: radial-gradient(120% 90% at 50% 110%, #d7c9ff 0%, #7c9cff 45%, #2451cf 100%); }
  .holo-word { position: absolute; left: var(--gutter); top: 8vh; font-size: var(--big); color: transparent; -webkit-text-stroke: 2px rgba(255, 255, 255, .7); will-change: opacity, transform; }
  .holo-kor { position: absolute; right: var(--gutter); bottom: 9vh; color: var(--pearl); opacity: 0; will-change: opacity, transform; }
  .tilt-btn { position: absolute; left: 50%; bottom: 3.5vh; transform: translateX(-50%); padding: 12px 22px; border: 0; border-radius: 999px; font: 700 15px var(--korean); color: var(--ink);
    background: linear-gradient(100deg, #fff 0%, #dfe6ff 40%, #ffe3f6 70%, #e3fbff 100%); box-shadow: 0 6px 24px rgba(20, 50, 160, .3), inset 0 -2px 0 rgba(15, 42, 120, .2); }
  .tilt-btn:focus-visible { outline: 3px solid var(--holo-pink); outline-offset: 4px; }

  /* liquid type */
  .melt .pin { --sky-img: .6; background: linear-gradient(180deg, #7aa3ff 0%, #b7c7ff 55%, #e0d2ff 100%); }
  .melt-kor { position: absolute; left: 50%; top: 5vh; transform: translateX(-50%); font-size: clamp(2.6rem, 1rem + 7vw, 8rem); color: #fff; opacity: .92; text-shadow: 0 8px 50px rgba(40, 70, 190, .35); will-change: opacity, transform; }

  /* sky flight: this pin is above the canvas and carries only type */
  .flight .pin { z-index: 3; pointer-events: none; }
  .fly-word { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: clamp(6rem, 2rem + 22vw, 24rem); will-change: transform, opacity; }
  .fly-kor { position: absolute; left: var(--gutter); bottom: 10vh; color: #fff; opacity: 0; text-shadow: 0 6px 40px rgba(20, 50, 160, .45); will-change: opacity, transform; }

  /* finale */
  .fin .pin { --sky-img: .75; }
  .fin-title { position: absolute; left: 50%; top: 61%; transform: translate(-50%, -50%); font-size: min(var(--hero-size), 15vw); }
  .fin-copy { position: absolute; left: 0; right: 0; bottom: 5vh; display: grid; place-items: center; opacity: 0; }
  .magnet { position: relative; display: grid; place-items: center; width: 124px; height: 124px; border-radius: 50%; text-decoration: none; color: var(--ink); font: 800 1rem var(--korean);
    border: 5px solid transparent;
    background: radial-gradient(circle at 35% 28%, #fff 0%, #e8eeff 30%, #9fb1e8 58%, #eef2ff 80%, #b9c6f2 100%) padding-box,
      conic-gradient(from var(--spin, 0deg), var(--holo-pink), var(--holo-aqua), var(--holo-gold), #c9b6ff, var(--holo-pink)) border-box;
    box-shadow: 0 18px 50px rgba(20, 50, 160, .35), inset 0 -6px 14px rgba(15, 42, 120, .25), inset 0 6px 10px rgba(255, 255, 255, .9); will-change: transform; }
  .magnet span { pointer-events: none; will-change: transform; }
  .magnet:focus-visible { outline: 3px solid #fff; outline-offset: 8px; }

  @media (max-width: 760px) {
    .hero-title { bottom: 12vh; }
    .hero-kor { top: 14vh; }
    .holo-word { -webkit-text-stroke-width: 1.5px; }
    .melt-kor { top: 9vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cue::after { animation: none; }
  }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>

<main>
  <section class="scene hero" id="s-hero" style="--len:1100vh">
    <div class="pin sky" id="hero-pin">
      <div class="cue" aria-hidden="true"></div>
      <p class="kor hero-kor" id="hero-kor">액체 금속</p>
      <h1 class="display chrome-type hero-title" id="hero-title" data-split>CHROME</h1>
    </div>
  </section>

  <section class="scene bubbles" id="s-bubbles" style="--len:1200vh">
    <div class="pin sky" id="bub-pin">
      <h2 class="display pop" id="pop">POP</h2>
      <p class="kor bub-kor" id="bub-kor">비눗방울</p>
    </div>
  </section>

  <section class="scene holo" id="s-holo" style="--len:1200vh">
    <div class="pin sky" id="holo-pin">
      <h2 class="display holo-word" id="holo-word">HOLO</h2>
      <p class="kor holo-kor" id="holo-kor">홀로그램</p>
      <button class="tilt-btn" id="tilt-btn" type="button" hidden>기울기 켜기</button>
    </div>
  </section>

  <section class="scene melt" id="s-melt" style="--len:1200vh">
    <div class="pin sky" id="melt-pin" role="img" aria-label="녹아내리는 크롬 글자 MELT">
      <p class="kor melt-kor" id="melt-kor">녹는 크롬</p>
    </div>
  </section>

  <section class="scene flight" id="s-flight" style="--len:1400vh">
    <div class="pin" id="flight-pin">
      <h2 class="display chrome-type fly-word" id="fly-word">SKY</h2>
      <p class="kor fly-kor" id="fly-kor">하늘로</p>
    </div>
  </section>

  <section class="scene fin" id="s-finale" style="--len:900vh">
    <div class="pin sky" id="fin-pin">
      <h2 class="display chrome-type fin-title" id="fin-title" data-split>CHROME</h2>
      <div class="fin-copy" id="fin-copy"><a class="magnet" id="magnet" href="../"><span>목록으로</span></a></div>
    </div>
  </section>
</main>

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const clamp01 = (v) => clamp(v, 0, 1);
const seg = (p, a, b) => clamp01((p - a) / (b - a));
const segR = (p, r) => seg(p, r[0], r[1]);
const smooth = (x) => x * x * (3 - 2 * x);
const lerp = (a, b, t) => a + (b - a) * t;
const lerpR = (r, t) => lerp(r[0], r[1], t);
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const dprNow = () => Math.min(devicePixelRatio || 1, CONFIG.dprMax);
/** In, hold, out envelope over four breakpoints. */
const envelope = (p, r) => smooth(seg(p, r[0], r[1])) * (1 - smooth(seg(p, r[2], r[3])));
/** Deterministic PRNG so layouts are the same on every load. */
function mulberry32(seed) { let a = seed; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ───────── scroll engine ───────── */
gsap.registerPlugin(ScrollTrigger);
const lenis = reduce ? null : new Lenis({ lerp: CONFIG.lenisLerp });
if (lenis) { lenis.on('scroll', ScrollTrigger.update); gsap.ticker.add((t) => lenis.raf(t * 1000)); gsap.ticker.lagSmoothing(0); }
const velocity = () => (lenis ? lenis.velocity : 0);

/** Progress of a sticky scene plus a visibility flag while any part of it is on screen. */
function track(sel, onProgress, onVisible) {
  const el = $(sel);
  onProgress(0);
  ScrollTrigger.create({ trigger: el, start: 'top top', end: 'bottom bottom', onUpdate: (s) => onProgress(s.progress) });
  if (onVisible) ScrollTrigger.create({ trigger: el, start: 'top bottom', end: 'bottom top', onToggle: (s) => onVisible(s.isActive) });
}

/** Split text into .ch spans (one per letter) and return them. */
function split(el) {
  const text = el.textContent;
  el.setAttribute('aria-label', text);
  el.innerHTML = `<span class="ln" aria-hidden="true">${[...text].map((c) => `<span class="ch">${c}</span>`).join('')}</span>`;
  return [...el.querySelectorAll('.ch')];
}
$$('[data-split]').forEach(split);

/** Fade and slide a DOM element with an in-hold-out envelope. */
function showBy(el, p, range, dx = 0, dy = 0) {
  const k = reduce ? 1 : envelope(p, range);
  el.style.opacity = k;
  el.style.translate = `${(1 - k) * dx}vw ${(1 - k) * dy}vh`;
}

/* ───────── pointer and tilt (gyroscope on touch devices, pointer on desktop) ───────── */
const pointer = { x: innerWidth / 2, y: innerHeight / 2, moved: -1e9 };
addEventListener('pointermove', (e) => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.moved = performance.now(); });

const tilt = { x: 0, y: 0, tx: 0, ty: 0 };
{
  const cfg = CONFIG.tilt, btn = $('#tilt-btn');
  let baseBeta = null;
  const onOrient = (e) => {
    if (e.gamma === null || e.beta === null) return;
    if (baseBeta === null) baseBeta = e.beta;
    tilt.tx = clamp(e.gamma / cfg.rangeDeg, -1, 1);
    tilt.ty = clamp((e.beta - baseBeta) / cfg.rangeDeg, -1, 1);
  };
  const listen = () => addEventListener('deviceorientation', onOrient);
  if (!coarse) {
    addEventListener('pointermove', (e) => { tilt.tx = (e.clientX / innerWidth) * 2 - 1; tilt.ty = (e.clientY / innerHeight) * 2 - 1; });
  } else if (typeof DeviceOrientationEvent === 'undefined') {
    console.info('DeviceOrientationEvent is not available, tilt stays level');
  } else if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    // iOS grants motion access only from a user gesture, so the button exists only where that API exists.
    btn.hidden = false;
    btn.addEventListener('click', async () => {
      btn.hidden = true;
      try {
        const state = await DeviceOrientationEvent.requestPermission();
        if (state === 'granted') listen(); else console.error('device orientation permission', state);
      } catch (e) { console.error('device orientation permission failed', e); }
    });
  } else listen();
  gsap.ticker.add(() => { if (reduce) return; tilt.x += (tilt.tx - tilt.x) * cfg.ease; tilt.y += (tilt.ty - tilt.y) * cfg.ease; });
}

/* ───────── one transparent WebGL renderer shared by every scene ───────── */
// Each mode draws only inside its own sticky pin rectangle (viewport + scissor). The canvas is transparent,
// so the CSS sky and type of each pin show through wherever no chrome is drawn.
function createStage(canvas) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  const modes = [];
  let W = 1, H = 1, dirty = true, painted = false, ready = false;
  const fit = () => {
    W = canvas.clientWidth; H = canvas.clientHeight;
    renderer.setPixelRatio(dprNow()); renderer.setSize(W, H, false);
    modes.forEach((m) => m.resize && m.resize(W, m.pin.clientHeight));
    dirty = true;
  };
  const clearAll = () => { renderer.setRenderTarget(null); renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H); renderer.clear(); };
  function frame(time, dt) {
    if (!ready) return;
    const live = modes.filter((m) => m.on);
    if (!live.length) { if (painted) { clearAll(); painted = false; } return; }
    if (reduce && !dirty) return;
    dirty = false;
    clearAll();
    for (const m of live) {
      const r = m.pin.getBoundingClientRect();
      if (r.bottom <= 0 || r.top >= H) continue;
      const top = Math.max(0, r.top), bottom = Math.min(H, r.bottom);
      renderer.setViewport(0, H - r.bottom, W, r.height);
      renderer.setScissor(0, H - bottom, W, bottom - top);
      renderer.setScissorTest(true);
      m.draw(time, dt, r);
    }
    renderer.setScissorTest(false);
    painted = true;
  }
  const add = (mode) => { const m = { on: false, ...mode }; modes.push(m); if (m.resize) m.resize(W, m.pin.clientHeight); return m; };
  addEventListener('resize', fit);
  if (reduce) addEventListener('scroll', () => { dirty = true; }, { passive: true });
  fit();
  return { renderer, add, frame, markDirty: () => { dirty = true; }, setReady: () => { ready = true; dirty = true; }, size: () => [W, H] };
}

/* ───────── textures and the shared sky environment ───────── */
function loadTexture(name) {
  return new Promise((resolve, reject) => new THREE.TextureLoader().load(CONFIG.images[name], (t) => { t.colorSpace = THREE.SRGBColorSpace; resolve(t); }, undefined,
    (e) => reject(new Error(`texture ${name} failed to load: ${e?.message ?? e}`))));
}

const SKY_DOME_FS = `
uniform sampler2D uSky; uniform vec3 uGround, uGroundSky, uHorizon; uniform float uHorizonWidth, uGroundFrom, uGroundTo;
varying vec3 vDir;
vec2 equi(vec3 d) { return vec2(atan(d.z, d.x) / 6.2831853 + .5, asin(clamp(d.y, -1., 1.)) / 3.14159265 + .5); }
void main() {
  vec3 d = normalize(vDir);
  vec3 sky = texture2D(uSky, equi(d)).rgb;
  float ground = smoothstep(uGroundFrom, uGroundTo, d.y);
  vec3 below = texture2D(uSky, equi(vec3(d.x, -d.y, d.z))).rgb * uGroundSky + uGround * .35;
  vec3 col = mix(sky, below, ground);
  col += uHorizon * exp(-abs(d.y - uGroundFrom) / uHorizonWidth) * .8;
  gl_FragColor = vec4(col, 1.);
}`;
const SKY_DOME_VS = `varying vec3 vDir; void main() { vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`;

/** Chrome needs contrast: generated sky above, a deep blue ground below a bright horizon line, plus RoomEnvironment softboxes for sparkle. */
function skyEnvironment(renderer, sky) {
  const cfg = CONFIG.env, env = new RoomEnvironment(renderer);
  env.traverse((o) => {
    if (!o.isMesh) return;
    if (o.material.isMeshStandardMaterial) o.visible = false;
    else if (o.material.isMeshBasicMaterial) { o.material = o.material.clone(); o.material.color.multiplyScalar(cfg.lightScale); }
  });
  const dome = new THREE.Mesh(new THREE.SphereGeometry(cfg.skyRadius, 64, 32), new THREE.ShaderMaterial({
    vertexShader: SKY_DOME_VS, fragmentShader: SKY_DOME_FS, side: THREE.BackSide, depthWrite: false,
    uniforms: { uSky: { value: sky }, uGround: { value: new THREE.Color(cfg.ground) }, uGroundSky: { value: new THREE.Vector3(...cfg.groundSky) }, uHorizon: { value: new THREE.Color(cfg.horizon) },
      uHorizonWidth: { value: cfg.horizonWidth }, uGroundFrom: { value: cfg.groundFrom }, uGroundTo: { value: cfg.groundTo } },
  }));
  env.add(dome);
  const pmrem = new THREE.PMREMGenerator(renderer);
  const tex = pmrem.fromScene(env, cfg.blur).texture;
  pmrem.dispose();
  return tex;
}

/** Chrome body material shared by the blob, the lettering and the flight shapes. */
function chromeMaterial(env, extra = {}) {
  return new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 1, roughness: 0.05, envMap: env, envMapIntensity: 1.15, ...extra });
}

/* ───────── shared GLSL ───────── */
// 3D simplex noise, Ashima Arts / Stefan Gustavson (MIT).
const SNOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;} vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);} vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1./6.,1./3.); const vec4 D=vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
  float n_=.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.+1.; vec4 s1=floor(b1)*2.+1.; vec4 sh=-step(h,vec4(0.));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.); m=m*m;
  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;
const EQUI = `vec2 equi(vec3 d) { return vec2(atan(d.z, d.x) / 6.2831853 + .5, asin(clamp(d.y, -1., 1.)) / 3.14159265 + .5); }`;
/** Thin-film interference approximated by phase-shifted cosines: the classic soap and foil rainbow. */
const FILM = `vec3 film(float t) { return .5 + .5 * cos(6.2831853 * (t + vec3(0., .33, .67))); }`;

/** Camera distance that keeps a subject of the given width in frame on portrait screens. */
function fitDistance(camera, base, portraitFit) {
  return base / Math.min(1, camera.aspect / portraitFit);
}

/* ── src/10-blob.js ── */
/* ───────── liquid chrome blob: a subdivided sphere displaced by noise in the vertex shader ───────── */
// Normals are rebuilt from two neighbouring displaced points, so the chrome reflection follows the liquid surface.
const BLOB_HEAD = `
uniform float uTime, uAmp, uFreq, uTwist, uPull, uStretch;
uniform vec3 uPointer;
${SNOISE}
float blobDisp(vec3 p) {
  vec3 q = p * uFreq + vec3(0., uTime * .22, uTime * .07);
  float n = snoise(q) * .7 + snoise(q * 2.13 + 3.7) * .3;
  float pull = pow(max(dot(p, uPointer), 0.), 5.) * uPull;
  return n * uAmp + pull;
}
vec3 blobWarp(vec3 p) {
  float a = p.y * uTwist, c = cos(a), s = sin(a);
  vec3 q = vec3(c * p.x - s * p.z, p.y, s * p.x + c * p.z) * (1. + blobDisp(p));
  q.y *= 1. + uStretch;
  return q;
}`;
const BLOB_NORMAL = `
vec3 bp = normalize(position);
vec3 bt1 = normalize(abs(bp.y) > .99 ? cross(bp, vec3(1., 0., 0.)) : cross(bp, vec3(0., 1., 0.)));
vec3 bt2 = cross(bp, bt1);
vec3 blobP = blobWarp(bp);
vec3 objectNormal = normalize(cross(blobWarp(normalize(bp + bt1 * .012)) - blobP, blobWarp(normalize(bp + bt2 * .012)) - blobP));
#ifdef USE_TANGENT
  vec3 objectTangent = vec3(tangent.xyz);
#endif`;

function createBlob(env, detail) {
  const uniforms = { uTime: { value: 0 }, uAmp: { value: .08 }, uFreq: { value: 1.2 }, uTwist: { value: 0 }, uPull: { value: 0 }, uStretch: { value: 0 },
    uPointer: { value: new THREE.Vector3(0, 0, 1) } };
  const material = chromeMaterial(env, { roughness: CONFIG.hero.roughness });
  material.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, uniforms);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>\n${BLOB_HEAD}`)
      .replace('#include <beginnormal_vertex>', BLOB_NORMAL)
      .replace('#include <begin_vertex>', 'vec3 transformed = blobP;');
  };
  // Unit sphere; blobWarp works on the normalised position, so detail only sets smoothness.
  const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1, detail), material);
  mesh.frustumCulled = false;
  return { mesh, uniforms };
}

/** Pointer direction in the blob's local space, eased so the bulge flows instead of snapping. */
function pointerBulge(blob, rect, ease) {
  const idle = performance.now() - blob.lastMove > 2500;
  const t = performance.now() / 1000;
  const nx = idle ? Math.sin(t * .4) * .6 : (pointer.x / rect.width) * 2 - 1;
  const ny = idle ? Math.cos(t * .31) * .4 : 1 - ((pointer.y - rect.top) / rect.height) * 2;
  const target = new THREE.Vector3(nx, ny, .9).normalize().applyQuaternion(blob.mesh.quaternion.clone().invert());
  blob.uniforms.uPointer.value.lerp(target, ease).normalize();
}

/* ───────── 01 hero ───────── */
function initHero(stage, env) {
  const cfg = CONFIG.hero, pin = $('#hero-pin'), chars = $$('#hero-title .ch'), kor = $('#hero-kor');
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(cfg.fov, 1, .1, 100);
  const blob = createBlob(env, isMobile() ? cfg.detailMobile : cfg.detail);
  blob.lastMove = -1e9;
  addEventListener('pointermove', () => { blob.lastMove = performance.now(); });
  blob.mesh.scale.setScalar(cfg.radius);
  scene.add(blob.mesh);
  const rnd = mulberry32(11);
  const vec = chars.map(() => ({ x: (rnd() - .5) * 60, y: -105 - rnd() * 50, r: (rnd() - .5) * 50 }));
  let prog = 0;

  const pose = (p, time) => {
    const liq = smooth(segR(p, cfg.liquefy)), tw = smooth(segR(p, cfg.twist)) * (1 - smooth(segR(p, cfg.settle)));
    const settle = smooth(segR(p, cfg.settle)), exit = smooth(segR(p, cfg.exit));
    const u = blob.uniforms;
    u.uTime.value = time * cfg.flow * 4;
    u.uAmp.value = lerp(lerpR(cfg.amp, liq), cfg.amp[0] * 1.4, settle);
    u.uFreq.value = lerpR(cfg.freq, liq * (1 - settle));
    u.uTwist.value = tw * cfg.twistMax;
    u.uPull.value = (coarse ? .25 : 1) * cfg.pullMax * (1 - exit);
    u.uStretch.value = settle * .18 - exit * .3;
    blob.mesh.rotation.y = p * cfg.orbitTurns * Math.PI * 2 + tilt.x * cfg.tiltYaw;
    blob.mesh.rotation.x = tilt.y * cfg.tiltPitch;
    blob.mesh.position.y = .15 + exit * 3.2;
    blob.mesh.scale.setScalar(cfg.radius * (1 + liq * .12 - exit * .5));
  };
  const resize = (W, H) => { camera.aspect = W / H; camera.position.set(0, 0, fitDistance(camera, cfg.camDist, cfg.portraitFit)); camera.updateProjectionMatrix(); };
  const draw = (time, dt, rect) => {
    pose(reduce ? cfg.reduceAt : prog, reduce ? 3 : time);
    if (!reduce) pointerBulge(blob, rect, cfg.pointerEase);
    stage.renderer.render(scene, camera);
  };
  const mode = stage.add({ pin, draw, resize });
  if (!reduce) gsap.from(chars, { yPercent: 110, opacity: 0, stagger: .06, duration: 1.3, ease: 'expo.out', delay: .15 });
  track('#s-hero', (p) => {
    prog = p;
    const k = reduce ? 0 : smooth(segR(p, cfg.title));
    chars.forEach((c, i) => { const v = vec[i]; c.style.transform = `translate(${v.x * k}vw, ${v.y * k}vh) rotate(${v.r * k}deg)`; });
    showBy(kor, p, cfg.kor, -4, 0);
    stage.markDirty();
  }, (on) => { mode.on = on; stage.markDirty(); });
}

/* ───────── 06 finale: blob and a chrome ring lock-up with the title and a magnetic button ───────── */
function initFinale(stage, env) {
  const cfg = CONFIG.finale, pin = $('#fin-pin'), chars = $$('#fin-title .ch'), copy = $('#fin-copy');
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(CONFIG.hero.fov, 1, .1, 100);
  const blob = createBlob(env, isMobile() ? CONFIG.hero.detailMobile : CONFIG.hero.detail);
  blob.lastMove = -1e9;
  addEventListener('pointermove', () => { blob.lastMove = performance.now(); });
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.2, .05, 24, 160), chromeMaterial(env, { roughness: .08, iridescence: 1, iridescenceIOR: 1.6, iridescenceThicknessRange: [200, 700] }));
  const group = new THREE.Group();
  group.add(blob.mesh, ring);
  group.position.y = .95;
  scene.add(group);
  const rnd = mulberry32(21);
  const vec = chars.map(() => ({ x: (rnd() - .5) * 70, y: (rnd() - .5) * 60, r: (rnd() - .5) * 90 }));
  let prog = 0;
  const resize = (W, H) => { camera.aspect = W / H; camera.position.set(0, 0, fitDistance(camera, CONFIG.hero.camDist + .6, CONFIG.hero.portraitFit)); camera.updateProjectionMatrix(); };
  const draw = (time, dt, rect) => {
    const t = reduce ? 3 : time, g = reduce ? 1 : smooth(segR(prog, cfg.blobIn));
    const u = blob.uniforms;
    u.uTime.value = t; u.uAmp.value = .1; u.uFreq.value = 1.4; u.uTwist.value = 0; u.uPull.value = coarse ? .15 : .4; u.uStretch.value = 0;
    blob.mesh.scale.setScalar(.62 * g);
    ring.scale.setScalar(lerp(2.2, 1, g));
    ring.rotation.set(cfg.ringTilt + tilt.y * .2, t * cfg.ringSpin, .25 + tilt.x * .2);
    group.rotation.y = tilt.x * .3;
    if (!reduce) pointerBulge(blob, rect, CONFIG.hero.pointerEase);
    stage.renderer.render(scene, camera);
  };
  const mode = stage.add({ pin, draw, resize });
  track('#s-finale', (p) => {
    prog = p;
    const k = reduce ? 0 : 1 - smooth(segR(p, cfg.titleIn));
    chars.forEach((c, i) => { const v = vec[i]; c.style.transform = `translate(${v.x * k}vw, ${v.y * k}vh) rotate(${v.r * k}deg)`; c.style.opacity = 1 - k; });
    const c = reduce ? 1 : segR(p, cfg.copyIn);
    copy.style.opacity = c; copy.style.transform = `translateY(${(1 - c) * 40}px)`;
    copy.style.pointerEvents = c > .5 ? 'auto' : 'none';
    stage.markDirty();
  }, (on) => { mode.on = on; stage.markDirty(); });

  const magnet = $('#magnet'), label = magnet.querySelector('span');
  magnet.addEventListener('pointermove', (e) => {
    const r = magnet.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    gsap.to(magnet, { x: dx * .45, y: dy * .45, duration: .4, ease: 'power3.out' });
    gsap.to(label, { x: dx * .2, y: dy * .2, duration: .4, ease: 'power3.out' });
  });
  magnet.addEventListener('pointerleave', () => gsap.to([magnet, label], { x: 0, y: 0, duration: .8, ease: 'elastic.out(1, .4)' }));
  if (!reduce) gsap.to(magnet, { '--spin': '360deg', duration: 6, repeat: -1, ease: 'none' });
}

/* ── src/20-bubbles.js ── */
/* ───────── 02 bubbles: instanced soap bubbles with thin-film colour, sky reflection and a noisy pop ───────── */
const BUBBLE_VS = `
attribute float aPop, aSeed;
varying vec3 vN, vW, vLocal;
varying float vPop, vSeed;
void main() {
  mat4 m = modelMatrix * instanceMatrix;
  vec4 w = m * vec4(position, 1.);
  vW = w.xyz; vN = normalize(mat3(m) * normal); vLocal = position; vPop = aPop; vSeed = aSeed;
  gl_Position = projectionMatrix * viewMatrix * w;
}`;
const BUBBLE_FS = `
uniform sampler2D uSky;
uniform float uTime;
varying vec3 vN, vW, vLocal;
varying float vPop, vSeed;
${EQUI}
${FILM}
float h3(vec3 p) { return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
float vnoise(vec3 p) {
  vec3 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z);
}
void main() {
  vec3 n = normalize(vN) * (gl_FrontFacing ? 1. : -1.);
  vec3 v = normalize(cameraPosition - vW);
  float c = clamp(dot(n, v), 0., 1.), fres = pow(1. - c, 2.4);
  // Film gets thinner at the top and swirls with time, so colour bands drift over the shell.
  float th = vLocal.y * 1.1 + sin(vLocal.x * 3.5 + uTime * .9 + vSeed * 12.) * .3 + vnoise(vLocal * 2.4 + uTime * .15 + vSeed * 9.) * .8;
  vec3 irid = film(th + c * 1.4);
  vec3 r = reflect(-v, n);
  vec3 sky = texture2D(uSky, equi(r)).rgb;
  float spec = pow(max(dot(r, normalize(vec3(-.45, .7, .55))), 0.), 90.) * 2.2 + pow(max(dot(r, normalize(vec3(.6, -.25, .75))), 0.), 40.) * .5;
  vec3 col = sky * fres * .95 + irid * (.18 + .8 * fres) + spec;
  float alpha = clamp(.05 + fres * .88 + spec, 0., 1.);
  // Pop: the film tears along noise, the torn edge flashes iridescent.
  float tear = vnoise(vLocal * 7. + vSeed * 31.);
  if (tear < vPop) discard;
  float rim = 1. - smoothstep(0., .07, tear - vPop);
  col = mix(col, irid * 1.6 + .2, rim * step(.001, vPop));
  alpha = max(alpha, rim * step(.001, vPop) * .9);
  gl_FragColor = vec4(col, alpha);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

function initBubbles(stage, textures) {
  const cfg = CONFIG.bubbles, pin = $('#bub-pin'), popWord = $('#pop'), kor = $('#bub-kor');
  const count = isMobile() ? cfg.countMobile : cfg.count;
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(cfg.fov, 1, .1, 100);
  camera.position.set(0, 0, cfg.camZ);
  const uniforms = { uSky: { value: textures.sky }, uTime: { value: 0 } };
  const geo = new THREE.SphereGeometry(1, 48, 32);
  const pops = new Float32Array(count), seeds = new Float32Array(count);
  const rnd = mulberry32(7);
  const bubbles = Array.from({ length: count }, (_, i) => {
    const big = rnd() < cfg.bigShare;
    seeds[i] = rnd();
    return {
      z: lerpR(cfg.spreadZ, rnd()), r: big ? lerp(.6, cfg.radius[1], rnd()) : lerp(cfg.radius[0], .5, rnd() * rnd()),
      life: lerpR(cfg.life, rnd()), offset: rnd(), phase: rnd() * 6.28, seed: rnd() * 1000, poked: 0,
    };
  });
  geo.setAttribute('aPop', new THREE.InstancedBufferAttribute(pops, 1));
  geo.setAttribute('aSeed', new THREE.InstancedBufferAttribute(seeds, 1));
  const mat = new THREE.ShaderMaterial({ vertexShader: BUBBLE_VS, fragmentShader: BUBBLE_FS, uniforms, transparent: true, depthWrite: false, side: THREE.DoubleSide, toneMapped: false });
  const mesh = new THREE.InstancedMesh(geo, mat, count);
  mesh.frustumCulled = false;
  scene.add(mesh);
  const dummy = new THREE.Object3D(), proj = new THREE.Vector3();
  let prog = 0, viewH = 1, viewW = 1;

  const resize = (W, H) => {
    camera.aspect = W / H; camera.updateProjectionMatrix();
    viewH = 2 * Math.tan(THREE.MathUtils.degToRad(cfg.fov / 2)) * cfg.camZ; viewW = viewH * camera.aspect;
  };
  /** Pointer pops the bubble under it; it grows back after a while. */
  const poke = (rect, now) => {
    if (reduce || now - pointer.moved > 120) return;
    const px = pointer.x - rect.left, py = pointer.y - rect.top;
    bubbles.forEach((b, i) => {
      if (b.poked || pops[i] > 0) return;
      dummy.matrix.fromArray(mesh.instanceMatrix.array, i * 16);
      proj.setFromMatrixPosition(dummy.matrix).project(camera);
      const sx = (proj.x * .5 + .5) * rect.width, sy = (-proj.y * .5 + .5) * rect.height;
      const rPx = b.r / (2 * Math.tan(THREE.MathUtils.degToRad(cfg.fov / 2)) * (cfg.camZ - b.z)) * rect.height;
      if (Math.hypot(px - sx, py - sy) < rPx * cfg.pointerPopPx) b.poked = now;
    });
  };
  /** Hash of (bubble, life) so every life starts at a new x and pops at a new height, the same on every load. */
  const hash = (a, b) => { const s = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return s - Math.floor(s); };
  const layout = (p, time, now) => {
    const pp = reduce ? cfg.reduceAt : p;
    bubbles.forEach((b, i) => {
      // Each bubble lives several times across the scene: born below the screen, rises, pops part way up.
      const t = pp / b.life + b.offset, k = Math.floor(t), f = t - k;
      const depth = (cfg.camZ - b.z) / cfg.camZ;
      const y = lerpR(cfg.rise, f) * viewH * depth;
      const x = (hash(b.seed, k) * 2 - 1) * cfg.spreadX * viewW / 2 * depth + Math.sin(time * .6 + b.phase + pp * 9) * cfg.wobble;
      const popAt = lerpR(cfg.popAt, hash(b.seed + 7, k));
      let pop = reduce ? 0 : clamp01((f - popAt) / (cfg.popLen / b.life));
      if (b.poked) {
        const age = now - b.poked;
        const out = clamp01(age / cfg.popAnimMs), back = clamp01((age - cfg.regrowMs) / cfg.popAnimMs);
        pop = Math.max(pop, out * (1 - back));
        if (back >= 1) b.poked = 0;
      }
      pops[i] = pop;
      const s = b.r * (1 + pop * .12) * (pop >= 1 ? 0 : 1);
      dummy.position.set(x, y, b.z);
      dummy.rotation.set(time * .1 + b.phase, time * .13, 0);
      dummy.scale.setScalar(Math.max(s, 1e-4));
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    });
    mesh.instanceMatrix.needsUpdate = true;
    geo.attributes.aPop.needsUpdate = true;
  };
  const draw = (time, dt, rect) => {
    const now = performance.now();
    uniforms.uTime.value = reduce ? 0 : time;
    layout(prog, reduce ? 0 : time, now);
    poke(rect, now);
    stage.renderer.render(scene, camera);
  };
  const mode = stage.add({ pin, draw, resize });
  track('#s-bubbles', (p) => {
    prog = p;
    const k = reduce ? 1 : envelope(p, cfg.popWord);
    popWord.style.opacity = k;
    popWord.style.transform = `translate(-50%, -50%) scale(${reduce ? 1 : lerp(.86, 1.08, p)})`;
    showBy(kor, p, cfg.kor, 5, 0);
    stage.markDirty();
  }, (on) => { mode.on = on; stage.markDirty(); });
}

/* ── src/30-holo.js ── */
/* ───────── 03 holo cards: rounded cards with a view-dependent rainbow foil, sparkles and a moving glare ───────── */
const CARD_VS = `
varying vec2 vUv; varying vec3 vN, vW;
void main() {
  vUv = uv; vN = normalize(mat3(modelMatrix) * normal);
  vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz;
  gl_Position = projectionMatrix * viewMatrix * w;
}`;
const CARD_FS = `
uniform sampler2D uArt, uFoil, uSky;
uniform float uTime, uCorner, uBorder, uHolo;
uniform vec2 uTilt, uSize;
varying vec2 vUv; varying vec3 vN, vW;
${EQUI}
${FILM}
float sdBox(vec2 p, vec2 b, float r) { vec2 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }
float h2(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
void main() {
  vec2 p = (vUv - .5) * uSize;
  float d = sdBox(p, uSize * .5, uCorner), aa = fwidth(d);
  float alpha = 1. - smoothstep(-aa, aa, d);
  if (alpha <= 0.) discard;
  vec3 n = normalize(vN) * (gl_FrontFacing ? 1. : -1.);
  vec3 v = normalize(cameraPosition - vW);
  float c = clamp(dot(n, v), 0., 1.);
  vec3 sky = texture2D(uSky, equi(reflect(-v, n))).rgb;
  // The foil shifts with the card's angle to the eye plus the pointer or gyro tilt.
  vec2 shift = uTilt + n.xy * .7;
  vec3 foil = texture2D(uFoil, vUv * vec2(.7, .9) + shift * .22 + vec2(uTime * .01, 0.)).rgb;
  vec3 rain = film(vUv.x * .9 + vUv.y * .7 + shift.x * 1.3 - shift.y * .9 + uTime * .04);
  float inner = sdBox(p, uSize * .5 - uBorder, uCorner * .6);
  vec3 frame = sky * (.75 + .45 * rain) + pow(1. - c, 3.) * .4;
  vec3 col;
  if (gl_FrontFacing) {
    vec2 win = uSize - 2. * uBorder;
    vec2 wuv = p / win + .5;
    vec3 art = texture2D(uArt, vec2((wuv.x - .5) * win.x / win.y + .5, wuv.y)).rgb;
    float lum = dot(art, vec3(.299, .587, .114));
    col = art + foil * rain * (.16 + .6 * smoothstep(.5, 1., lum)) * uHolo;
    float glare = exp(-pow((vUv.x * .8 + vUv.y * .5 - .65 - shift.x * .9 + shift.y * .6) * 5., 2.));
    col += glare * .32 * (rain * .5 + .5);
    // Round four-point glints on a grid; each twinkles at its own tilt phase.
    vec2 gp = vUv * vec2(26., 36.), cell = floor(gp), fc = fract(gp) - .5;
    float s = h2(cell), sz = .05 + .12 * h2(cell + 7.);
    float glint = smoothstep(sz, 0., length(fc)) + smoothstep(.02, 0., abs(fc.x) * abs(fc.y) * 40.) * smoothstep(.45, 0., length(fc)) * .6;
    col += glint * pow(max(0., sin(s * 40. + shift.x * 14. + shift.y * 9. + uTime * 1.5)), 24.) * step(.8, s) * 1.3 * uHolo;
    col *= 1. - .22 * smoothstep(-.03, 0., inner);
    col = mix(col, frame, step(0., inner));
  } else {
    float ring = .5 + .5 * sin(length(p) * 42. - uTime * .6);
    col = foil * rain * (.8 + .3 * ring) + sky * .2;
    col = mix(col, frame, step(0., inner));
  }
  gl_FragColor = vec4(col, alpha);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

function initHolo(stage, textures) {
  const cfg = CONFIG.holo, pin = $('#holo-pin'), word = $('#holo-word'), kor = $('#holo-kor');
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(cfg.fov, 1, .1, 100);
  const geo = new THREE.PlaneGeometry(cfg.cardW, cfg.cardH);
  const time = { value: 0 };
  const cards = cfg.cards.map((name, i) => {
    const uniforms = { uArt: { value: textures[name] }, uFoil: { value: textures.foil }, uSky: { value: textures.sky }, uTime: time,
      uCorner: { value: cfg.corner }, uBorder: { value: cfg.border }, uHolo: { value: 1 }, uTilt: { value: new THREE.Vector2() },
      uSize: { value: new THREE.Vector2(cfg.cardW, cfg.cardH) } };
    const mesh = new THREE.Mesh(geo, new THREE.ShaderMaterial({ vertexShader: CARD_VS, fragmentShader: CARD_FS, uniforms, side: THREE.DoubleSide, transparent: true, toneMapped: false }));
    scene.add(mesh);
    return { mesh, uniforms, i };
  });
  textures.foil.wrapS = textures.foil.wrapT = THREE.MirroredRepeatWrapping;
  textures.foil.needsUpdate = true;
  let prog = 0, fanX = cfg.fanX;

  const resize = (W, H) => {
    camera.aspect = W / H; camera.position.set(0, 0, fitDistance(camera, cfg.camZ, cfg.portraitFit)); camera.updateProjectionMatrix();
    fanX = cfg.fanX * Math.min(1, camera.aspect / 1.1 + .25);
  };
  /** Focus amount for one card: rises, holds, falls inside its window. Returns [amount, local progress]. */
  const focusOf = (p, j) => { const [a, b] = cfg.focus[j], l = seg(p, a, b); return [smooth(seg(l, 0, .22)) * (1 - smooth(seg(l, .78, 1))), l]; };
  const pose = (p, t) => {
    const exit = smooth(segR(p, cfg.exit));
    const anyFocus = cfg.focus.reduce((m, _, j) => Math.max(m, focusOf(p, j)[0]), 0);
    cards.forEach(({ mesh, uniforms, i }) => {
      const o = i - 1, e = smooth(seg(p, cfg.enter[0] + i * .025, cfg.enter[1]));
      const [f, l] = focusOf(p, i);
      const others = anyFocus * (1 - f);
      let x = o * fanX * (1 + others * .55), y = -Math.abs(o) * .12, z = -Math.abs(o) * .3 - others * cfg.backPush;
      let ry = o * .28, rz = -o * cfg.fanRot;
      x = lerp(x, 0, f); y = lerp(y, 0, f); z = lerp(z, 1.1, f); ry = lerp(ry, 0, f); rz = lerp(rz, 0, f);
      ry += Math.PI * 2 * smooth(seg(l, .25, .75)) * (f > 0 ? 1 : 0);
      y = lerp(-2.3 - i * .45, y, e) + exit * (5 + i * .7);
      ry += (1 - e) * Math.PI * 3;
      mesh.position.set(x, y + Math.sin(t * .8 + i) * .04, z);
      mesh.rotation.set(tilt.y * cfg.tiltGain * .7 + (1 - e) * .6, ry + tilt.x * cfg.tiltGain, rz + exit * o * .5);
      mesh.scale.setScalar(lerp(1, cfg.focusScale * .82, f));
      uniforms.uTilt.value.set(tilt.x, tilt.y);
    });
  };
  const draw = (t) => {
    time.value = reduce ? 0 : t;
    pose(reduce ? cfg.reduceAt : prog, reduce ? 0 : t);
    stage.renderer.render(scene, camera);
  };
  const mode = stage.add({ pin, draw, resize });
  track('#s-holo', (p) => {
    prog = p;
    showBy(word, p, cfg.word, -5, 0);
    showBy(kor, p, cfg.kor, 5, 0);
    stage.markDirty();
  }, (on) => { mode.on = on; stage.markDirty(); });
}

/* ── src/40-melt.js ── */
/* ───────── 04 liquid type: extruded chrome letters that drip in the vertex shader, driven by progress and scroll speed ───────── */
// Drip columns come from the same function in GLSL and JS, so falling drops leave from the tips of the drips.
const dripColumn = (x) => Math.pow(.5 + .5 * Math.sin(x * 5.3 + 1.7) * Math.sin(x * 2.1 + 4), 3);
const MELT_HEAD = `
#define DRIP_BASE ${CONFIG.melt.dripBase.toFixed(3)}
#define DRIP_GAIN ${CONFIG.melt.dripColGain.toFixed(3)}
uniform float uMelt, uWobble, uTime, uTop, uBottom;
float dripColumn(float x) { return pow(.5 + .5 * sin(x * 5.3 + 1.7) * sin(x * 2.1 + 4.), 3.); }`;
const MELT_VERTEX = `
vec3 transformed = vec3(position);
float mh = clamp((uTop - transformed.y) / (uTop - uBottom), 0., 1.);
float col = dripColumn(transformed.x);
transformed.y -= uMelt * mh * mh * (DRIP_BASE + DRIP_GAIN * col);
transformed.x += sin(transformed.y * 3. + uTime * 2.) * uWobble * mh * .12;
transformed.z *= 1. + uMelt * mh * .25 * col;`;

function initMelt(stage, env) {
  const cfg = CONFIG.melt, pin = $('#melt-pin'), kor = $('#melt-kor');
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(cfg.fov, 1, .1, 100);
  const uniforms = { uMelt: { value: 0 }, uWobble: { value: 0 }, uTime: { value: 0 }, uTop: { value: 1 }, uBottom: { value: 0 } };
  const material = chromeMaterial(env, { roughness: cfg.roughness, iridescence: .35, iridescenceIOR: 1.5, iridescenceThicknessRange: [150, 500] });
  material.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, uniforms);
    shader.vertexShader = shader.vertexShader.replace('#include <common>', `#include <common>\n${MELT_HEAD}`).replace('#include <begin_vertex>', MELT_VERTEX);
  };
  const group = new THREE.Group();
  scene.add(group);
  const dropGeo = new THREE.SphereGeometry(1, 24, 16);
  const drops = new THREE.InstancedMesh(dropGeo, chromeMaterial(env, { roughness: .03 }), cfg.drops);
  drops.frustumCulled = false;
  group.add(drops);
  const rnd = mulberry32(3), dummy = new THREE.Object3D();
  let text = null, bounds = null, dropDefs = [], prog = 0, on = false;
  const spring = { x: 0, v: 0 };

  new FontLoader().load(cfg.fontUrl, (font) => {
    let geo = new TextGeometry(cfg.word, { font, size: cfg.size, height: cfg.depth, curveSegments: cfg.curveSegments,
      bevelEnabled: true, bevelThickness: cfg.bevelThickness, bevelSize: cfg.bevelSize, bevelSegments: cfg.bevelSegments });
    geo.center();
    geo = new TessellateModifier(cfg.tessEdge, cfg.tessIterations).modify(geo);
    geo.computeBoundingBox();
    bounds = geo.boundingBox;
    uniforms.uTop.value = bounds.max.y; uniforms.uBottom.value = bounds.min.y;
    text = new THREE.Mesh(geo, material);
    text.frustumCulled = false;
    group.add(text);
    // Drops leave from the strongest drip columns.
    const xs = Array.from({ length: 200 }, (_, i) => lerp(bounds.min.x, bounds.max.x, i / 199)).filter((x) => dripColumn(x) > .45);
    dropDefs = Array.from({ length: cfg.drops }, () => ({ x: xs[Math.floor(rnd() * xs.length)], start: lerpR(cfg.dropStart, rnd()), size: lerpR(cfg.dropSize, rnd()) }));
    stage.markDirty();
  }, undefined, (e) => console.error('MELT font failed to load', e));

  const resize = (W, H) => { camera.aspect = W / H; camera.position.set(0, 0, fitDistance(camera, cfg.camDist, cfg.portraitFit)); camera.updateProjectionMatrix(); };
  const layoutDrops = (p, melt) => {
    dropDefs.forEach((d, i) => {
      const local = (p - d.start) / cfg.dropLife, visible = local > 0 && local < 1.8 && melt > .2;
      const tip = bounds.min.y - melt * (cfg.dripBase + cfg.dripColGain * dripColumn(d.x));
      const form = smooth(clamp01(local / .25));
      dummy.position.set(d.x, tip - Math.max(0, local - .25) ** 2 * cfg.dropFall, 0);
      dummy.scale.set(d.size * form, d.size * form * (1 + (1 - form) * 1.5), d.size * form);
      if (!visible) dummy.scale.setScalar(1e-4);
      dummy.updateMatrix();
      drops.setMatrixAt(i, dummy.matrix);
    });
    drops.instanceMatrix.needsUpdate = true;
  };
  const draw = (time) => {
    if (!text) return;
    const p = reduce ? .4 : prog;
    const base = cfg.meltMax * smooth(segR(p, cfg.meltIn)) * (1 - smooth(segR(p, cfg.meltOut)));
    const s = Math.min(1, Math.abs(spring.x));
    const melt = base + s * cfg.dripGain;
    uniforms.uMelt.value = reduce ? cfg.meltMax * .45 : melt;
    uniforms.uWobble.value = reduce ? 0 : .15 + s * cfg.wobbleGain;
    uniforms.uTime.value = reduce ? 0 : time;
    group.scale.setScalar(1.5);
    group.position.y = cfg.lift;
    group.rotation.y = Math.sin(p * Math.PI * 2) * cfg.turns + tilt.x * cfg.tiltYaw;
    group.rotation.x = tilt.y * cfg.tiltPitch - .08;
    layoutDrops(p, uniforms.uMelt.value);
    stage.renderer.render(scene, camera);
  };
  const mode = stage.add({ pin, draw, resize });
  track('#s-melt', (p) => { prog = p; showBy(kor, p, cfg.kor, 0, -3); stage.markDirty(); }, (v) => { on = v; mode.on = v; stage.markDirty(); });
  if (reduce) return;
  gsap.ticker.add(() => {
    if (!on) return;
    const target = clamp(velocity() * cfg.velGain, -1, 1);
    spring.v += (target - spring.x) * cfg.stiffness;
    spring.v *= cfg.damping;
    spring.x += spring.v;
  });
}

/* ── src/50-flight.js ── */
/* ───────── 05 sky flight: camera path through chrome shapes, rings and clouds, with bloom ───────── */
function starShape(points = 5, outer = 1, inner = .48) {
  const s = new THREE.Shape();
  for (let i = 0; i <= points * 2; i++) {
    const a = (i / (points * 2)) * Math.PI * 2 + Math.PI / 2, r = i % 2 ? inner : outer;
    if (i === 0) s.moveTo(Math.cos(a) * r, Math.sin(a) * r); else s.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  return s;
}

/** Soft cloud puff drawn once into a canvas (same origin, so file:// is fine). */
function cloudTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), rnd = mulberry32(17);
  for (let i = 0; i < 16; i++) {
    const x = 128 + (rnd() - .5) * 120, y = 140 + (rnd() - .5) * 60, r = 40 + rnd() * 50;
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, 'rgba(255,255,255,.55)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function initFlight(stage, env, textures) {
  const cfg = CONFIG.flight, pin = $('#flight-pin'), word = $('#fly-word'), kor = $('#fly-kor');
  const mobile = isMobile(), rnd = mulberry32(29);
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(cfg.fov, 1, .1, 400);
  textures.sky.mapping = THREE.EquirectangularReflectionMapping;
  scene.background = textures.sky;
  scene.environment = env;
  scene.fog = new THREE.Fog(cfg.fog, cfg.fogNear, cfg.fogFar);
  const pathAt = (t, out = new THREE.Vector3()) => out.set(Math.sin(t * cfg.freqX) * cfg.swayX, Math.sin(t * cfg.freqY + 1) * cfg.swayY, -t * cfg.length);

  const iri = { iridescence: 1, iridescenceIOR: 1.7, iridescenceThicknessRange: [180, 650] };
  const kinds = [
    { geo: new THREE.TorusGeometry(.9, .34, 32, 96), mat: chromeMaterial(env, { roughness: .06, ...iri }) },
    { geo: new THREE.TorusGeometry(1.4, .06, 16, 128), mat: chromeMaterial(env, { roughness: .04 }) },
    { geo: new THREE.ExtrudeGeometry(starShape(), { depth: .28, bevelEnabled: true, bevelThickness: .14, bevelSize: .1, bevelSegments: 6, curveSegments: 4 }).center(),
      mat: chromeMaterial(env, { color: 0xdfe3ff, roughness: .12, ...iri }) },
    { geo: new THREE.SphereGeometry(.8, 48, 32), mat: chromeMaterial(env, { roughness: .03 }) },
    { geo: new THREE.CapsuleGeometry(.38, .9, 12, 24), mat: chromeMaterial(env, { color: 0xffd9f4, roughness: .08, ...iri }) },
  ];
  const per = mobile ? cfg.shapesPerMobile : cfg.shapesPer, dummy = new THREE.Object3D(), tmp = new THREE.Vector3();
  const sets = kinds.map(({ geo, mat }) => {
    const mesh = new THREE.InstancedMesh(geo, mat, per);
    mesh.frustumCulled = false;
    scene.add(mesh);
    const items = Array.from({ length: per }, () => {
      const t = lerp(-.02, 1.08, rnd()), a = rnd() * Math.PI * 2, r = lerpR(cfg.radial, Math.sqrt(rnd()));
      const pos = pathAt(t).add(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r * .7, (rnd() - .5) * 6));
      return { pos, rot: new THREE.Euler(rnd() * 6, rnd() * 6, rnd() * 6), spin: new THREE.Vector3(rnd() - .5, rnd() - .5, rnd() - .5).multiplyScalar(1.4), scale: .6 + rnd() * 1.1 };
    });
    return { mesh, items };
  });
  // Big rings the camera flies through.
  const ringCount = Math.floor(cfg.length / cfg.ringEvery);
  const gates = new THREE.InstancedMesh(new THREE.TorusGeometry(cfg.ringRadius, .13, 24, 180), chromeMaterial(env, { roughness: .05, ...iri }), ringCount);
  gates.frustumCulled = false;
  for (let i = 0; i < ringCount; i++) {
    const t = (i + .6) * cfg.ringEvery / cfg.length;
    pathAt(t, dummy.position); pathAt(t + .003, tmp);
    dummy.lookAt(tmp); dummy.scale.setScalar(1); dummy.updateMatrix();
    gates.setMatrixAt(i, dummy.matrix);
  }
  scene.add(gates);
  // Clouds, each with its own material so it can fade as the camera passes.
  const puff = cloudTexture();
  const clouds = Array.from({ length: mobile ? cfg.cloudsMobile : cfg.clouds }, () => {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: puff, transparent: true, depthWrite: false, opacity: cfg.cloudOpacity }));
    const t = lerp(-.02, 1.05, rnd()), side = rnd() < .5 ? -1 : 1;
    s.position.copy(pathAt(t)).add(new THREE.Vector3(side * lerp(3, 26, rnd()), lerp(-9, 7, rnd()), 0));
    s.scale.setScalar(lerpR(cfg.cloudSize, rnd()));
    scene.add(s);
    return s;
  });

  const composer = new EffectComposer(stage.renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: mobile ? cfg.samplesMobile : cfg.samples }));
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), cfg.bloom.strength, cfg.bloom.radius, cfg.bloom.threshold));
  composer.addPass(new OutputPass());
  let prog = 0, fov = cfg.fov;
  const resize = (W, H) => { camera.aspect = W / H; camera.updateProjectionMatrix(); composer.setPixelRatio(dprNow()); composer.setSize(W, H); };
  const draw = (time, dt) => {
    const t = reduce ? cfg.reduceAt : segR(prog, cfg.fly), clock = reduce ? 0 : time;
    pathAt(t, camera.position);
    pathAt(t + .02, tmp);
    tmp.x += tilt.x * cfg.tiltYaw * 10; tmp.y -= tilt.y * cfg.tiltPitch * 10;
    camera.lookAt(tmp);
    const target = reduce ? cfg.fov : cfg.fov + Math.min(cfg.fovKick, Math.abs(velocity()) * cfg.fovVelGain);
    fov += (target - fov) * cfg.fovEase;
    camera.fov = fov; camera.updateProjectionMatrix();
    sets.forEach(({ mesh, items }) => {
      items.forEach((it, i) => {
        dummy.position.copy(it.pos);
        dummy.rotation.set(it.rot.x + clock * it.spin.x + t * 8 * it.spin.y, it.rot.y + clock * it.spin.y, it.rot.z + t * 6 * it.spin.z);
        dummy.scale.setScalar(it.scale);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
      });
      mesh.instanceMatrix.needsUpdate = true;
    });
    clouds.forEach((c) => {
      const d = camera.position.z - c.position.z;
      c.material.opacity = cfg.cloudOpacity * smooth(segR(d, cfg.cloudFade));
      c.visible = d > cfg.cloudFade[0];
    });
    composer.render(dt);
  };
  const mode = stage.add({ pin, draw, resize });
  track('#s-flight', (p) => {
    prog = p;
    const k = reduce ? 1 : envelope(p, cfg.word);
    word.style.opacity = k;
    word.style.transform = `translate(-50%, -50%) scale(${reduce ? 1 : lerp(.8, 1.6, seg(p, cfg.word[0], cfg.word[3]))})`;
    showBy(kor, p, cfg.kor, -5, 0);
    stage.markDirty();
  }, (on) => { mode.on = on; stage.markDirty(); });
}

/* ── src/90-boot.js ── */
/* ───────── boot ───────── */
const stage = createStage($('#gl'));
const names = Object.keys(CONFIG.images);
Promise.all(names.map(loadTexture)).then((list) => {
  const textures = Object.fromEntries(names.map((n, i) => [n, list[i]]));
  const env = skyEnvironment(stage.renderer, textures.sky);
  initHero(stage, env);
  initBubbles(stage, textures);
  initHolo(stage, textures);
  initMelt(stage, env);
  initFlight(stage, env, textures);
  initFinale(stage, env);
  ScrollTrigger.refresh();
  stage.setReady();
}).catch((e) => console.error('CHROME failed to start', e));
// Registered last so every scene has updated its state before the shared renderer draws.
gsap.ticker.add((time, deltaMs) => stage.frame(time, deltaMs / 1000));

</script>
