<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUMI 수묵</title>
<meta name="description" content="먹이 번지는 한지, 스크롤로 걷는 수묵 인터랙션 연습">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<link rel="stylesheet" href="sumi.css">
<style>
  /* The brush mask is inlined at build time: CSS mask images are fetched with CORS and fail on file://. */
  :root { --brush-mask: url('%%IMG:brush-mask%%'); }
</style>
</head>
<body>
<div class="paper" aria-hidden="true"></div>

<main>
  <section class="scene" id="s-ink" style="--len:1000vh" aria-label="먹">
    <div class="pin">
      <canvas id="ink" aria-hidden="true"></canvas>
      <h1 class="v-title hero-title" id="hero-title" data-chars>수묵</h1>
      <p class="v-line hero-line" id="hero-line" data-chars>먹은 물을 따라 번진다</p>
      <div class="cue" id="cue" aria-hidden="true">아래로</div>
    </div>
  </section>

  <section class="scene" id="s-mnt" style="--len:1400vh" aria-label="산">
    <div class="pin">
      <div class="mnt-stage" id="mnt-stage" aria-hidden="true">
        <div class="mnt-far" id="mnt-far"><img src="../assets/sumi/mountains.webp" alt="" width="1774" height="887"></div>
      </div>
      <p class="v-line mnt-line" id="mnt-line" data-chars>산은 멀수록 옅어진다</p>
      <img class="seal seal-small" id="mnt-seal" src="../assets/sumi/seal.webp" alt="" width="480" height="461">
      <div class="veil" id="mnt-veil" aria-hidden="true"></div>
    </div>
  </section>

  <section class="scene" id="s-brush" style="--len:1300vh" aria-label="여백">
    <div class="pin">
      <img class="brush-ghost" id="brush-ghost" src="../assets/sumi/mountains.webp" alt="" width="1774" height="887">
      <div class="brush-bleed" id="brush-bleed" aria-hidden="true"></div>
      <div class="brush-ink" id="brush-ink" role="img" aria-label="붓글씨 여백"></div>
      <p class="v-line brush-cap" id="brush-cap" lang="zh-Hant">餘白</p>
    </div>
  </section>

  <section class="scene" id="s-water" style="--len:1100vh" aria-label="물">
    <div class="pin">
      <img class="water-ghost" id="water-ghost" src="../assets/sumi/ink-cloud.webp" alt="" width="1280" height="720">
      <div class="water" id="water">
        <video id="v-cloud" muted loop playsinline preload="none" poster="../assets/sumi/ink-cloud.webp" src="../assets/sumi/ink-cloud.mp4"></video>
        <video id="v-plume" muted loop playsinline preload="none" poster="../assets/sumi/ink-plume.webp" src="../assets/sumi/ink-plume.mp4"></video>
        <video id="v-bloom" muted loop playsinline preload="none" poster="../assets/sumi/ink-bloom.webp" src="../assets/sumi/ink-bloom.mp4"></video>
      </div>
      <p class="v-line water-line" id="water-line" data-chars>먹이 물을 만나면</p>
      <p class="v-line water-line2" id="water-line2" data-chars>구름이 된다</p>
    </div>
  </section>

  <section class="scene" id="s-plum" style="--len:1300vh" aria-label="매화">
    <div class="pin">
      <img class="plum-ghost" id="plum-ghost" src="../assets/sumi/plum.webp" alt="" width="1536" height="1024">
      <canvas id="plum" aria-hidden="true"></canvas>
      <h2 class="v-title plum-title" id="plum-title" data-chars>매화</h2>
    </div>
  </section>

  <section class="scene" id="s-end" style="--len:900vh" aria-label="낙관">
    <div class="pin">
      <div class="enso" id="enso" aria-hidden="true"></div>
      <img class="seal seal-big" id="seal-big" src="../assets/sumi/seal.webp" alt="붉은 낙관" width="480" height="461">
      <img class="seal seal-bleed" id="seal-bleed" src="../assets/sumi/seal.webp" alt="" width="480" height="461">
      <a class="magnet" id="magnet" href="../"><span>목록으로</span></a>
    </div>
  </section>
</main>

const TEX = { paper: '%%IMG:paper%%' };
</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="js/core.js"></script>
<script src="js/brush-geom.js"></script>
<script src="js/ink.js"></script>
<script src="js/mountains.js"></script>
<script src="js/brush.js"></script>
<script src="js/water.js"></script>
<script src="js/plum.js"></script>
<script src="js/end.js"></script>
</body>
</html>
