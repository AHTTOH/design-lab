<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POP-UP</title>
<meta name="description" content="스크롤하면 펼쳐지는 3D 종이 팝업북. 숲, 도시, 바다, 우주.">
<meta property="og:title" content="POP-UP">
<meta property="og:image" content="https://ahttoh.github.io/design-lab/assets/thumb/popup.webp">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    /* Every spread's --len is multiplied by this one value. 2026-09-28: the new-style batch settled on 1.0 (about 7,000vh). */
    --scroll-stretch: 1;
    --tomato: #ff4b33; --cobalt: #1f4bff; --emerald: #10b566; --sun: #ffc619; --pink: #ff3d9a; --teal: #00707a;
    --paper: #ffffff; --ink: #0d1b5c; --bg: #063e4a;
    --korean: 'Pretendard Variable', system-ui, sans-serif;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: clip; }
  body { background: var(--bg); color: var(--paper); font-family: var(--korean); }
  ::selection { background: var(--sun); color: var(--ink); }

  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  main { position: relative; z-index: 1; }
  .scene { position: relative; height: calc(var(--len) * var(--scroll-stretch)); }
  .pin { position: sticky; top: 0; height: 100vh; overflow: hidden; pointer-events: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* cover: scroll cue and the iOS tilt button */
  .cue { position: absolute; left: 50%; bottom: 4.5vh; transform: translateX(-50%); display: grid; justify-items: center; gap: 10px; font: 700 14px var(--korean); letter-spacing: -.01em; color: var(--paper); will-change: opacity; }
  .cue i { position: relative; display: block; width: 3px; height: 54px; border-radius: 3px; overflow: hidden; background: rgba(255, 255, 255, .22); }
  .cue i::after { content: ''; position: absolute; inset: 0; background: var(--sun); transform-origin: top; animation: cue 1.8s var(--ease) infinite; }
  @keyframes cue { 0% { transform: scaleY(0); opacity: 1; } 60% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }
  .tilt-btn { position: absolute; left: 50%; top: 3.5vh; transform: translateX(-50%); pointer-events: auto; padding: 12px 22px; border: 3px solid var(--ink); border-radius: 14px;
    font: 800 15px var(--korean); color: var(--ink); background: var(--sun); box-shadow: 0 5px 0 var(--ink); }
  .tilt-btn:active { transform: translate(-50%, 3px); box-shadow: 0 2px 0 var(--ink); }
  .tilt-btn:focus-visible { outline: 3px solid var(--paper); outline-offset: 5px; }

  /* back cover: magnetic button back to the list */
  .fin-copy { position: absolute; left: 0; right: 0; bottom: 7vh; display: grid; place-items: center; opacity: 0; will-change: opacity, transform; }
  .magnet { display: grid; place-items: center; width: 136px; height: 136px; border-radius: 50%; pointer-events: auto; text-decoration: none;
    color: var(--ink); font: 800 1.08rem var(--korean); letter-spacing: -.02em;
    background: var(--sun); border: 4px solid var(--ink); box-shadow: 0 8px 0 var(--ink), 0 20px 40px rgba(0, 0, 0, .35);
    transition: background-color .2s, box-shadow .15s; will-change: transform; }
  .magnet span { pointer-events: none; will-change: transform; }
  .magnet:hover { background: var(--pink); color: var(--paper); }
  .magnet:active { box-shadow: 0 2px 0 var(--ink), 0 10px 24px rgba(0, 0, 0, .3); }
  .magnet:focus-visible { outline: 4px solid var(--paper); outline-offset: 7px; }
  .fin-copy.on .magnet { pointer-events: auto; }
  .fin-copy:not(.on) .magnet { pointer-events: none; }
  .fin-copy:focus-within { opacity: 1 !important; }

  @media (max-width: 760px) {
    .magnet { width: 118px; height: 118px; }
    .fin-copy { bottom: 9vh; }
  }
  /* reduced motion: one finished spread per screen, no cue animation */
  .reduce .scene { height: 100vh; }
  .reduce .fin-copy { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .cue i::after { animation: none; transform: scaleY(1); }
  }
</style>
</head>
<body>
<canvas id="gl" role="img" aria-label="종이 팝업북. 표지가 열리고 숲, 도시, 바다, 우주 장면이 차례로 접혀 올라온다."></canvas>

<main>
  <section class="scene" id="s-cover" style="--len:1000vh">
    <div class="pin">
      <h1 class="sr">POP-UP</h1>
      <button class="tilt-btn" id="tilt-btn" type="button" hidden>기울기 켜기</button>
      <div class="cue" id="cue"><i aria-hidden="true"></i><span>스크롤</span></div>
    </div>
  </section>
  <section class="scene" id="s-forest" style="--len:1300vh"><h2 class="sr">숲</h2></section>
  <section class="scene" id="s-city" style="--len:1300vh"><h2 class="sr">도시</h2></section>
  <section class="scene" id="s-ocean" style="--len:1200vh"><h2 class="sr">바다</h2></section>
  <section class="scene" id="s-space" style="--len:1200vh"><h2 class="sr">우주</h2></section>
  <section class="scene" id="s-back" style="--len:1000vh">
    <div class="pin">
      <h2 class="sr">뒤표지</h2>
      <div class="fin-copy" id="fin-copy"><a class="magnet" id="magnet" href="../"><span>목록으로</span></a></div>
    </div>
  </section>
</main>

} }

function mulberry32(seed) { let a = seed; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ───────── scroll: one continuous timeline t = spread index + progress inside that spread ───────── */
if (reduce) document.documentElement.classList.add('reduce');
const lenis = reduce ? null : new Lenis({ lerp: CONFIG.lenisLerp });
if (lenis) { gsap.ticker.add((time) => lenis.raf(time * 1000)); gsap.ticker.lagSmoothing(0); }

const timeline = (() => {
  const sections = $$('.scene');
  let tops = [], ends = [];
  const measure = () => {
    const max = document.documentElement.scrollHeight - innerHeight;
    tops = sections.map((s) => s.offsetTop);
    ends = tops.slice(1).concat([max]);
  };
  const at = (y) => {
    if (reduce) {
      // one finished spread per screen: snap to the spread whose screen is mostly in view
      const i = clamp(Math.round(y / innerHeight), 0, sections.length - 1);
      return CONFIG.reduceAt[i];
    }
    for (let i = sections.length - 1; i >= 0; i--) {
      if (y >= tops[i]) return i + clamp01((y - tops[i]) / Math.max(1, ends[i] - tops[i]));
    }
    return 0;
  };
  addEventListener('resize', measure);
  measure();
  return { now: () => at(scrollY), count: sections.length, measure };
})();

/* ───────── pointer and tilt (gyroscope on touch devices, pointer on desktop) ───────── */
const tilt = { x: 0, y: 0, tx: 0, ty: 0 };
{
  const cfg = CONFIG.tilt, btn = $('#tilt-btn');
  let baseBeta = null;
  const onOrient = (e) => {
    if (e.gamma === null || e.beta === null) return;
    if (baseBeta === null) baseBeta = e.beta;
    tilt.tx = clamp(e.gamma / cfg.rangeDeg, -1, 1);
    tilt.ty = clamp((e.beta - baseBeta) / cfg.rangeDeg, -1, 1);
  };
  const listen = () => addEventListener('deviceorientation', onOrient);
  if (!coarse) {
    addEventListener('pointermove', (e) => { tilt.tx = (e.clientX / innerWidth) * 2 - 1; tilt.ty = (e.clientY / innerHeight) * 2 - 1; });
  } else if (typeof DeviceOrientationEvent === 'undefined') {
    console.info('DeviceOrientationEvent is not available, tilt stays level');
  } else if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    // iOS grants motion access only from a user gesture, so the button exists only where that API exists.
    btn.hidden = false;
    btn.addEventListener('click', async () => {
      btn.hidden = true;
      try {
        const state = await DeviceOrientationEvent.requestPermission();
        if (state === 'granted') listen(); else console.error('device orientation permission', state);
      } catch (e) { console.error('device orientation permission failed', e); }
    });
  } else listen();
  gsap.ticker.add(() => { if (reduce) return; tilt.x += (tilt.tx - tilt.x) * cfg.ease; tilt.y += (tilt.ty - tilt.y) * cfg.ease; });
}

/* ───────── paper: procedural fibre texture, card stock materials, cut shapes and fold mechanisms ───────── */

/** Tileable paper fibre height field drawn in a canvas: thousands of short strokes plus fine speckle. */
function makeGrain() {
  const cfg = CONFIG.paper, size = cfg.grainPx, rnd = mulberry32(7);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = 'rgb(128,128,128)'; g.fillRect(0, 0, size, size);
  g.lineCap = 'round';
  for (let i = 0; i < cfg.fibres; i++) {
    const x = rnd() * size, y = rnd() * size, a = rnd() * PI, l = 3 + rnd() * 16, v = rnd() < 0.5 ? 255 : 0;
    g.strokeStyle = `rgba(${v},${v},${v},${0.035 + rnd() * 0.075})`;
    g.lineWidth = 0.5 + rnd() * 1.3;
    const dx = Math.cos(a) * l, dy = Math.sin(a) * l;
    // draw the stroke in all 9 tiles around the canvas so the texture wraps without a seam
    for (let ox = -size; ox <= size; ox += size) for (let oy = -size; oy <= size; oy += size) {
      g.beginPath(); g.moveTo(x + ox, y + oy); g.lineTo(x + ox + dx, y + oy + dy); g.stroke();
    }
  }
  const img = g.getImageData(0, 0, size, size), h = new Float32Array(size * size);
  for (let i = 0; i < h.length; i++) h[i] = (img.data[i * 4] + (rnd() - 0.5) * 14) / 255;

  const colour = document.createElement('canvas'), normal = document.createElement('canvas'), rough = document.createElement('canvas');
  [colour, normal, rough].forEach((cv) => { cv.width = cv.height = size; });
  const ci = colour.getContext('2d').createImageData(size, size), ni = normal.getContext('2d').createImageData(size, size), ri = rough.getContext('2d').createImageData(size, size);
  const at = (x, y) => h[((y + size) % size) * size + ((x + size) % size)];
  const [r0, r1] = cfg.roughness;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const i = (y * size + x) * 4, v = at(x, y);
    const tone = clamp(246 + (v - 0.5) * 50, 0, 255);
    ci.data[i] = ci.data[i + 1] = ci.data[i + 2] = tone; ci.data[i + 3] = 255;
    const dx = (at(x + 1, y) - at(x - 1, y)) * 4, dy = (at(x, y + 1) - at(x, y - 1)) * 4;
    const len = Math.hypot(dx, dy, 1);
    ni.data[i] = (-dx / len * 0.5 + 0.5) * 255; ni.data[i + 1] = (dy / len * 0.5 + 0.5) * 255; ni.data[i + 2] = (1 / len * 0.5 + 0.5) * 255; ni.data[i + 3] = 255;
    ri.data[i] = ri.data[i + 1] = ri.data[i + 2] = lerp(r0, r1, clamp01(v * 1.4 - 0.2)) * 255; ri.data[i + 3] = 255;
  }
  colour.getContext('2d').putImageData(ci, 0, 0); normal.getContext('2d').putImageData(ni, 0, 0); rough.getContext('2d').putImageData(ri, 0, 0);
  const tex = (cv, srgb) => { const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };
  return { map: tex(colour, true), normal: tex(normal, false), rough: tex(rough, false) };
}

const paperKit = { grain: null, cache: new Map() };

function grainCopy(tex, rx, ry) {
  const t = tex.clone(); t.repeat.set(rx, ry); t.needsUpdate = true; return t;
}

/** Face and cut-edge materials for one card colour. UVs are in world units, so the grain has one scale everywhere. */
function paperMats(color, rx = CONFIG.paper.grainRepeat, ry = rx) {
  const key = `${color}|${rx.toFixed(3)}|${ry.toFixed(3)}`;
  if (paperKit.cache.has(key)) return paperKit.cache.get(key);
  const cfg = CONFIG.paper, g = paperKit.grain;
  const face = new THREE.MeshStandardMaterial({
    color, map: grainCopy(g.map, rx, ry), normalMap: grainCopy(g.normal, rx, ry), normalScale: new THREE.Vector2(cfg.normal, cfg.normal),
    roughnessMap: grainCopy(g.rough, rx, ry), roughness: 1, metalness: 0,
  });
  // A scissor cut shows the card's core a little lighter than its face.
  const edge = new THREE.MeshStandardMaterial({ color: new THREE.Color(color).lerp(new THREE.Color('#ffffff'), cfg.edgeLift), roughness: 0.95, metalness: 0 });
  const mats = [face, edge];
  paperKit.cache.set(key, mats);
  return mats;
}

/* shapes (all in the XY plane, base on y = 0 unless noted) */
function rectShape(w, h, x0 = -w / 2, y0 = 0) {
  const s = new THREE.Shape(); s.moveTo(x0, y0); s.lineTo(x0 + w, y0); s.lineTo(x0 + w, y0 + h); s.lineTo(x0, y0 + h); s.closePath(); return s;
}
function roundRectShape(w, h, r, x0 = -w / 2, y0 = 0) {
  const s = new THREE.Shape();
  s.moveTo(x0 + r, y0); s.lineTo(x0 + w - r, y0); s.quadraticCurveTo(x0 + w, y0, x0 + w, y0 + r); s.lineTo(x0 + w, y0 + h - r);
  s.quadraticCurveTo(x0 + w, y0 + h, x0 + w - r, y0 + h); s.lineTo(x0 + r, y0 + h); s.quadraticCurveTo(x0, y0 + h, x0, y0 + h - r); s.lineTo(x0, y0 + r);
  s.quadraticCurveTo(x0, y0, x0 + r, y0); return s;
}
function circleShape(r, cx = 0, cy = r) { const s = new THREE.Shape(); s.absarc(cx, cy, r, 0, PI * 2, false); return s; }
function ringShape(ro, ri) { const s = circleShape(ro, 0, 0); const hole = new THREE.Path(); hole.absarc(0, 0, ri, 0, PI * 2, true); s.holes.push(hole); return s; }
function polyShape(pts) { const s = new THREE.Shape(); pts.forEach(([x, y], i) => (i ? s.lineTo(x, y) : s.moveTo(x, y))); s.closePath(); return s; }
function starShape(ro, ri, n = 5, cy = 0) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) { const a = HALF_PI + (i * PI) / n, r = i % 2 ? ri : ro; pts.push([Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return polyShape(pts);
}
/** Pine silhouette: stacked jagged tiers on a short trunk. */
function pineShape(w, h, tiers = 4) {
  const trunk = h * 0.12, tw = w * 0.14, pts = [[-tw / 2, 0], [tw / 2, 0], [tw / 2, trunk]];
  const right = [], step = (h - trunk) / tiers;
  for (let i = 0; i < tiers; i++) {
    const y = trunk + i * step, k = 1 - i / tiers, half = (w / 2) * (0.35 + 0.65 * k);
    right.push([half, y], [half * 0.45, y + step * 0.85]);
  }
  pts.push(...right, [0, h]);
  pts.push(...right.slice().reverse().map(([x, y]) => [-x, y]));
  pts.push([-tw / 2, trunk]);
  return polyShape(pts);
}
/** Strip whose top edge is a wave, spanning x0..x1. */
function waveShape(x0, x1, h, amp, waves, phase) {
  const s = new THREE.Shape(), n = 48;
  s.moveTo(x0, 0); s.lineTo(x1, 0);
  for (let i = n; i >= 0; i--) {
    const x = lerp(x0, x1, i / n), a = ((x - x0) / (x1 - x0)) * waves * PI * 2 + phase;
    s.lineTo(x, h + Math.sin(a) * amp + Math.sin(a * 2.3 + 1) * amp * 0.25);
  }
  s.closePath(); return s;
}
/** Cloud from overlapping bumps on a flat base. */
function cloudShape(w, h) {
  const s = new THREE.Shape(), bumps = [[-0.36, 0.42], [-0.1, 0.62], [0.18, 0.55], [0.38, 0.38]];
  s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0);
  s.quadraticCurveTo(w / 2 + 0.02, h * 0.3, w * 0.42, h * 0.38);
  bumps.slice().reverse().forEach(([bx, by], i, arr) => {
    const nx = i + 1 < arr.length ? arr[i + 1][0] : -0.46;
    s.quadraticCurveTo(w * (bx + nx) / 2 + w * 0.02, h * (by + 0.5), w * nx, h * by * 0.8);
  });
  s.quadraticCurveTo(-w / 2 - 0.02, h * 0.3, -w / 2, 0);
  return s;
}

/* meshes */
function cut(shape, color, depth = CONFIG.paper.thick) {
  const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 14 });
  geo.translate(0, 0, -depth / 2);
  const m = new THREE.Mesh(geo, paperMats(color));
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
/** Flat printed or glued shape without its own thickness (windows, stripes). */
function glue(shape, color, z = CONFIG.paper.thick / 2 + 0.0015) {
  const m = new THREE.Mesh(new THREE.ShapeGeometry(shape, 12), paperMats(color)[0]);
  m.position.z = z; m.receiveShadow = true;
  return m;
}

/* fold mechanisms. Each returns { hinge, body, set(e) } where e 0 = folded flat, 1 = standing, > 1 overshoot. */
function lift(layer) { return CONFIG.paper.thick / 2 + 0.0015 + layer * CONFIG.paper.layerLift; }

/** Single hinged flap. dir 1 lies back (top away from the reader), -1 lies forward. */
function flap(parent, { x = 0, z = 0, y = 0, dir = 1, layer = 0 } = {}) {
  const hinge = new THREE.Group(); hinge.position.set(x, y + lift(layer), z); parent.add(hinge);
  const body = new THREE.Group(); hinge.add(body);
  return { hinge, body, set(e) { hinge.rotation.x = -dir * HALF_PI * (1 - e); } };
}

/** Figure glued to a V-fold support: two card wings behind it open like a book as it stands. */
function vfold(parent, { x = 0, z = 0, y = 0, dir = 1, layer = 0, w = 0.5, h = 0.8, color = COLORS.white, open = 0.95 } = {}) {
  const f = flap(parent, { x, z, y, dir, layer });
  const back = -CONFIG.paper.thick * 1.2;
  const L = new THREE.Group(), R = new THREE.Group();
  L.position.z = R.position.z = back;
  L.add(cut(rectShape(w, h, -w, 0), color)); R.add(cut(rectShape(w, h, 0, 0), color));
  f.body.add(L, R);
  return { ...f, set(e) { f.set(e); const a = open * clamp01(e); L.rotation.y = -a; R.rotation.y = a; } };
}

/** Parallel-fold box: the front stands, the roof and both sides swing out from behind it. */
function box(parent, { x = 0, z = 0, dir = 1, layer = 0, w = 0.6, h = 1.2, d = 0.4, color, side, roof } = {}) {
  const f = flap(parent, { x, z, dir, layer });
  const t = CONFIG.paper.thick;
  f.body.add(cut(rectShape(w, h), color));
  const top = new THREE.Group(); top.position.set(0, h, -t); top.add(cut(rectShape(w, d), roof ?? side ?? color));
  const sl = new THREE.Group(); sl.position.set(-w / 2, 0, -t); sl.add(cut(rectShape(d, h, -d, 0), side ?? color));
  const sr = new THREE.Group(); sr.position.set(w / 2, 0, -t); sr.add(cut(rectShape(d, h, 0, 0), side ?? color));
  f.body.add(top, sl, sr);
  return { ...f, w, h, set(e) {
    f.set(e);
    const k = clamp01(e), a = PI - HALF_PI * k;
    top.rotation.x = -a; sl.rotation.y = -a; sr.rotation.y = a;
  } };
}

/** Accordion paper spring standing on the page. set(ext) 0 = flat, 1 = extended; returns the top point. */
function spring(parent, { x = 0, z = 0, segs = 9, len = 0.15, w = 0.22, colors = [COLORS.white, COLORS.sun], maxAngle = 1.1 } = {}) {
  const g = new THREE.Group(); g.position.set(x, lift(0), z); parent.add(g);
  const t = CONFIG.paper.thick * 0.8;
  const parts = [];
  for (let i = 0; i < segs; i++) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, len, t), paperMats(colors[i % colors.length])[0]);
    m.castShadow = true; m.receiveShadow = true; g.add(m); parts.push(m);
  }
  const top = new THREE.Group(); g.add(top);
  return { group: g, top, set(ext) {
    const th = maxAngle * Math.max(0, ext), hh = len * Math.sin(th), c = len * Math.cos(th);
    for (let i = 0; i < segs; i++) {
      const z0 = (i % 2 ? -c : 0) + c / 2, z1 = ((i + 1) % 2 ? -c : 0) + c / 2;
      const m = parts[i];
      m.position.set(0, (i + 0.5) * hh, (z0 + z1) / 2);
      m.rotation.x = Math.atan2(z1 - z0, hh);
    }
    top.position.set(0, segs * hh, ((segs % 2 ? -c : 0) + c / 2));
  } };
}

/** Paper ornament planet: three discs slotted through each other at 60 degrees. */
function paperPlanet(r, colors, ring) {
  const g = new THREE.Group();
  for (let i = 0; i < 3; i++) {
    const d = cut(circleShape(r, 0, 0), colors[i % colors.length]);
    d.rotation.y = (i * PI) / 3; g.add(d);
  }
  if (ring) { const rg = cut(ringShape(r * 1.75, r * 1.28), ring); rg.rotation.x = -HALF_PI + 0.35; rg.rotation.y = 0.25; g.add(rg); }
  return g;
}

/** Thin paper thread hanging down from the origin. */
function thread(len, color = COLORS.white) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, len, 5), paperMats(color)[1]);
  m.position.y = -len / 2; m.castShadow = true;
  return m;
}

/** Cut-paper word lying flat on the page, readable from the reader's side. */
function flatWord(parent, font, text, { x = 0, z = 0, size = 0.3, color = COLORS.tomato, shadow = COLORS.ink, layer = 0 } = {}) {
  const g = new THREE.Group(); g.position.set(x, lift(layer), z); g.rotation.x = -HALF_PI; parent.add(g);
  const shapes = font.generateShapes(text, size);
  const back = cut(shapes, shadow); back.position.set(size * 0.05, -size * 0.05, -CONFIG.paper.thick * 0.9);
  g.add(back, cut(shapes, color));
  return g;
}

/* ───────── stage: renderer, studio table, lights, camera ───────── */
function createStage(canvas) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: !coarse, powerPreference: 'high-performance' });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping; // saturated card stock goes muddy under filmic curves
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;

  const scene = new THREE.Scene();
  const bg = new THREE.Color(CONFIG.backdrop[0]);
  scene.background = bg.clone();
  scene.fog = new THREE.Fog(bg.clone(), 10, 40);

  const cfgT = CONFIG.table;
  // table: backdrop colour times a soft radial falloff, so the book sits in a studio pool of light
  const vc = document.createElement('canvas'); vc.width = vc.height = 512;
  const vg = vc.getContext('2d'), grad = vg.createRadialGradient(256, 256, 512 * cfgT.vignetteInner, 256, 256, 512 * cfgT.vignetteOuter);
  const edge = Math.round(255 * cfgT.edge);
  grad.addColorStop(0, '#ffffff'); grad.addColorStop(1, `rgb(${edge},${edge},${edge})`);
  vg.fillStyle = grad; vg.fillRect(0, 0, 512, 512);
  const vTex = new THREE.CanvasTexture(vc); vTex.colorSpace = THREE.SRGBColorSpace;
  const tableMat = new THREE.MeshStandardMaterial({ color: bg.clone(), map: vTex, roughness: 1, metalness: 0 });
  const table = new THREE.Mesh(new THREE.PlaneGeometry(cfgT.size, cfgT.size), tableMat);
  table.rotation.x = -HALF_PI; table.position.y = -0.002; table.receiveShadow = true;
  scene.add(table);

  const cfgL = CONFIG.light;
  const hemi = new THREE.HemisphereLight(0xffffff, bg.clone(), cfgL.hemi);
  scene.add(hemi);
  const key = new THREE.DirectionalLight(0xffffff, cfgL.key);
  key.position.set(...cfgL.keyPos);
  key.castShadow = true;
  const map = isMobile() ? cfgL.shadowMapMobile : cfgL.shadowMap;
  key.shadow.mapSize.set(map, map);
  const s = cfgL.shadowSpan;
  Object.assign(key.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: 1, far: 30 });
  key.shadow.radius = cfgL.radius;
  key.shadow.bias = -0.0004;
  key.shadow.normalBias = 0.012;
  scene.add(key, key.target);

  const camera = new THREE.PerspectiveCamera(CONFIG.camera.fov, 1, CONFIG.camera.near, CONFIG.camera.far);

  const fit = () => {
    renderer.setPixelRatio(dprNow());
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  };
  addEventListener('resize', fit);
  fit();

  /** Blend the backdrop between spreads. */
  const tmp = new THREE.Color(), tmp2 = new THREE.Color();
  function setBackdrop(t) {
    const i = clamp(Math.floor(t), 0, CONFIG.backdrop.length - 1), j = Math.min(i + 1, CONFIG.backdrop.length - 1);
    const turn = CONFIG.book.turn, k = smooth(seg(t - i, 1 + turn[0], 1 + turn[1]));
    tmp.set(CONFIG.backdrop[i]).lerp(tmp2.set(CONFIG.backdrop[j]), k);
    tableMat.color.copy(tmp);
    hemi.groundColor.copy(tmp);
    scene.background.copy(tmp).multiplyScalar(cfgT.skyScale);
    scene.fog.color.copy(scene.background);
  }
  /** Fog follows the camera distance, so a far portrait camera does not wash the book out. */
  function setFog(d) { scene.fog.near = d * cfgT.fogNear; scene.fog.far = d * cfgT.fogFar; }
  return { renderer, scene, camera, setBackdrop, setFog };
}

/* ───────── camera: keyed shots along the global timeline, pointer tilt on top ───────── */
function createCameraRig(camera) {
  const shots = CONFIG.shots, target = new THREE.Vector3(), pos = new THREE.Vector3();
  const pose = { p: [0, 0, 0], az: 0, el: 0, d: 0 };
  function sample(t) {
    let i = 0;
    while (i < shots.length - 2 && t > shots[i + 1].t) i++;
    const a = shots[i], b = shots[i + 1], k = smooth(seg(t, a.t, b.t));
    for (let n = 0; n < 3; n++) pose.p[n] = lerp(a.p[n], b.p[n], k);
    pose.az = lerp(a.az, b.az, k); pose.el = lerp(a.el, b.el, k);
    pose.d = Math.exp(lerp(Math.log(a.d), Math.log(b.d), k));
    return pose;
  }
  return function place(t, time) {
    const s = sample(t), cfg = CONFIG.tilt;
    // portrait screens back off so the open spread still fits across
    const fitK = 1 / Math.min(1, camera.aspect / CONFIG.camera.portraitFit);
    const drift = reduce ? 0 : Math.sin(time * 0.13) * 2.5;
    const az = (s.az + drift + tilt.x * cfg.yaw) * DEG, el = clamp(s.el - tilt.y * cfg.pitch, 8, 80) * DEG;
    const d = s.d * fitK;
    target.set(...s.p);
    pos.set(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)).multiplyScalar(d).add(target);
    camera.position.copy(pos);
    camera.lookAt(target);
    return d;
  };
}

/* ───────── the book: five hinged leaves around the spine (x = 0), pages lie in the XZ plane ───────── */
function loadImage(name) {
  return new Promise((resolve, reject) => new THREE.TextureLoader().load(CONFIG.images[name], (t) => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; resolve(t); }, undefined,
    (e) => reject(new Error(`image ${name} failed to load: ${e?.message ?? e}`))));
}

function createBook(scene, art) {
  const cfg = CONFIG.book, N = cfg.leaves, g = cfg.leafGap;
  const thick = (k) => (k === 0 || k === N - 1 ? cfg.boardT : cfg.pageT);
  // stack heights: every leaf keeps a clearance g above the one below, so folded pieces fit between pages
  const below = (from, to) => { let y = 0; for (let j = from; j < to; j++) y += thick(j) + g; return y; };
  const root = new THREE.Group(); scene.add(root);
  const leaves = [];
  const isBoard = (k) => k === 0 || k === N - 1;

  /** Material for a printed board face: the art cropped to the board's aspect, fibre relief on top. */
  function artMat(tex, w, d, flipX) {
    const t = tex.clone(); t.needsUpdate = true;
    const aspect = (w / d) / (tex.image.width / tex.image.height);
    t.wrapS = THREE.RepeatWrapping;
    // the verso of the back board is seen after a half turn, so its art is turned 180 degrees
    t.repeat.set(aspect * (flipX ? -1 : 1), flipX ? -1 : 1);
    t.offset.set(flipX ? 0.5 + aspect / 2 : 0.5 - aspect / 2, flipX ? 1 : 0);
    t.wrapT = THREE.RepeatWrapping;
    const k = CONFIG.paper.grainRepeat, base = paperMats(COLORS.white, w * k, d * k)[0];
    return new THREE.MeshStandardMaterial({ map: t, normalMap: base.normalMap, normalScale: base.normalScale, roughnessMap: base.roughnessMap, roughness: 1, metalness: 0 });
  }

  for (let k = 0; k < N; k++) {
    const board = isBoard(k);
    const w = cfg.pageW + (board ? cfg.boardPad : 0), d = cfg.pageD + (board ? cfg.boardPad * 2 : 0), th = board ? cfg.boardT : cfg.pageT;
    const kk = CONFIG.paper.grainRepeat;
    const edgeColor = board ? (k === 0 ? cfg.board : cfg.backBoard) : cfg.recto[k];
    const edgeMat = paperMats(edgeColor, w * kk, d * kk)[1];
    const faceMat = (c, flip) => (c === 'cover' ? artMat(art.cover, w, d, false) : c === 'back' ? artMat(art.back, w, d, flip) : paperMats(c, w * kk, d * kk)[0]);
    // BoxGeometry groups: +x, -x, +y (recto), -y (verso), +z, -z
    const mats = [edgeMat, edgeMat, faceMat(cfg.recto[k]), faceMat(cfg.verso[k], true), edgeMat, edgeMat];
    const pivot = new THREE.Group(); root.add(pivot);
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, th, d), mats);
    mesh.position.x = w / 2; mesh.castShadow = true; mesh.receiveShadow = true;
    pivot.add(mesh);
    // recto anchor: page surface frame while the leaf lies on the right stack
    const recto = new THREE.Group(); recto.position.y = th / 2; pivot.add(recto);
    // verso anchor: flipped so that once the leaf has turned it matches the world frame again
    const verso = new THREE.Group(); verso.position.y = -th / 2; verso.rotation.z = PI; pivot.add(verso);
    const yRight = below(k + 1, N) + th / 2, yLeft = below(0, k) + th / 2;
    leaves.push({ pivot, mesh, recto, verso, yRight, yLeft, angle: 0 });
  }

  // spine: stands only while the book is closed
  const spineH = below(0, N) - g;
  const spine = new THREE.Mesh(new THREE.BoxGeometry(cfg.boardT, 1, cfg.pageD + cfg.boardPad * 2), paperMats(cfg.board, 1, 1)[0]);
  spine.castShadow = true; spine.receiveShadow = true;
  root.add(spine);

  const turnAngle = (k, t) => PI * smooth(seg(t, k + 1 + cfg.turn[0], k + 1 + cfg.turn[1]));

  function update(t) {
    leaves.forEach((L, k) => {
      L.angle = turnAngle(k, t);
      L.pivot.rotation.z = L.angle;
      L.pivot.position.y = lerp(L.yRight, L.yLeft, L.angle / PI);
    });
    const closedFront = 1 - leaves[0].angle / PI, closedBack = leaves[N - 1].angle / PI;
    const closed = Math.max(closedFront, closedBack);
    spine.visible = closed > 0.02;
    spine.scale.y = spineH * closed;
    spine.position.set(-cfg.boardT / 2, (spineH * closed) / 2, 0);
    spine.material = paperMats(closedBack > closedFront ? cfg.backBoard : cfg.board, 1, 1)[0];
  }
  /** Openness of spread s (1..N-1): its left leaf has turned and its right leaf has not. */
  const openness = (s) => Math.min(leaves[s - 1].angle / PI, 1 - leaves[s].angle / PI);
  /** Left and right page frames of spread s. */
  const anchors = (s) => ({ left: leaves[s - 1].verso, right: leaves[s].recto });
  return { leaves, update, openness, anchors };
}

/* ── src/30-cover.js ── */
/* ───────── shared spread helpers ───────── */
/** Base layer: rises with the page opening, each piece starting at its own openness delay d. */
const baseRise = (o, d) => backOut(seg(o, d, Math.min(1, d + 0.45)));
/** Later event inside the spread (u window), collapsing again as soon as the page starts to close. */
const eventRise = (u, a, b, o) => backOut(Math.min(win(u, a, b), seg(o, 0.45, 0.95)));
/** Spring-like settle for springs and spouts: 0 at k = 0, rings a little, then 1. */
const elastic = (k) => (k <= 0 ? 0 : 1 - Math.cos(k * PI * 3.5) * Math.exp(-k * 4.5) * (1 - k * 0.02));
/** Darker tone of a card colour for shutters, backings and shading layers. */
const shade = (c, k = 0.3) => '#' + new THREE.Color(c).lerp(new THREE.Color(COLORS.ink), k).getHexString();
const tint = (c, k = 0.3) => '#' + new THREE.Color(c).lerp(new THREE.Color('#ffffff'), k).getHexString();

/** Wraps a spread builder: pieces hide while the spread is fully closed. */
function makeSpread(book, s, build) {
  const { left, right } = book.anchors(s);
  const groups = [];
  const kit = {
    left, right,
    side: (x) => (x < 0 ? left : right),
    track(g) { groups.push(g); return g; },
  };
  const update = build(kit);
  let shown = true;
  return (t, time) => {
    const o = book.openness(s), vis = o > 0.001;
    if (vis !== shown) { groups.forEach((g) => { g.visible = vis; }); shown = vis; }
    if (vis) update(o, t - s, time);
  };
}

/* ───────── cover: pop-up title standing on the closed book ───────── */
function createCover(book, font) {
  const cfg = CONFIG.cover, bk = CONFIG.book;
  const anchor = book.leaves[0].recto;
  const size = cfg.titleSize, res = font.data.resolution;
  const text = 'POP-UP', colors = [COLORS.sun, COLORS.white, COLORS.sun, COLORS.pink, COLORS.sun, COLORS.white];
  const adv = [...text].map((ch) => (font.data.glyphs[ch].ha / res) * size);
  const total = adv.reduce((a, b) => a + b, 0);
  let x = (bk.pageW + bk.boardPad) / 2 - total / 2;
  const letters = [...text].map((ch, i) => {
    const f = flap(anchor, { x, z: cfg.titleZ, layer: 1 + i });
    const shapes = font.generateShapes(ch, size);
    const face = cut(shapes, colors[i]);
    const backing = cut(shapes, COLORS.ink);
    backing.position.set(size * 0.06, -size * 0.05, -CONFIG.paper.thick * 1.1);
    // a small V-fold wedge behind each letter, like a real pop-up title
    const wedge = cut(rectShape(adv[i] * 0.35, size * 0.55, adv[i] * 0.3, 0), COLORS.white);
    wedge.position.z = -CONFIG.paper.thick * 2.4;
    f.body.add(face, backing, wedge);
    x += adv[i];
    // the wedge opens with the letter and lies flat against it when folded
    return { set(e) { f.set(e); wedge.rotation.y = 0.9 * clamp01(e); } };
  });

  const intro = { k: reduce ? 1 : 0 };
  if (!reduce) gsap.to(intro, { k: 1, duration: cfg.introMs / 1000, ease: 'none', delay: 0.25 });
  const cue = $('#cue');

  return (t) => {
    const fold = 1 - win(t, cfg.fold[0], cfg.fold[1]);
    letters.forEach((f, i) => {
      const n = letters.length, stag = i / n;
      const up = backOut(seg(intro.k, stag * 0.45, stag * 0.45 + 0.55), 2.4);
      const down = seg(fold, stag * 0.3, stag * 0.3 + 0.7);
      f.set(Math.min(up, backOut(down)));
    });
    cue.style.opacity = reduce ? 1 : 1 - win(t, cfg.cueOut[0], cfg.cueOut[1]);
  };
}

/* ───────── back cover: the book shuts, the magnetic button comes in ───────── */
function createBackCover() {
  const cfg = CONFIG.back, fin = $('#fin-copy'), magnet = $('#magnet'), label = magnet.querySelector('span');
  if (!reduce) {
    magnet.addEventListener('pointermove', (e) => {
      const r = magnet.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      gsap.to(magnet, { x: dx * 0.45, y: dy * 0.45, duration: 0.4, ease: 'power3.out' });
      gsap.to(label, { x: dx * 0.2, y: dy * 0.2, duration: 0.4, ease: 'power3.out' });
    });
    magnet.addEventListener('pointerleave', () => gsap.to([magnet, label], { x: 0, y: 0, duration: 0.9, ease: 'elastic.out(1, 0.35)' }));
  }
  return (t) => {
    const k = reduce ? 1 : win(t - 5, cfg.finIn[0], cfg.finIn[1]);
    fin.style.opacity = k;
    fin.style.transform = `translateY(${(1 - k) * 40}px) scale(${0.7 + 0.3 * backOut(k)})`;
    fin.classList.toggle('on', k > 0.5);
  };
}

/* ───────── spread 1: forest. Layered trees fold up, a deer rises on a V-fold, birds flap on pull-tabs ───────── */
const FOREST = {
  pines: [ // back row, lies forward. [x, width, height, colour]
    [-2.7, 0.9, 2.2, COLORS.teal], [-1.95, 1.0, 2.55, COLORS.leaf], [-1.1, 0.85, 2.05, COLORS.teal], [-0.45, 0.7, 1.7, COLORS.leaf],
    [0.55, 0.75, 2.3, COLORS.teal], [1.35, 0.9, 1.9, COLORS.leaf], [2.1, 1.0, 2.6, COLORS.teal], [2.8, 0.66, 2.0, COLORS.leaf],
  ],
  pineZ: -1.2,
  rounds: [ // middle row. [x, canopy radius, trunk height, colour]
    [-2.4, 0.42, 0.75, COLORS.emerald], [-1.5, 0.36, 0.95, COLORS.sun], [-0.65, 0.3, 0.6, COLORS.pink],
    [0.72, 0.34, 0.7, COLORS.orange], [1.75, 0.4, 0.9, COLORS.emerald], [2.65, 0.32, 0.65, COLORS.sun],
  ],
  roundZ: -0.3,
  hillZ: 1.0,
  deer: { x: 1.3, z: 0.45, rise: [0.04, 0.2] },
  birds: [ // stalk x, z, stalk height, colour, facing
    { x: -1.4, z: 0.35, h: 1.9, color: COLORS.pink, face: 1 },
    { x: -0.6, z: 0.7, h: 1.45, color: COLORS.cobalt, face: -1 },
    { x: 2.35, z: 0.6, h: 2.05, color: COLORS.sun, face: -1 },
  ],
  birdRise: [0.18, 0.3], pull: [0.3, 0.74], word: { x: -3.0, z: 1.48 },
};

const DEER_BODY = [[-0.36, 0], [-0.29, 0], [-0.24, 0.42], [-0.18, 0.42], [-0.16, 0], [-0.09, 0], [-0.06, 0.5], [0.28, 0.5], [0.33, 0], [0.4, 0], [0.42, 0.44], [0.47, 0.44],
  [0.5, 0], [0.57, 0], [0.58, 0.6], [0.66, 0.8], [0.62, 0.86], [0.5, 0.84], [-0.18, 0.86], [-0.28, 1.02], [-0.3, 1.18], [-0.2, 1.3], [-0.3, 1.27], [-0.38, 1.24],
  [-0.62, 1.1], [-0.64, 1.03], [-0.42, 1.01], [-0.36, 0.92], [-0.36, 0.62], [-0.3, 0.5]];
const DEER_ANTLER = [[-0.35, 1.22], [-0.32, 1.46], [-0.44, 1.58], [-0.4, 1.62], [-0.29, 1.52], [-0.24, 1.7], [-0.19, 1.68], [-0.25, 1.48], [-0.12, 1.53], [-0.11, 1.48], [-0.26, 1.4], [-0.29, 1.22]];
const BIRD_BODY = [[-0.2, 0.02], [0.08, -0.02], [0.2, 0.04], [0.28, 0.1], [0.22, 0.14], [0.12, 0.12], [-0.06, 0.14], [-0.22, 0.16], [-0.32, 0.24], [-0.28, 0.1]];
const BIRD_WING = [[-0.1, 0], [0.1, 0], [0.02, 0.32], [-0.08, 0.26]];

function createForest(book, font) {
  return makeSpread(book, 1, (kit) => {
    const F = FOREST, pieces = [];
    const add = (piece, rule) => { kit.track(piece.hinge ?? piece.group); pieces.push({ piece, rule }); return piece; };

    // front hills per page, highest layer so they lie on top when folded
    [[-1.62, -3.1, -0.08], [1.62, 0.08, 3.1]].forEach(([, x0, x1], i) => {
      const f = add(flap(kit.side(x0), { z: F.hillZ, dir: -1, layer: 8 }), { d: 0 });
      f.body.add(cut(waveShape(x0, x1, 0.34, 0.08, 2.5, i * 1.7), COLORS.leaf));
      f.body.add(glue(waveShape(x0 + 0.05, x1 - 0.05, 0.18, 0.05, 3.5, i * 2.1 + 1), COLORS.emerald));
    });
    F.rounds.forEach(([x, r, th, color], i) => {
      const f = add(flap(kit.side(x), { x, z: F.roundZ, dir: -1, layer: 5 + (i % 2) }), { d: 0.08 + (i % 3) * 0.05 });
      f.body.add(cut(rectShape(0.1, th + r * 0.5), COLORS.teal));
      const crown = cut(circleShape(r, 0, th + r * 0.7), color);
      crown.position.z = 0.004; f.body.add(crown);
      const inner = cut(circleShape(r * 0.62, r * 0.12, th + r * 0.58), shade(color, 0.16)); inner.position.z = 0.004 + CONFIG.paper.thick; f.body.add(inner);
    });
    F.pines.forEach(([x, w, h, color], i) => {
      const f = add(flap(kit.side(x), { x, z: F.pineZ, dir: -1, layer: i % 3 }), { d: 0.2 + (i % 4) * 0.07 });
      f.body.add(cut(pineShape(w, h, 4 + (i % 2)), color));
    });

    // deer on a V-fold, rises after the page has settled
    const deer = add(vfold(kit.right, { x: F.deer.x, z: F.deer.z, w: 0.34, h: 0.8, layer: 10 }), { ev: F.deer.rise });
    deer.body.add(cut(polyShape(DEER_BODY), COLORS.tomato));
    const antler = cut(polyShape(DEER_ANTLER), COLORS.sun); antler.position.z = -0.006; deer.body.add(antler);
    const antler2 = cut(polyShape(DEER_ANTLER.map(([px, py]) => [px + 0.12, py])), shade(COLORS.sun, 0.15)); antler2.position.z = -0.012; deer.body.add(antler2);
    [[0.1, 0.72], [0.28, 0.68], [0.2, 0.6], [0.02, 0.62], [0.38, 0.76]].forEach(([dx, dy]) => deer.body.add(glue(circleShape(0.03, dx, dy), COLORS.white)));
    deer.body.add(glue(circleShape(0.028, -0.47, 1.12), COLORS.ink));

    // birds on stalks, driven by pull-tabs sticking out of the front edge
    const birds = F.birds.map((b, i) => {
      const f = add(flap(kit.side(b.x), { x: b.x, z: b.z, dir: 1, layer: 12 }), { ev: [F.birdRise[0] + i * 0.03, F.birdRise[1] + i * 0.03] });
      const sway = new THREE.Group(); f.body.add(sway);
      sway.add(cut(rectShape(0.035, b.h), COLORS.white));
      const bird = new THREE.Group(); bird.position.y = b.h; bird.scale.x = b.face; sway.add(bird);
      bird.add(cut(polyShape(BIRD_BODY), b.color));
      bird.add(glue(circleShape(0.018, 0.17, 0.08), COLORS.ink));
      const beak = cut(polyShape([[0.27, 0.08], [0.36, 0.1], [0.27, 0.12]]), COLORS.orange); bird.add(beak);
      const wings = [1, -1].map((s) => {
        const hg = new THREE.Group(); hg.position.set(0, 0.13, 0); bird.add(hg);
        hg.add(cut(polyShape(BIRD_WING), s > 0 ? tint(b.color, 0.35) : shade(b.color, 0.25)));
        return { hg, s };
      });
      // pull tab: lies on the page and slides out past the front edge
      const tabRoot = kit.side(b.x);
      const tab = new THREE.Group(); tab.position.set(b.x, lift(2), CONFIG.book.pageD / 2 - 0.5); tab.rotation.x = -HALF_PI; tabRoot.add(tab);
      tab.add(cut(roundRectShape(0.28, 0.72, 0.1, -0.14, -0.72), COLORS.tomato));
      tab.add(glue(circleShape(0.06, 0, -0.62), COLORS.white));
      kit.track(tab);
      return { f, sway, wings, tab, i };
    });
    kit.track(flatWord(kit.left, font, 'FOREST', { x: F.word.x, z: F.word.z, size: 0.26, color: COLORS.tomato, layer: 3 }));

    return (o, u, time) => {
      for (const { piece, rule } of pieces) piece.set(rule.ev ? eventRise(u, rule.ev[0], rule.ev[1], o) : baseRise(o, rule.d));
      const live = reduce ? 0 : time;
      const gate = seg(o, 0.5, 1);
      birds.forEach(({ sway, wings, tab, i }) => {
        const p = seg(u, F.pull[0] + i * 0.02, F.pull[1]);
        const pull = (0.5 - 0.5 * Math.cos(p * PI * 4)) * gate; // out and back twice
        tab.position.z = CONFIG.book.pageD / 2 - 0.5 + pull * 0.42 + 0.14 * gate;
        sway.rotation.z = (pull - 0.3) * 0.35 * (i % 2 ? -1 : 1) + Math.sin(live * 0.9 + i) * 0.03;
        const beat = 0.25 + 0.75 * pull + 0.15;
        const a = 0.35 + Math.sin(live * (6 + i) + i * 1.3) * 0.75 * beat;
        wings.forEach(({ hg, s }) => { hg.rotation.x = s * a; });
      });
    };
  });
}

/* ───────── spread 2: city. Parallel-fold buildings, windows that swing open, a bus on a pull-tab track ───────── */
const CITY = {

    [-2.6, 0.7, 2.0, COLORS.cobalt], [-1.75, 0.75, 2.3, COLORS.teal], [-0.85, 0.6, 1.75, COLORS.pink],

function createCity(book, font) {
  return makeSpread(book, 2, (kit) => {
    const C = CITY, pieces = [], shutters = [], rnd = mulberry32(21);
    const add = (piece, rule) => { kit.track(piece.hinge ?? piece.group); pieces.push({ piece, rule }); return piece; };
    const W = C.window, t = CONFIG.paper.thick;

    function building(x, w, h, color, z, d, layer, delay) {
      const b = add(box(kit.side(x), { x, z, dir: -1, layer, w, h, d, color, side: shade(color, 0.22), roof: shade(color, 0.4) }), { d: delay });
      const cols = Math.max(1, Math.floor((w - 0.1) / W.gapX)), rows = Math.max(1, Math.floor((h - W.top - W.bottom) / W.gapY));
      const x0 = -((cols - 1) * W.gapX) / 2, lights = [];
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const wx = x0 + c * W.gapX - W.w / 2, wy = W.bottom + r * W.gapY;
        lights.push(rectShape(W.w, W.h, wx, wy));
        const hg = new THREE.Group(); hg.position.set(wx, wy, t / 2 + 0.005); b.body.add(hg);
        const sh = cut(rectShape(W.w, W.h, 0, 0), shade(color, 0.35), 0.006);
        sh.castShadow = false; hg.add(sh);
        shutters.push({ hg, at: rnd() });
      }
      b.body.add(glue(lights, color === COLORS.white ? COLORS.sun : COLORS.white));
      b.body.add(glue(rectShape(0.16, 0.24, -0.08, 0), COLORS.ink));
      return b;
    }
    // sun on a stalk behind the skyline
    const sun = add(flap(kit.side(C.sun.x), { x: C.sun.x, z: C.sun.z, dir: -1, layer: 0 }), { d: 0.3 });
    sun.body.add(cut(rectShape(0.035, C.sun.h - C.sun.r), COLORS.white));
    sun.body.add(cut(circleShape(C.sun.r, 0, C.sun.h - C.sun.r), COLORS.pink));
    sun.body.add(glue(circleShape(C.sun.r * 0.62, 0, C.sun.h - C.sun.r), COLORS.tomato));
    C.back.list.forEach(([x, w, h, color], i) => building(x, w, h, color, C.back.z, C.back.d, 1 + (i % 2), 0.18 + (i % 3) * 0.06));
    C.front.list.forEach(([x, w, h, color], i) => building(x, w, h, color, C.front.z, C.front.d, 4 + (i % 2), 0.02 + (i % 2) * 0.06));
    C.lollies.forEach(([x, z, h, color], i) => {
      const f = add(flap(kit.left, { x, z, dir: -1, layer: 7 }), { d: 0.1 + i * 0.05 });
      f.body.add(cut(rectShape(0.04, h), COLORS.teal));
      f.body.add(cut(circleShape(0.16, 0, h), color));
    });

    // road, slot and the bus
    const R = C.road, road = new THREE.Group(); road.position.set(0, lift(1), R.z); road.rotation.x = -HALF_PI; kit.right.add(road); kit.track(road);
    road.add(cut(rectShape(R.x1 - R.x0, R.w, R.x0, -R.w / 2), COLORS.ink));
    road.add(glue(rectShape(R.x1 - R.x0 - 0.2, 0.03, R.x0 + 0.1, -0.015), '#050a2a'));
    for (let x = R.x0 + 0.1; x < R.x1 - 0.2; x += 0.34) road.add(glue(rectShape(0.16, 0.025, x, R.w / 2 - 0.07), COLORS.white));
    const bus = add(flap(kit.right, { x: C.bus.x[0], z: R.z, dir: 1, layer: 6 }), { ev: C.bus.rise });
    bus.body.add(cut(roundRectShape(1.0, 0.5, 0.1, -0.5, 0.07), COLORS.tomato));
    bus.body.add(glue(roundRectShape(0.82, 0.16, 0.04, -0.44, 0.33), COLORS.white));
    for (let k = 1; k < 5; k++) bus.body.add(glue(rectShape(0.025, 0.16, -0.44 + k * 0.164, 0.33), COLORS.tomato, t / 2 + 0.003));
    bus.body.add(glue(rectShape(0.9, 0.04, -0.45, 0.22), COLORS.sun));
    bus.body.add(glue(circleShape(0.035, -0.46, 0.17), COLORS.sun));
    const wheels = [-0.3, 0.3].map((wx) => {
      const wg = new THREE.Group(); wg.position.set(wx, 0.1, t); bus.body.add(wg);
      wg.add(cut(circleShape(0.1, 0, 0), COLORS.ink));
      wg.add(glue(rectShape(0.13, 0.03, -0.065, -0.015), COLORS.white));
      return wg;
    });
    const tab = new THREE.Group(); tab.position.set(R.x1 - 0.55, lift(3), R.z); tab.rotation.x = -HALF_PI; kit.right.add(tab); kit.track(tab);
    tab.add(cut(roundRectShape(0.8, 0.26, 0.1, 0, -0.13), COLORS.pink));
    tab.add(glue(circleShape(0.055, 0.68, 0), COLORS.white));
    kit.track(flatWord(kit.left, font, 'CITY', { x: C.word.x, z: C.word.z, size: 0.3, color: COLORS.cobalt, layer: 3 }));

    return (o, u, time) => {
      for (const { piece, rule } of pieces) piece.set(rule.ev ? eventRise(u, rule.ev[0], rule.ev[1], o) : baseRise(o, rule.d));
      const gate = seg(o, 0.5, 1);
      const [w0, w1] = C.windows;
      shutters.forEach(({ hg, at }) => {
        const a = lerp(w0, w1 - 0.08, at);
        hg.rotation.y = -W.open * backOut(Math.min(win(u, a, a + 0.08), gate));
      });
      const go = win(u, C.bus.go[0], C.bus.go[1]) - win(u, C.bus.back[0], C.bus.back[1]);
      const bx = lerp(C.bus.x[0], C.bus.x[1], go * gate);
      bus.hinge.position.x = bx;
      wheels.forEach((wg) => { wg.rotation.z = -(bx - C.bus.x[0]) / 0.1; });
      tab.position.x = R.x1 - 0.55 + (0.1 + go * 0.5) * gate;
      if (!reduce) bus.body.position.y = Math.abs(Math.sin(time * 9)) * 0.012 * (go > 0.02 && go < 0.98 ? 1 : 0);
    };
  });
}

/* ── src/60-ocean.js ── */
/* ───────── spread 3: ocean. Stacked wave strips rock, a whale rises through a slot, boats bob ───────── */
const OCEAN = {
  rows: [ // z, height, colour. back to front, all lie forward
    [-1.2, 1.25, COLORS.navy], [-0.6, 1.02, COLORS.teal], [0.0, 0.84, COLORS.cobalt], [0.6, 0.62, COLORS.aqua], [1.18, 0.4, COLORS.navy],
  ],
  amp: 0.12, waves: 3.2, rock: 0.075, rockSpeed: 1.25,
  whale: { x: 0.2, z: -0.3, scale: 1.3, rise: [0.08, 0.3], sink: 1.2, leap: 0.55, spout: [0.34, 0.44] },
  boats: [ // row index, side (-1 left, 1 right), x, hull colour, sail colour
    [2, -1, -1.9, COLORS.tomato, COLORS.white], [3, 1, 2.1, COLORS.sun, COLORS.pink], [4, -1, -0.9, COLORS.pink, COLORS.sun], [1, 1, 1.4, COLORS.white, COLORS.tomato],
  ],
  boatRise: [0.36, 0.52],
  clouds: [[-2.1, -1.45, 2.25, 0.9], [1.25, -1.45, 2.5, 1.0]],
  sun: { x: 2.65, z: -1.5, h: 2.7, r: 0.3 },
  word: { x: -3.0, z: 1.52 },
};
const WHALE = [[-1.0, 0.35], [-0.95, 0.55], [-0.7, 0.75], [-0.2, 0.82], [0.3, 0.7], [0.65, 0.5], [0.8, 0.52], [0.95, 0.8], [1.05, 0.78], [0.98, 0.5],
  [1.12, 0.3], [1.02, 0.26], [0.85, 0.38], [0.6, 0.25], [0.2, 0.08], [-0.4, 0.02], [-0.8, 0.12]];
const WHALE_BELLY = [[-0.95, 0.3], [-0.8, 0.13], [-0.4, 0.03], [0.2, 0.09], [0.5, 0.2], [0.2, 0.22], [-0.4, 0.22], [-0.8, 0.3]];

/** Wave crest height: sharp peaks, round troughs, like cut theatre waves. */
function crestY(x, x0, x1, h, amp, waves, phase) {
  const s = ((x - x0) / (x1 - x0)) * waves + phase / (PI * 2);
  return h - amp + 2 * amp * Math.pow(1 - Math.abs(Math.sin(PI * s)), 1.6);
}
const CREST_STEPS = 120;
function crestShape(x0, x1, h, amp, waves, phase) {
  const pts = [[x0, 0], [x1, 0]];
  for (let i = CREST_STEPS; i >= 0; i--) { const x = lerp(x0, x1, i / CREST_STEPS); pts.push([x, crestY(x, x0, x1, h, amp, waves, phase)]); }
  return polyShape(pts);
}
/** Foam band: the top edge of a wave strip, a finger wide. */
function foamShape(x0, x1, h, amp, waves, phase, band) {
  const pts = [];
  for (let i = 0; i <= CREST_STEPS; i++) { const x = lerp(x0, x1, i / CREST_STEPS); pts.push([x, crestY(x, x0, x1, h, amp, waves, phase) - band]); }
  for (let i = CREST_STEPS; i >= 0; i--) { const x = lerp(x0, x1, i / CREST_STEPS); pts.push([x, crestY(x, x0, x1, h, amp, waves, phase) + 0.001]); }
  return polyShape(pts);
}

function createOcean(book, font) {
  return makeSpread(book, 3, (kit) => {
    const O = OCEAN, pieces = [], rows = [];
    const add = (piece, rule) => { kit.track(piece.hinge ?? piece.group); pieces.push({ piece, rule }); return piece; };
    const t = CONFIG.paper.thick;

    const sun = add(flap(kit.side(O.sun.x), { x: O.sun.x, z: O.sun.z, dir: -1, layer: 0 }), { d: 0.35 });
    sun.body.add(cut(rectShape(0.035, O.sun.h - O.sun.r), COLORS.white));
    sun.body.add(cut(circleShape(O.sun.r, 0, O.sun.h - O.sun.r), COLORS.sun));
    O.clouds.forEach(([x, z, h, w], i) => {
      const f = add(flap(kit.side(x), { x, z, dir: -1, layer: 1 }), { d: 0.3 + i * 0.06 });
      f.body.add(cut(rectShape(0.035, h - 0.1), COLORS.white));
      f.body.add(cut(cloudShape(w, w * 0.5), COLORS.white));
      f.body.children[1].position.y = h - 0.15;
    });
    O.rows.forEach(([z, h, color], r) => {
      [[-3.1, -0.06], [0.06, 3.1]].forEach(([x0, x1], side) => {
        const f = add(flap(side ? kit.right : kit.left, { z, dir: -1, layer: 2 + r }), { d: 0.25 - r * 0.05 });
        const phase = r * 1.3 + side * PI * 0.5;
        f.body.add(cut(crestShape(x0, x1, h, O.amp, O.waves, phase), color));
        f.body.add(glue(foamShape(x0, x1, h, O.amp, O.waves, phase, 0.05), COLORS.white));
        rows.push({ f, r, side, h, x0, x1, phase });
      });
    });

    // whale: V-fold support plus a slot, so it climbs out of the sea as it stands
    const whale = add(vfold(kit.right, { x: O.whale.x, z: O.whale.z, w: 0.5, h: 0.6, layer: 9 }), { ev: O.whale.rise });
    const wBody = new THREE.Group(); wBody.scale.setScalar(O.whale.scale); whale.body.add(wBody);
    wBody.add(cut(polyShape(WHALE), COLORS.pink));
    wBody.add(glue(polyShape(WHALE_BELLY), COLORS.white));
    for (let k = 0; k < 5; k++) wBody.add(glue(rectShape(0.3, 0.012, -0.72 + k * 0.1, 0.12 + k * 0.012), shade(COLORS.pink, 0.2), t / 2 + 0.003));
    wBody.add(glue(circleShape(0.035, -0.68, 0.5), COLORS.ink));
    const spout = new THREE.Group(); spout.position.set(-0.55, 0.78, 0.004); wBody.add(spout);
    [[-0.14, 0.26, 0.3], [0, 0.34, 0], [0.14, 0.26, -0.3]].forEach(([sx, sy, rot]) => {
      const drop = cut(polyShape([[-0.03, 0], [0.03, 0], [0.06, sy * 0.8], [0, sy], [-0.06, sy * 0.8]]), COLORS.white);
      drop.rotation.z = rot; drop.position.x = sx * 0.2; spout.add(drop);
    });

    // boats ride on their wave strip
    const boats = O.boats.map(([row, side, x, hull, sail], i) => {
      const host = rows.find((w) => w.r === row && w.side === (side > 0 ? 1 : 0));
      const y = crestY(x, host.x0, host.x1, host.h, O.amp, O.waves, host.phase) - 0.08;
      const g = new THREE.Group(); g.position.set(x, y, t * 2.2); host.f.body.add(g);
      const inner = new THREE.Group(); g.add(inner);
      inner.add(cut(polyShape([[-0.3, 0.1], [0.3, 0.1], [0.2, -0.04], [-0.22, -0.04]]), hull));
      inner.add(cut(rectShape(0.025, 0.46, -0.0125, 0.1), COLORS.ink));
      inner.add(cut(polyShape([[0.03, 0.18], [0.26, 0.2], [0.03, 0.54]]), sail));
      inner.add(cut(polyShape([[-0.03, 0.2], [-0.2, 0.2], [-0.03, 0.44]]), tint(sail, 0.2)));
      return { g, inner, i };
    });
    kit.track(flatWord(kit.left, font, 'OCEAN', { x: O.word.x, z: O.word.z, size: 0.26, color: COLORS.pink, layer: 3 }));

    return (o, u, time) => {
      for (const { piece, rule } of pieces) piece.set(rule.ev ? eventRise(u, rule.ev[0], rule.ev[1], o) : baseRise(o, rule.d));
      const live = reduce ? 0 : time, gate = seg(o, 0.5, 1);
      rows.forEach(({ f, r, side }) => { f.hinge.rotation.x += Math.sin(live * O.rockSpeed + r * 0.9 + side * 0.5) * O.rock * gate; });
      // whale climbs out of its slot as it stands, then breathes
      const up = Math.min(win(u, O.whale.rise[0], O.whale.rise[1] + 0.06), gate);
      wBody.position.y = lerp(-O.whale.sink, O.whale.leap, up) + Math.sin(live * 0.8) * 0.04 * up;
      wBody.rotation.z = Math.sin(live * 0.6) * 0.03 * up;
      const sp = win(u, O.whale.spout[0], O.whale.spout[1]) * gate;
      const puff = 1 + Math.sin(live * 2.6) * 0.1;
      spout.scale.set(elastic(sp) * puff, elastic(sp) * (2 - puff), 1);
      spout.visible = sp > 0.01;
      const bob = win(u, O.boatRise[0], O.boatRise[1]) * gate;
      boats.forEach(({ g, inner, i }) => {
        g.scale.setScalar(Math.max(0.001, elastic(seg(bob, i * 0.12, 0.6 + i * 0.12))));
        inner.rotation.z = Math.sin(live * 1.7 + i * 1.9) * 0.14;
        inner.position.y = Math.sin(live * 1.7 + i * 1.9 + 1) * 0.03;
      });
    };
  });
}

/* ───────── spread 4: space. A rocket pops out of a slot, planets bounce on paper springs, stars swing on threads ───────── */
const SPACE = {
  frame: { z: -1.35, w: 2.9, h: 2.55, bar: 0.24, post: 0.2, color: COLORS.navy },
  stars: [ // per frame: x offset from frame centre, thread length, size, colour, shape
    [-1.05, 0.55, 0.16, COLORS.sun, 'star'], [-0.55, 1.05, 0.13, COLORS.white, 'star'], [-0.05, 0.4, 0.2, COLORS.sun, 'moon'],
    [0.45, 0.85, 0.14, COLORS.pink, 'star'], [0.95, 0.6, 0.17, COLORS.white, 'star'],
  ],
  rocket: { x: -1.05, z: -0.15, rise: [0.06, 0.24], sink: 1.3 },
  planets: [ // x, z, radius, colours, ring colour, spring segments
    [1.0, 0.55, 0.3, [COLORS.sun, COLORS.orange], COLORS.pink, 9],
    [2.2, -0.2, 0.22, [COLORS.emerald, COLORS.teal], null, 11],
    [2.65, 0.95, 0.17, [COLORS.tomato, COLORS.pink], null, 7],
    [-2.45, 0.85, 0.2, [COLORS.pink, COLORS.white], COLORS.sun, 8],
  ],
  springs: [0.3, 0.5], swing: [0.14, 0.26],
  confetti: 22, word: { x: -1.2, z: 1.5 },
};
const ROCKET_BODY = [[-0.24, 0.35], [0.24, 0.35], [0.26, 1.2], [0.2, 1.5], [0.08, 1.72], [0, 1.78], [-0.08, 1.72], [-0.2, 1.5], [-0.26, 1.2]];
const ROCKET_NOSE = [[-0.21, 1.46], [0.21, 1.46], [0.08, 1.72], [0, 1.78], [-0.08, 1.72]];

function moonShape(r) {
  const s = new THREE.Shape(); s.absarc(0, -r, r, HALF_PI * 0.2, PI * 2 - HALF_PI * 0.2, false);
  s.absarc(r * 0.45, -r, r * 0.78, PI * 2 - HALF_PI * 0.45, HALF_PI * 0.45, true);
  return s;
}

function createSpace(book, font) {
  return makeSpread(book, 4, (kit) => {
    const S = SPACE, pieces = [], hangers = [], rnd = mulberry32(44);
    const add = (piece, rule) => { kit.track(piece.hinge ?? piece.group); pieces.push({ piece, rule }); return piece; };
    const t = CONFIG.paper.thick, F = S.frame;

    // printed confetti stars glued flat on both cobalt pages
    for (let i = 0; i < S.confetti; i++) {
      const side = i % 2 ? 1 : -1, x = side * (0.25 + rnd() * 2.75), z = -1.45 + rnd() * 2.8;
      const st = glue(starShape(0.07 + rnd() * 0.06, 0.03 + rnd() * 0.02), [COLORS.sun, COLORS.white, COLORS.pink][i % 3], lift(0));
      st.rotation.set(-HALF_PI, 0, rnd() * PI); st.position.set(x, lift(0), z);
      kit.side(x).add(st); kit.track(st);
    }
    // proscenium frames with stars and moons on threads
    [-1.6, 1.6].forEach((cx, fi) => {
      const f = add(flap(kit.side(cx), { x: cx, z: F.z, dir: -1, layer: 0 }), { d: 0.3 + fi * 0.06 });
      // one piece: two posts, a top bar and a low sill
      const s = rectShape(F.w, F.h), hole = new THREE.Path(), sill = 0.12;
      hole.moveTo(-F.w / 2 + F.post, sill); hole.lineTo(F.w / 2 - F.post, sill); hole.lineTo(F.w / 2 - F.post, F.h - F.bar); hole.lineTo(-F.w / 2 + F.post, F.h - F.bar); hole.closePath();
      s.holes.push(hole);
      f.body.add(cut(s, F.color));
      for (let k = 0; k < 7; k++) f.body.add(glue(starShape(0.045, 0.02), COLORS.sun, t / 2 + 0.002).translateX(-F.w / 2 + 0.25 + k * 0.4).translateY(F.h - F.bar / 2));
      S.stars.forEach(([ox, len, size, color, kind], i) => {
        const piv = new THREE.Group(); piv.position.set(ox * (fi ? -1 : 1), F.h - F.bar, t * 2); f.body.add(piv);
        piv.add(thread(len));
        const orn = new THREE.Group(); orn.position.y = -len - size; piv.add(orn);
        orn.add(cut(kind === 'moon' ? moonShape(size * 1.3) : starShape(size, size * 0.45), color));
        if (kind === 'moon') orn.children[0].position.y = size * 1.3;
        hangers.push({ piv, orn, i: i + fi * 5 });
      });
    });

    // rocket through a slot, flame flickers
    const rocket = add(vfold(kit.left, { x: S.rocket.x, z: S.rocket.z, w: 0.3, h: 0.7, layer: 6, color: COLORS.cobalt }), { ev: S.rocket.rise });
    const rBody = new THREE.Group(); rocket.body.add(rBody);
    rBody.add(cut(polyShape(ROCKET_BODY), COLORS.white));
    const nose = cut(polyShape(ROCKET_NOSE), COLORS.tomato); nose.position.z = t; rBody.add(nose);
    [-1, 1].forEach((s) => rBody.add(cut(polyShape([[0.2 * s, 0.35], [0.46 * s, 0.22], [0.44 * s, 0.6], [0.24 * s, 0.8]]), COLORS.tomato)));
    rBody.add(cut(ringShape(0.13, 0.09), COLORS.tomato).translateY(1.08).translateZ(t));
    rBody.add(glue(circleShape(0.09, 0, 1.08), COLORS.cobalt, t * 1.2));
    rBody.add(glue(rectShape(0.3, 0.05, -0.15, 0.62), COLORS.tomato));
    const flame = new THREE.Group(); flame.position.y = 0.36; rBody.add(flame);
    flame.add(cut(polyShape([[-0.18, 0], [0.18, 0], [0.1, -0.3], [0, -0.52], [-0.1, -0.3]]), COLORS.orange));
    const core = cut(polyShape([[-0.1, 0], [0.1, 0], [0.05, -0.2], [0, -0.32], [-0.05, -0.2]]), COLORS.sun); core.position.z = t; flame.add(core);

    // planets on accordion springs
    const planets = S.planets.map(([x, z, r, colors, ring, segs], i) => {
      const sp = spring(kit.side(x), { x, z, segs, colors: [COLORS.white, i % 2 ? COLORS.sun : COLORS.pink] });
      kit.track(sp.group);
      const pl = paperPlanet(r, colors, ring); pl.position.y = r * 0.9; sp.top.add(pl);
      return { sp, pl, i };
    });
    kit.track(flatWord(kit.right, font, 'SPACE', { x: S.word.x + 1.5, z: S.word.z, size: 0.26, color: COLORS.sun, layer: 3 }));

    return (o, u, time) => {
      for (const { piece, rule } of pieces) piece.set(rule.ev ? eventRise(u, rule.ev[0], rule.ev[1], o) : baseRise(o, rule.d));
      const live = reduce ? 0 : time, gate = seg(o, 0.5, 1);
      const up = Math.min(win(u, S.rocket.rise[0], S.rocket.rise[1] + 0.08), gate);
      rBody.position.y = -S.rocket.sink * (1 - backOut(up, 1.2)) + Math.sin(live * 1.4) * 0.05 * up;
      flame.scale.set(1 + Math.sin(live * 23) * 0.08, (0.8 + Math.sin(live * 17) * 0.25) * up, 1);
      const swing = win(u, S.swing[0], S.swing[1]) * gate;
      hangers.forEach(({ piv, orn, i }) => {
        piv.rotation.z = Math.sin(live * (0.9 + (i % 4) * 0.12) + i) * 0.16 * swing + (1 - swing) * 0.5 * (i % 2 ? 1 : -1);
        orn.rotation.y = Math.sin(live * 0.7 + i * 1.3) * 0.9;
        piv.visible = swing > 0.01;
      });
      planets.forEach(({ sp, pl, i }) => {
        const k = win(u, S.springs[0] + i * 0.035, S.springs[1] + i * 0.035);
        const ext = Math.min(elastic(k), gate * 1.1) + Math.sin(live * 2.2 + i * 1.7) * 0.045 * k;
        sp.set(ext);
        pl.visible = ext > 0.02;
        pl.rotation.y = live * 0.45 + i;
      });
    };
  });
}

/* ── src/90-boot.js ── */
/* ───────── boot ───────── */
function loadFont() {
  return new Promise((resolve, reject) => new FontLoader().load(CONFIG.fontUrl, resolve, undefined,
    (e) => reject(new Error(`font failed to load: ${e?.message ?? e}`))));
}

const stage = createStage($('#gl'));
const place = createCameraRig(stage.camera);
paperKit.grain = makeGrain();

Promise.all([loadFont(), loadImage('cover'), loadImage('back')]).then(([font, cover, back]) => {
  const book = createBook(stage.scene, { cover, back });
  const updaters = [
    createCover(book, font),
    createForest(book, font),
    createCity(book, font),
    createOcean(book, font),
    createSpace(book, font),
    createBackCover(),
  ];
  timeline.measure();

  let lastT = -1, lastW = 0;
  function frame(time) {
    const t = timeline.now();
    // reduced motion draws only when the snapped spread or the viewport changes
    if (reduce && t === lastT && innerWidth === lastW) return;
    lastT = t; lastW = innerWidth;
    const clock = reduce ? 0 : time;
    book.update(t);
    updaters.forEach((u) => u(t, clock));
    stage.setBackdrop(t);
    stage.setFog(place(t, clock));
    stage.renderer.render(stage.scene, stage.camera);
  }
  gsap.ticker.add((time) => { if (!document.hidden) frame(time); });
  addEventListener('resize', () => { lastT = -1; });
}).catch((e) => console.error('POP-UP failed to start', e));
