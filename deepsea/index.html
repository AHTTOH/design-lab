      angler.rotation.y = Math.sin(time * 0.4) * 0.08;
      // The body waits far back in the dark while the lure leads, then swims up behind it for the reveal.
      const arrive = smooth(seg(p, m.reveal[0] - 0.04, m.reveal[0] + 0.1));
      body.position.z = m.angler.at[2] - m.hideBack * (1 - arrive);
      stalk.visible = arrive > 0.98;
      angler.updateMatrixWorld(true);
      lureLight.intensity = m.lureLight * (0.85 + 0.15 * Math.sin(time * 3.1));
      // Camera trails the lure, then closes in during the reveal.
      const close = smooth(seg(p, m.reveal[0], m.reveal[1]));
      const gap = lerp(m.lureAhead, 3.1, close);
      const cx = lerp(Lb.x, L.x, 0.6), cy = lerp(Lb.y, L.y, 0.6) + lerp(0.5, 0.25, close);
      const cz = L.z + gap;
      const yaw = Math.atan2(-(L.x - cx), -(L.z - cz)) * 0.8;
      const pitch = Math.atan2(L.y - cy - close * 0.6, Math.abs(L.z - cz)) * 0.7;
      aim(camera, [cx, cy, cz], yaw, pitch);
      camera.updateMatrixWorld();
      dome.position.copy(camera.position);

      // Where the beam points: pointer when steered recently, otherwise a slow wander; the reveal pulls it to the face.
      const idle = reduce || coarse || !pointer.has || performance.now() - pointer.lastMove > m.flash.idleMs;
      const wander = [Math.sin(time * 0.37) * 0.5 + Math.sin(time * 0.91) * 0.12, Math.cos(time * 0.29) * 0.32];
      aimNdc.set(idle ? wander[0] : pointer.nx, idle ? wander[1] : pointer.ny);
      fishNdc.copy(anglerFocus).applyMatrix4(angler.matrixWorld).project(camera);
      const pull = smooth(seg(p, m.reveal[0] + 0.04, m.reveal[1] - 0.02)) * (idle ? 1 : 0.7);
      ndc.set(lerp(aimNdc.x, fishNdc.x, pull), lerp(aimNdc.y, fishNdc.y, pull));
      ray.setFromCamera(ndc, camera);
      flash.position.copy(camera.position);
      flash.intensity = m.flash.intensity * lerp(1, m.flash.closeK, close);
      flash.target.position.copy(ray.ray.origin).addScaledVector(ray.ray.direction, 12);
      flash.target.updateMatrixWorld();
      state.flashScreen.set(ndc.x * 0.5 + 0.5, ndc.y * 0.5 + 0.5, 1);

      glowMat.uniforms.uTime.value = time; glowMat.uniforms.uVel.value = vel.k;
      const su = snow.material.uniforms;
      su.uCam.value.copy(camera.position); su.uTime.value = time; su.uVel.value = vel.k;
      su.uFlashDir.value.copy(ray.ray.direction); su.uFlashK.value = 1;
    },
    render(renderer) { renderer.render(scene, camera); },
  };
}

/* ── src/60-abyss.js ── */
/* ───────── zone 5: the abyss ───────── */
// A trench floor with hydrothermal chimneys. Their mouths glow, plumes rise and the final pass bends the water above
// them (heat shimmer). A giant whale silhouette crosses in front of the glow, then everything dims around one comb
// jelly whose rows of cilia run with travelling rainbow light.

function trenchFloor(x, z) {
  const wall = Math.max(0, Math.abs(x) - CONFIG.abyss.wallFrom);
  return (fbm2(x * 0.12, z * 0.12) - 0.5) * 2.4 + wall * wall * 0.05 + fbm2(x * 0.4 + 7, z * 0.4) * wall * 0.8;
}

const ROCK_FRAG = `${GLSL_NOISE}
  uniform vec3 uVentColor, uHot; uniform vec4 uVents[5]; uniform float uTime, uGlowK;
  varying vec3 vWorld, vNormal;
  void main() {
    vec3 n = normalize(vNormal);
    vec3 base = vec3(.05, .05, .08) * (.6 + fbm(vWorld.xz * .8) * .8);
    vec3 c = base * (.25 + max(n.y, 0.) * .3);
    // Glow from each vent mouth, with a flicker. Near the vents, mineral veins in the rock glow too.
    float near = 0.;
    for (int i = 0; i < 5; i++) {
      vec3 d = vWorld - uVents[i].xyz;
      float r2 = dot(d, d);
      float fl = .8 + .2 * sin(uTime * 7. + float(i) * 2.1) * sin(uTime * 3.1 + float(i));
      c += uVentColor * uVents[i].w * fl * .7 / (1. + r2 * 1.1) * (.4 + .6 * max(dot(n, -normalize(d)), 0.));
      c += uHot * uVents[i].w * fl * 1.2 * exp(-r2 * 4.);
      near += uVents[i].w * exp(-r2 * .07);
    }
    vec2 vp = vWorld.xz * 1.1 + vec2(vWorld.y * .9, -vWorld.y * .6);
    float vein = 1. - smoothstep(0., .07, cellEdge(vp, uTime * .15));
    float pulse = .6 + .4 * sin(uTime * 1.3 + vWorld.y * 1.7 + vWorld.x);
    c += uVentColor * vein * pulse * near * .9 + uVentColor * vein * .02 * uGlowK;
    float dist = length(vWorld - cameraPosition);
    c = mix(c, vec3(.02, .012, .07), 1. - exp(-dist * .03));
    gl_FragColor = vec4(c, 1.);
  }`;
const ROCK_VERT = `varying vec3 vWorld, vNormal;
  void main() { mat4 im = mat4(1.);
    #ifdef USE_INSTANCING
      im = instanceMatrix;
    #endif
    vec4 w = modelMatrix * im * vec4(position, 1.); vWorld = w.xyz; vNormal = normalize(mat3(modelMatrix * im) * normal);
    gl_Position = projectionMatrix * viewMatrix * w; }`;

function chimneyGeometry(h, seed) {
  const rnd = mulberry32(seed), pts = [];
  for (let i = 0; i <= 18; i++) {
    const t = i / 18, r = lerp(1.7, 0.4, Math.pow(t, 0.6)) * (0.75 + rnd() * 0.5) + (rnd() < 0.2 ? 0.25 + rnd() * 0.3 : 0);
    pts.push(new THREE.Vector2(r, t * h));
  }
  pts.push(new THREE.Vector2(0.22, h), new THREE.Vector2(0.01, h - 0.3));
  const geo = new THREE.LatheGeometry(pts, 20);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), k = 1 + (fbm2(x * 1.8 + y * 0.7, z * 1.8 - y * 0.9 + seed) - 0.5) * 0.9;
    p.setXYZ(i, x * k, y, z * k);
  }
  geo.computeVertexNormals();
  return geo;
}

/** Whale silhouette: a lathe body along +z with a blunt head and flukes, undulating in the vertex shader. */
function whaleGeometry() {
  const pts = [];
  for (let i = 0; i <= 30; i++) {
    const t = i / 30;                                 // 0 tail, 1 head
    const r = t < 0.6 ? lerp(0.12, 1.2, smooth(t / 0.6)) : lerp(1.2, 1.05, (t - 0.6) / 0.4) - (t > 0.96 ? (t - 0.96) * 8 : 0);
    pts.push(new THREE.Vector2(Math.max(r, 0.02), (t - 0.55) * 14));
  }
  const body = new THREE.LatheGeometry(pts, 24);
  body.rotateX(Math.PI / 2);          // lathe axis y -> z (head toward +z)
  body.scale(1, 1.15, 1);
  const fluke = new THREE.BufferGeometry();
  fluke.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, -7.4, 2.8, 0.1, -8.9, 1.2, 0, -7.8, 0, 0, -7.4, -2.8, 0.1, -8.9, -1.2, 0, -7.8], 3));
  fluke.setAttribute('normal', new THREE.Float32BufferAttribute(new Array(18).fill(0).map((_, i) => (i % 3 === 1 ? 1 : 0)), 3));
  fluke.setAttribute('uv', new THREE.Float32BufferAttribute(new Array(12).fill(0), 2));
  return mergeGeometries([body.toNonIndexed(), fluke]);
}

const COMB_VERT = `varying vec3 vN, vV, vL; uniform float uTime;
  void main() { vec3 p = position; p *= 1. + sin(uTime * 1.3 + p.y * 2.) * .03; vL = position;
    vec4 mv = modelViewMatrix * vec4(p, 1.); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`;
const COMB_FRAG = `uniform float uTime, uK; varying vec3 vN, vV, vL;
  vec3 hue(float h) { return clamp(abs(fract(h + vec3(0., .667, .333)) * 6. - 3.) - 1., 0., 1.); }
  void main() {
    float f = 1. - abs(dot(normalize(vN), normalize(vV)));
    float ang = atan(vL.z, vL.x);
    float band = fract(ang / 6.2831 * 8.);                  // eight comb rows, one per sector border
    float row = 1. - smoothstep(0., .06, min(band, 1. - band));
    float wave = .5 + .5 * sin(vL.y * 14. - uTime * 6.);
    vec3 rainbow = hue(vL.y * .6 - uTime * .35 + ang * .05);
    vec3 c = vec3(.25, .55, 1.) * f * f * .9 + rainbow * row * (.35 + wave * wave * 2.4) * smoothstep(1.05, .75, abs(vL.y));
    c += vec3(.2, .4, .9) * .04;
    gl_FragColor = vec4(c * uK, 1.);
  }`;

function initAbyss(gfx) {
  const a = CONFIG.abyss;
  const scene = new THREE.Scene();
  const camera = createZoneCamera();
  const dome = createDome(a.domeTop, a.domeBottom);
  scene.add(dome);
  const ventColor = col(a.vent), hot = col(a.ventHot);
  const vents = a.vents.map(([x, z], i) => new THREE.Vector4(x, trenchFloor(x, z) + a.ventH[i], z, 1));
  const rockMat = new THREE.ShaderMaterial({
    uniforms: { uVentColor: { value: ventColor }, uHot: { value: hot }, uVents: { value: vents }, uTime: { value: 0 }, uGlowK: { value: 1 } },
    vertexShader: ROCK_VERT, fragmentShader: ROCK_FRAG,
  });
  const floorGeo = new THREE.PlaneGeometry(120, 140, 160, 180); floorGeo.rotateX(-Math.PI / 2); floorGeo.translate(0, 0, -40);
  const fp = floorGeo.attributes.position;
  for (let i = 0; i < fp.count; i++) fp.setY(i, trenchFloor(fp.getX(i), fp.getZ(i)));
  floorGeo.computeVertexNormals();
  scene.add(new THREE.Mesh(floorGeo, rockMat));
  a.vents.forEach(([x, z], i) => {
    // A main chimney and two shorter spires beside it.
    [[0, 0, 1], [1.5, 0.8, 0.55], [-1.1, -1.2, 0.4]].forEach(([dx, dz, k], j) => {
      const m = new THREE.Mesh(chimneyGeometry(a.ventH[i] * k, 60 + i * 3 + j), rockMat);
      m.position.set(x + dx, trenchFloor(x + dx, z + dz) - 0.2, z + dz);
      if (j) m.scale.set(0.6, 1, 0.6);
      scene.add(m);
    });
    const g = glowSprite(a.vent, 3.2, 0.5); g.position.set(x, vents[i].y + 0.3, z); scene.add(g);
    const g2 = glowSprite(a.ventHot, 0.8, 0.55); g2.position.copy(g.position); scene.add(g2);
  });

  // Tube worms around the vents: white stalks with red plumes.
  const wormGeo = new THREE.CylinderGeometry(0.05, 0.07, 1, 6); wormGeo.translate(0, 0.5, 0);
  const worms = new THREE.InstancedMesh(wormGeo, rockMat, a.worms);
  const tips = [], rnd = mulberry32(606), d = new THREE.Object3D();
  for (let i = 0; i < a.worms; i++) {
    const [vx, vz] = a.vents[i % a.vents.length], r = 1.6 + rnd() * 2.6, t = rnd() * 6.28;
    const x = vx + Math.cos(t) * r, z = vz + Math.sin(t) * r, h = 0.6 + rnd() * 1.4;
    d.position.set(x, trenchFloor(x, z), z); d.rotation.set((rnd() - 0.5) * 0.4, 0, (rnd() - 0.5) * 0.4); d.scale.set(1, h, 1);
    d.updateMatrix(); worms.setMatrixAt(i, d.matrix);
    const tip = new THREE.Vector3(0, 1, 0).applyMatrix4(d.matrix); tips.push(tip.x, tip.y, tip.z);
  }
  scene.add(worms);
  const tipGeo = new THREE.BufferGeometry(); tipGeo.setAttribute('position', new THREE.Float32BufferAttribute(tips, 3));
  const tipMat = new THREE.PointsMaterial({ color: col('#ff2a55').multiplyScalar(2.2), size: 0.28, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, map: GLOW });
  scene.add(new THREE.Points(tipGeo, tipMat));

  // Plumes: particles rising from every mouth, widening and cooling.
  const PN = countFor(a, 'plume'), pp = new Float32Array(PN * 3), pr = new Float32Array(PN);
  for (let i = 0; i < PN; i++) { const v = vents[i % vents.length]; pp[i * 3] = v.x; pp[i * 3 + 1] = v.y; pp[i * 3 + 2] = v.z; pr[i] = rnd(); }
  const plumeGeo = new THREE.BufferGeometry();
  plumeGeo.setAttribute('position', new THREE.BufferAttribute(pp, 3)); plumeGeo.setAttribute('aRand', new THREE.BufferAttribute(pr, 1));
  const plumeMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: { value: 0 }, uDpr: { value: 1 }, uHot: { value: hot }, uCool: { value: col('#6a2bd8') }, uK: { value: 1 } },
    vertexShader: `uniform float uTime, uDpr; attribute float aRand; varying float vT;
      void main() { float t = fract(uTime * (.06 + aRand * .05) + aRand * 7.); vT = t;
        vec3 p = position; float h = t * 16.; float w = .2 + t * 2.6;
        p += vec3(sin(aRand * 91. + uTime * .5) * w, h, cos(aRand * 57. + uTime * .4) * w);
        p.x += t * t * 3.;                              // the current bends the plume
        vec4 mv = modelViewMatrix * vec4(p, 1.); gl_Position = projectionMatrix * mv;
        gl_PointSize = (1.2 + t * 7.) * uDpr * 30. / max(-mv.z, .5); }`,
    fragmentShader: `uniform vec3 uHot, uCool; uniform float uK; varying float vT;
      void main() { vec2 q = gl_PointCoord - .5; float r = dot(q, q); if (r > .25) discard;
        vec3 c = mix(uHot * 2.2, uCool * .5, smoothstep(0., .35, vT)) * (1. - vT) * (1. - r * 4.) * .22;
        gl_FragColor = vec4(c * uK, 1.); }`,
  });
  const plumes = new THREE.Points(plumeGeo, plumeMat); plumes.frustumCulled = false;
  scene.add(plumes);

  // Violet haze far behind the vents: the backdrop the giant is seen against.
  const haze = glowSprite(a.haze, 170, 0.55); haze.position.set(0, 9, -120); scene.add(haze);
  const sparks = createWrapPoints({ count: 1400, box: [60, 30, 60], size: 0.5, color: '#9d7bff', seed: 55, opacity: 0.55, twinkle: 1 });
  scene.add(sparks);

  // The giant.
  const whaleMat = new THREE.ShaderMaterial({
    side: THREE.DoubleSide,
    uniforms: { uTime: { value: 0 }, uRim: { value: col('#5a7cff') } },
    vertexShader: `uniform float uTime; varying vec3 vN, vV;
      void main() { vec3 p = position; float t = clamp((4. - p.z) / 13., 0., 1.);
        p.y += sin(uTime * .7 - p.z * .25) * t * t * 1.1;
        vec4 mv = modelViewMatrix * vec4(p, 1.); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform vec3 uRim; varying vec3 vN, vV;
      void main() { float f = 1. - abs(dot(normalize(vN), normalize(vV))); gl_FragColor = vec4(vec3(.004, .006, .014) + uRim * f * f * f * .3, 1.); }`,
  });
  const whale = new THREE.Mesh(whaleGeometry(), whaleMat);
  whale.scale.setScalar(2.1);
  scene.add(whale);

  // The last light: a comb jelly.
  const comb = new THREE.Group();
  const combMat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    uniforms: { uTime: { value: 0 }, uK: { value: 0 } }, vertexShader: COMB_VERT, fragmentShader: COMB_FRAG });
  const combGeo = new THREE.SphereGeometry(1, 64, 48); combGeo.scale(0.72, 1, 0.72);
  comb.add(new THREE.Mesh(combGeo, combMat));
  const combGlow = glowSprite('#6f9bff', 7, 0);
  comb.add(combGlow);
  scene.add(comb);

  gfx.onResize((W, H, dpr) => { fitCamera(camera, W / H); plumeMat.uniforms.uDpr.value = dpr; sparks.material.uniforms.uDpr.value = dpr; });
  const proj = new THREE.Vector3();
  const state = { vents: vents.map(() => new THREE.Vector4()), heat: 1 };
  return {
    id: 'abyss', scene, camera, state, mats: [rockMat, plumeMat, whaleMat, combMat, sparks.material],
    update(p, time) {
      // Glide down the trench, low over the floor; at the end, drift up toward the comb jelly.
      const z = lerp(12, -4, smooth(seg(p, 0, 0.8))), y = lerp(9.5, 7.5, smooth(seg(p, 0, 0.5)));
      const endK = smooth(seg(p, a.comb[0], a.comb[1]));
      aim(camera, [Math.sin(p * 4) * 2, y + endK * 3, z], Math.sin(p * 3.3) * 0.18, lerp(-0.2, 0.04, endK));
      camera.updateMatrixWorld();
      dome.position.copy(camera.position);
      // The giant crosses right to left in front of the haze, far ahead.
      const g = seg(p, a.giant[0], a.giant[1]);
      whale.position.set(lerp(75, -75, g), y - 1 + Math.sin(g * 3) * 1.5, z - 42);
      whale.rotation.set(0.05, -Math.PI / 2, Math.sin(time * 0.3) * 0.04);
      whale.visible = g > 0 && g < 1;
      // Everything dims around the comb jelly.
      const dim = 1 - endK * 0.8;
      rockMat.uniforms.uGlowK.value = dim;
      vents.forEach((v) => { v.w = dim; });
      plumeMat.uniforms.uK.value = dim;
      comb.position.set(camera.position.x * 0.3, y + 3.2 + endK * 3 + Math.sin(time * 0.6) * 0.25, z - lerp(16, 6.5, endK));
      comb.rotation.set(0.25, time * 0.2, 0.1);
      combMat.uniforms.uK.value = smooth(seg(p, a.comb[0] - 0.08, a.comb[0] + 0.08));
      combGlow.material.opacity = combMat.uniforms.uK.value * 0.35;
      for (const m of [rockMat, plumeMat, whaleMat, combMat]) m.uniforms.uTime.value = time;
      const su = sparks.material.uniforms;
      su.uCam.value.copy(camera.position); su.uTime.value = time; su.uVel.value = vel.k;
      // Heat shimmer columns in screen space for the final pass.
      vents.forEach((v, i) => {
        proj.set(v.x, v.y, v.z);
        const dist = camera.position.distanceTo(proj);
        proj.project(camera);
        const inFront = proj.z > -1 && proj.z < 1 ? 1 : 0;
        state.vents[i].set(proj.x * 0.5 + 0.5, proj.y * 0.5 + 0.5, 1.4 / Math.max(2, dist), inFront * dim);
      });
    },
    render(renderer) { renderer.render(scene, camera); },
  };
}

/* ── src/70-resurface.js ── */
/* ───────── zone 6: rising back to the light ───────── */
// Bubbles carry the camera up. The water behind them is the same rippling-surface shader as zone 1, starting dark and
// deep and brightening as the diver climbs, so the dive ends where it began.

const BUBBLE_VERT = `
  uniform float uTime, uClimb, uSpan; attribute vec3 aBase; attribute float aSize, aSpeed;
  varying vec3 vN, vV;
  void main() {
    vec3 b = aBase;
    b.y = mod(b.y + uTime * aSpeed + uClimb * (.6 + aSpeed * .2), uSpan) - uSpan * .5;
    b.x += sin(uTime * 2.1 * aSpeed + aBase.z) * .25 * aSize;
    b.z += cos(uTime * 1.7 * aSpeed + aBase.x) * .25 * aSize;
    vec3 p = position * aSize;
    p.y *= .85 + .15 * sin(uTime * 6. + aBase.x * 9.);   // wobble
    vec4 mv = viewMatrix * vec4(b + p, 1.);
    vN = normalize(mat3(viewMatrix) * normal); vV = normalize(-mv.xyz);
    gl_Position = projectionMatrix * mv;
  }`;
const BUBBLE_FRAG = `
  uniform vec3 uTint; uniform float uK; varying vec3 vN, vV;
  void main() {
    vec3 n = normalize(vN);
    float f = 1. - abs(dot(n, normalize(vV)));
    float rim = f * f * f * 1.4;
    float spec = max(dot(n, normalize(vec3(-.4, .7, .6))), 0.); spec = spec * spec; spec = spec * spec; spec = spec * spec; spec = spec * spec;
    gl_FragColor = vec4((uTint * rim + vec3(1.) * spec * 1.6) * uK, 1.);
  }`;

function initResurface(gfx, titleTexture) {
  const r = CONFIG.resurface;
  const scene = new THREE.Scene();
  const camera = createZoneCamera();
  const bgScene = new THREE.Scene(), bgCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const surface = createSurfaceQuad(titleTexture);
  bgScene.add(surface);
  const su = surface.material.uniforms;

  const N = countFor(r, 'bubbles'), rnd = mulberry32(808);
  const geo = new THREE.InstancedBufferGeometry().copy(new THREE.SphereGeometry(1, 18, 14));
  const base = new Float32Array(N * 3), size = new Float32Array(N), speed = new Float32Array(N);
  const SPAN = 40;
  for (let i = 0; i < N; i++) {
    const small = rnd() < 0.8;
    base[i * 3] = (rnd() - 0.5) * 26; base[i * 3 + 1] = (rnd() - 0.5) * SPAN; base[i * 3 + 2] = -2 - rnd() * 26;
    size[i] = small ? 0.04 + rnd() * 0.12 : 0.2 + rnd() * 0.5; speed[i] = small ? 1.4 + rnd() * 1.6 : 0.7 + rnd() * 0.8;
  }
  geo.setAttribute('aBase', new THREE.InstancedBufferAttribute(base, 3));
  geo.setAttribute('aSize', new THREE.InstancedBufferAttribute(size, 1));
  geo.setAttribute('aSpeed', new THREE.InstancedBufferAttribute(speed, 1));
  geo.instanceCount = N;
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: { value: 0 }, uClimb: { value: 0 }, uSpan: { value: SPAN }, uTint: { value: col('#9ff6ff') }, uK: { value: 1 } },
    vertexShader: BUBBLE_VERT, fragmentShader: BUBBLE_FRAG,
  });
  const bubbles = new THREE.Mesh(geo, mat);
  bubbles.frustumCulled = false;
  scene.add(bubbles);
  const colors = r.colors.map(col);

  gfx.onResize((W, H) => {
    fitCamera(camera, W / H);
    su.uAspect.value = W / H;
    su.uTanHalf.value = Math.tan(THREE.MathUtils.degToRad(W / H < 1 ? 74 : CONFIG.camera.vfov) / 2);
  });
  const s = CONFIG.surface;
  return {
    id: 'resurface', scene, camera, mats: [mat, surface.material],
    update(p, time) {
      aim(camera, [0, 0, 6], 0, lerp(0.1, 0.55, smooth(p)));
      camera.updateMatrixWorld();
      mat.uniforms.uTime.value = time;
      mat.uniforms.uClimb.value = p * r.climb;
      // Background: the surface from far below, climbing; dark at first, bright at the end.
      const light = smooth(seg(p, 0.05, 0.95));
      su.uTime.value = time;
      su.uDepth.value = lerp(60, 2.2, Math.pow(light, 0.8));
      su.uPitch.value = lerp(0.5, 0.95, light) + look.y * CONFIG.look.pitch;
      su.uYaw.value = -look.x * CONFIG.look.yaw * 1.5;
      su.uDark.value = 1 - light;
      su.uTitleK.value = 0;
      su.uRays.value = s.rays * light * (1 + vel.k * 0.3);
      // Bubble rim tint follows the water colour from navy to turquoise.
      const k = light * (colors.length - 1), i = Math.min(colors.length - 2, Math.floor(k));
      mat.uniforms.uTint.value.copy(colors[i]).lerp(colors[i + 1], k - i).lerp(col('#dffcff'), 0.45);
      mat.uniforms.uK.value = 0.7 + light * 0.6;
    },
    render(renderer) {
      renderer.render(bgScene, bgCam);
      const auto = renderer.autoClear;
      renderer.autoClear = false;
      renderer.render(scene, camera);
      renderer.autoClear = auto;
    },
  };
}

/* ── src/80-drift.js ── */
/* ───────── drift overlay: bubbles and streaks that answer scroll speed ───────── */
// Screen-space quads drawn over every zone. Scrolling down moves them up past the lens (the diver sinks through them).
// Scroll velocity stretches them into streaks and brightens them; near the surface they draw as bubble rings.

function createDrift(gfx) {
  const N = countFor(CONFIG.drift, 'count'), rnd = mulberry32(1203);
  const geo = new THREE.InstancedBufferGeometry().copy(new THREE.PlaneGeometry(1, 1));
  const base = new Float32Array(N * 3), rand = new Float32Array(N);
  for (let i = 0; i < N; i++) { base[i * 3] = rnd() * 2.2 - 1.1; base[i * 3 + 1] = rnd() * 2.4 - 1.2; base[i * 3 + 2] = rnd() * rnd(); rand[i] = rnd(); }
  geo.setAttribute('aBase', new THREE.InstancedBufferAttribute(base, 3));
  geo.setAttribute('aRand', new THREE.InstancedBufferAttribute(rand, 1));
  geo.instanceCount = N;
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uScroll: { value: 0 }, uTime: { value: 0 }, uVel: { value: 0 }, uAspect: { value: 1 }, uK: { value: 0.5 },
      uBubble: { value: 1 }, uRise: { value: 0.05 }, uColor: { value: new THREE.Color() }, uPx: { value: 1 },
    },
    vertexShader: `
      uniform float uScroll, uTime, uVel, uAspect, uRise, uPx; attribute vec3 aBase; attribute float aRand;
      varying vec2 vUv; varying float vStretch, vNear;
      void main() {
        float near = mix(.25, 1., aBase.z);
        float y = aBase.y + uScroll * near + uTime * uRise * near * (.6 + aRand);
        y = mod(y + 1.2, 2.4) - 1.2;
        float x = aBase.x + sin(uTime * .6 + aRand * 20.) * .015 * near;
        float sz = (6. + aRand * 16.) * near * uPx;                 // size in pixels
        float stretch = 1. + abs(uVel) * 22. * near;
        vec2 q = position.xy;
        gl_Position = vec4(x + q.x * sz * 2. / (uAspect * 900.), y + q.y * sz * stretch * 2. / 900., 0., 1.);
        vUv = q + .5; vStretch = stretch; vNear = near;
      }`,
    fragmentShader: `
      uniform vec3 uColor; uniform float uK, uBubble, uVel; varying vec2 vUv; varying float vStretch, vNear;
      void main() {
        vec2 d = (vUv - .5) * 2.;
        float r = length(d);
        if (r > 1.) discard;
        float disc = 1. - r;
        float ring = smoothstep(.62, .86, r) * (1. - smoothstep(.86, 1., r)) + smoothstep(.35, 0., length(d - vec2(-.35, .35))) * .8;
        float look = mix(disc * disc, ring, uBubble / vStretch);
        float a = look * uK * (.35 + abs(uVel) * .9) * vNear / sqrt(vStretch);
        gl_FragColor = vec4(uColor * a, 1.);
      }`,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  const scene = new THREE.Scene();
  scene.add(mesh);
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  gfx.onResize((W, H, dpr) => { mat.uniforms.uAspect.value = W / H; mat.uniforms.uPx.value = 900 / H; });
  const looks = CONFIG.drift.looks.map(([c, k, b, r]) => ({ c: col(c), k, b, r }));
  const tmp = new THREE.Color();
  return {
    scene, camera,
    update(u, time) {
      const i = Math.min(looks.length - 1, Math.floor(u)), j = Math.min(looks.length - 1, i + 1), t = smooth(seg(u - i, 0.85, 1));
      const A = looks[i], B = looks[j], U = mat.uniforms;
      U.uColor.value.copy(A.c).lerp(tmp.copy(B.c), t);
      U.uK.value = lerp(A.k, B.k, t); U.uBubble.value = lerp(A.b, B.b, t); U.uRise.value = lerp(A.r, B.r, t);
      U.uTime.value = time; U.uVel.value = reduce ? 0 : vel.v;
      U.uScroll.value = scrollY * CONFIG.drift.scroll;
    },
  };
}

/* ── src/85-hud.js ── */
/* ───────── overlay: scroll cue, zone words, the way back ───────── */
function createHud() {
  const cue = $('#cue'), word = $('#word'), fin = $('#fin'), magnet = $('#magnet'), magnetText = magnet.querySelector('span');
  const show = (el, k, dy = 0, blur = 0) => {
    el.style.opacity = k.toFixed(3);
    el.style.transform = dy ? `translateY(${((1 - k) * dy).toFixed(1)}px)` : '';
    el.style.filter = blur && k < 0.999 ? `blur(${((1 - k) * blur).toFixed(1)}px)` : '';
  };
  const pick = (k) => (reduce ? (k > 0.001 ? 1 : 0) : k);
  let wordText = '', finOn = null;

  // Magnetic button: pulls toward the pointer inside a radius, the label inside moves less.
  const mag = { x: 0, y: 0, tx: 0, ty: 0 };
  const RADIUS = 160, PULL = 0.38, INNER = 0.45;
  addEventListener('pointermove', (e) => {
    const r = magnet.getBoundingClientRect(), cx = r.left + r.width / 2 - mag.x, cy = r.top + r.height / 2 - mag.y;
    const dx = e.clientX - cx, dy = e.clientY - cy, near = Math.hypot(dx, dy) < RADIUS && finOn;
    mag.tx = near ? dx * PULL : 0; mag.ty = near ? dy * PULL : 0;
  });
  const setFin = (on) => {
    if (on === finOn) return;
    finOn = on;
    fin.classList.toggle('on', on);
    fin.setAttribute('aria-hidden', String(!on));
    magnet.tabIndex = on ? 0 : -1;
  };

  return function update(u) {
    show(cue, reduce ? 0 : 1 - smooth(seg(u, 0, 0.03)));
    const w = CONFIG.words.find((x) => u >= x.u[0] && u <= x.u[3]);
    if (w && w.text !== wordText) { wordText = w.text; word.textContent = wordText; word.className = `word fade ${w.place}`; }
    show(word, w ? pick(envelope(u, w.u)) : 0, 30, 14);

    const fk = reduce ? (u >= CONFIG.finIn[0] ? 1 : 0) : smooth(seg(u, ...CONFIG.finIn));
    show(fin, fk, 30);
    setFin(fk > 0.5);
    if (!reduce) {
      mag.x += (mag.tx - mag.x) * 0.14; mag.y += (mag.ty - mag.y) * 0.14;
      magnet.style.transform = `translate(${mag.x.toFixed(1)}px, ${mag.y.toFixed(1)}px)`;
      magnetText.style.transform = `translate(${(mag.x * INNER).toFixed(1)}px, ${(mag.y * INNER).toFixed(1)}px)`;
    }
  };
}

/* ── src/90-boot.js ── */
/* ───────── boot and the single frame loop ───────── */
/** Which zones draw at dive position u, with their local progress and the dissolve amount between them. */
function zonesAt(u, count) {
  const b = Math.round(u), w = CONFIG.blend;
  if (!reduce && b > 0 && b < count && Math.abs(u - b) < w) {
    return { a: b - 1, pa: 1, b, pb: 0, mix: smooth((u - (b - w)) / (2 * w)) };
  }
  const i = clamp(Math.floor(u), 0, count - 1);
  return { a: i, pa: clamp01(u - i), b: -1, pb: 0, mix: 0 };
}

async function boot() {
  // The title is drawn into a canvas, so its face must be loaded first.
  const faces = await document.fonts.load(CONFIG.surface.font);
  if (!faces.length) console.error('DEEP SEA: display font did not load:', CONFIG.surface.font);

  const gfx = createRenderer($('#gl'));
  const surface = initSurface(gfx);
  const zones = [surface, initReef(gfx), initTwilight(gfx), initMidnight(gfx), initAbyss(gfx), initResurface(gfx, surface.surfaceTitle.tex)];
  if (zones.length !== runways.length) throw new Error(`zones (${zones.length}) and scroll runways (${runways.length}) differ`);
  const drift = createDrift(gfx);
  gfx.zonePass.overlay = drift;
  const hud = createHud();
  gfx.fit();
  for (const z of zones) gfx.renderer.compile(z.scene, z.camera);
  const byId = Object.fromEntries(zones.map((z) => [z.id, z]));
  const fin = gfx.finalPass.uniforms;

  if (new URLSearchParams(location.search).has('debug')) window.__deepsea = { THREE, gfx, zones, diveU, lenis };
  let lastU = -1, dirty = true, prev = performance.now();
  addEventListener('resize', () => { dirty = true; });
  if (reduce) addEventListener('scroll', () => { dirty = true; }, { passive: true });

  function frame(now) {
    requestAnimationFrame(frame);
    if (lenis) lenis.raf(now);
    if (document.hidden) return;                 // paused while the tab is hidden
    const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
    const u = diveU();
    if (reduce && !dirty && u === lastU) return; // reduced motion: draw only when the view changes
    dirty = false; lastU = u;
    const time = reduce ? STILL_TIME : now / 1000;
    stepVelocity();
    stepLook();

    const s = zonesAt(u, zones.length);
    const A = zones[s.a], B = s.b >= 0 ? zones[s.b] : null;
    A.update(reduce ? STILL[A.id] : s.pa, time, dt);
    if (B) B.update(s.pb, time, dt);
    gfx.zonePass.a = A; gfx.zonePass.b = B; gfx.zonePass.mix = s.mix; gfx.zonePass.time = time;
    drift.update(u, time);

    const weight = (z) => (z === A ? 1 - s.mix : z === B ? s.mix : 0);
    const mid = byId.midnight, abyss = byId.abyss;
    const fw = weight(mid);
    if (fw > 0) fin.uFlash.value.set(mid.state.flashScreen.x, mid.state.flashScreen.y, fw);
    else fin.uFlash.value.z = 0;
    const hw = weight(abyss);
    fin.uHeat.value = hw;
    if (hw > 0) abyss.state.vents.forEach((v, i) => fin.uVents.value[i].copy(v));
    fin.uTime.value = time; fin.uVel.value = vel.k;

    hud(u);
    gfx.composer.render(dt);
  }
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', () => { dirty = true; prev = performance.now(); });
}
boot().catch((e) => console.error('DEEP SEA failed to start', e));

</script>
