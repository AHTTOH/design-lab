<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUSEUM</title>
<meta name="description" content="밤의 작은 미술관을 걸어서 지나간다. 로비, 회화, 조각, 빛, 영상, 밤하늘. 스크롤로 걷는 1인칭 인터랙션 연습.">
<meta property="og:title" content="MUSEUM">
<meta property="og:image" content="https://ahttoh.github.io/design-lab/assets/thumb/museum.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    /* Every room's --len is multiplied by this. 2026-09-28: new studies sit near 7,000vh at 1. */
    --scroll-stretch: 1;
    --night: #04060c;
    --paper: #f5f7fa;
    --label-ink: #1a1d24;
    --label-soft: #555c6b;
    --glow: #dfe7ff;
    --focus: #7aa2ff;
    --display: 'Syne', 'Pretendard Variable', system-ui, sans-serif;
    --korean: 'Pretendard Variable', system-ui, sans-serif;
    --gutter: clamp(16px, 4vw, 64px);
    --room-size: clamp(2.6rem, 1.2rem + 5.2vw, 6.4rem);
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    /* Reduced motion shows still viewpoints, so the long walk is shortened. */
    :root { --scroll-stretch: .4; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: clip; }
  body { background: var(--night); color: var(--glow); font-family: var(--korean); }
  ::selection { background: var(--focus); color: var(--night); }

  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }

  /* The rooms are scroll runways only. Everything visible is the fixed canvas plus the fixed overlay. */
  main { position: relative; z-index: 1; pointer-events: none; }
  .room { position: relative; height: calc(var(--len) * var(--scroll-stretch)); }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .hud { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .fade { opacity: 0; will-change: opacity, transform; }

  .intro { position: absolute; left: var(--gutter); bottom: 9vh; margin: 0; font-weight: 700; font-size: clamp(1.15rem, .9rem + 1vw, 1.7rem); letter-spacing: -.02em; color: var(--glow); text-shadow: 0 2px 30px rgba(0, 0, 0, .6); }
  .cue { position: absolute; left: 50%; bottom: 4vh; width: 1px; height: 54px; background: rgba(223, 231, 255, .2); overflow: hidden; }
  .cue::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent, var(--glow)); transform-origin: top; animation: cue 2s var(--ease) infinite; }
  @keyframes cue { 0% { transform: scaleY(0); opacity: 1; } 60% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }

  .room-word { position: absolute; left: var(--gutter); top: 8vh; margin: 0; font-weight: 800; font-size: var(--room-size); letter-spacing: -.05em; line-height: 1; color: #fff; text-shadow: 0 4px 40px rgba(0, 0, 0, .55); }

  /* Wall label: a small printed placard like the ones beside real works. */
  .label { position: absolute; left: var(--gutter); bottom: 7vh; width: min(320px, calc(100vw - 2 * var(--gutter))); padding: 16px 18px 15px; background: var(--paper); color: var(--label-ink);
    border-radius: 2px; box-shadow: 0 18px 50px rgba(0, 0, 0, .45); }
  .label h3 { margin: 0 0 6px; font-size: 1.12rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.25; }
  .label p { margin: 0; font-size: .86rem; line-height: 1.5; color: var(--label-soft); letter-spacing: -.01em; }

  .fin { position: absolute; left: 0; right: 0; bottom: 8vh; display: grid; justify-items: center; gap: 26px; }
  .fin-line { margin: 0; font-weight: 700; font-size: clamp(1.2rem, .9rem + 1.2vw, 2rem); letter-spacing: -.03em; color: #fff; text-shadow: 0 2px 30px rgba(0, 0, 0, .7); }
  .magnet { position: relative; display: grid; place-items: center; width: 128px; height: 128px; border-radius: 50%; text-decoration: none; color: var(--night); font: 800 1rem var(--korean);
    background: radial-gradient(circle at 40% 30%, #fff 0%, #e4ebff 45%, #b9c8f5 100%); box-shadow: 0 0 0 1px rgba(255, 255, 255, .5), 0 0 60px rgba(160, 190, 255, .45), 0 20px 50px rgba(0, 0, 0, .5);
    transition: box-shadow .4s var(--ease); will-change: transform; }
  .magnet span { pointer-events: none; will-change: transform; }
  .magnet:hover { box-shadow: 0 0 0 1px #fff, 0 0 90px rgba(170, 200, 255, .75), 0 20px 50px rgba(0, 0, 0, .5); }
  .magnet:focus-visible { outline: 3px solid var(--focus); outline-offset: 8px; }
  .fin.on .magnet { pointer-events: auto; }

  .tilt-btn { position: absolute; right: var(--gutter); top: 3vh; padding: 10px 18px; border: 1px solid rgba(223, 231, 255, .5); border-radius: 999px; background: rgba(4, 6, 12, .55);
    color: var(--glow); font: 700 14px var(--korean); pointer-events: auto; backdrop-filter: blur(6px); }
  .tilt-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }

  @media (max-width: 760px) {
    .room-word { top: 6vh; }
    .label { bottom: 5vh; padding: 13px 15px 12px; }
    .label h3 { font-size: 1.02rem; }
    .fin { bottom: 7vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cue::after { animation: none; }
    .magnet { transition: none; }
  }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>

<div class="hud">
  <p class="intro fade" id="intro">밤의 미술관, 걸어서 둘러봅니다</p>
  <div class="cue fade" id="cue" aria-hidden="true"></div>
  <p class="room-word fade" id="room-word" aria-hidden="true"></p>
  <aside class="label fade" id="label" aria-live="polite"><h3 id="label-title"></h3><p id="label-meta"></p></aside>
  <div class="fin fade" id="fin">
    <p class="fin-line">문 닫을 시간입니다</p>
    <a class="magnet" id="magnet" href="../"><span>목록으로</span></a>
  </div>
  <button class="tilt-btn" id="tilt-btn" type="button" hidden>기울기 켜기</button>
</div>

<main>
  <section class="room" id="r-lobby" style="--len:1100vh"><h1 class="sr">MUSEUM, 밤의 미술관 로비</h1></section>
  <section class="room" id="r-paint" style="--len:1400vh"><h2 class="sr">회화 전시실</h2></section>
  <section class="room" id="r-sculpt" style="--len:1200vh"><h2 class="sr">조각 전시실</h2></section>
  <section class="room" id="r-light" style="--len:1100vh"><h2 class="sr">빛 설치 작품실</h2></section>
  <section class="room" id="r-video" style="--len:1200vh"><h2 class="sr">영상실</h2></section>
  <section class="room" id="r-exit" style="--len:1000vh"><h2 class="sr">출구, 밤하늘</h2></section>
</main>

/* ───────── shared GLSL ───────── */
const HASH = `
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3. - 2. * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y); }
float fbm(vec2 p) { float s = 0., a = .5; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p *= 2.03; a *= .5; } return s; }`;
// 3D simplex noise, Ashima Arts / Stefan Gustavson (MIT).
const SNOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;} vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);} vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1./6.,1./3.); const vec4 D=vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
  float n_=.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.+1.; vec4 s1=floor(b1)*2.+1.; vec4 sh=-step(h,vec4(0.));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.); m=m*m;
  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;

/* ───────── renderer, camera, post ───────── */
function createWorld(canvas) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
  renderer.setClearColor(0x000000, 1);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = CONFIG.render.exposure;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const cc = CONFIG.camera;
  const camera = new THREE.PerspectiveCamera(cc.vfov, 1, cc.near, cc.far);
  camera.rotation.order = 'YXZ';
  scene.add(camera);

  const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
  composer.addPass(new RenderPass(scene, camera));
  const b = CONFIG.bloom;
  const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), b.strength, b.radius, b.threshold);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  const resizers = [];
  function fit() {
    const W = innerWidth, H = innerHeight, dpr = dprNow();
    renderer.setPixelRatio(dpr); renderer.setSize(W, H, false);
    composer.setPixelRatio(dpr); composer.setSize(W, H);
    camera.aspect = W / H;
    // Portrait screens: widen the vertical FOV so the horizontal view never drops below minHfov.
    const needV = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(cc.minHfov) / 2) / camera.aspect);
    camera.fov = clamp(Math.max(cc.vfov, THREE.MathUtils.radToDeg(needV)), cc.vfov, cc.maxVfov);
    camera.updateProjectionMatrix();
    resizers.forEach((f) => f(W, H, dpr));
  }
  addEventListener('resize', fit);
  return { renderer, scene, camera, composer, fit, onResize: (f) => resizers.push(f) };
}

/* ───────── polished concrete: lit floor + additive planar reflection ───────── */
function concreteTexture() {
  const size = 512, c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d'), rnd = mulberry32(7);
  const base = new THREE.Color(CONFIG.floor.color);
  g.fillStyle = `#${base.getHexString()}`; g.fillRect(0, 0, size, size);
  // Soft mottling, then fine aggregate specks.
  for (let i = 0; i < 260; i++) {
    const x = rnd() * size, y = rnd() * size, r = 20 + rnd() * 90, a = 0.025 + rnd() * 0.05;
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    const tone = rnd() < 0.5 ? '255,255,255' : '0,0,0';
    grad.addColorStop(0, `rgba(${tone},${a})`); grad.addColorStop(1, `rgba(${tone},0)`);
    g.fillStyle = grad; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let i = 0; i < 9000; i++) {
    g.fillStyle = rnd() < 0.5 ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.14)';
    g.fillRect(rnd() * size, rnd() * size, 1 + rnd() * 1.5, 1 + rnd() * 1.5);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
  return t;
}

const REFLECT_VS = `
uniform mat4 textureMatrix; varying vec4 vUv; varying vec3 vWorld;
void main() { vUv = textureMatrix * vec4(position, 1.); vWorld = (modelMatrix * vec4(position, 1.)).xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`;
const REFLECT_FS = `
uniform vec3 color; uniform sampler2D tDiffuse; uniform float uStrength, uRough;
varying vec4 vUv; varying vec3 vWorld;
${HASH}
void main() {
  // Jitter the projected lookup with two octaves of noise: a clean mirror reads as glass, a jittered one as polished concrete.
  vec2 n = vec2(fbm(vWorld.xz * 3.1), fbm(vWorld.xz * 3.1 + 17.3)) - .5;
  vec4 uv = vUv; uv.xy += n * uRough * uv.w;
  vec3 r = texture2DProj(tDiffuse, uv).rgb;
  float blotch = .75 + .5 * fbm(vWorld.xz * .35);
  gl_FragColor = vec4(r * color * uStrength * blotch, 1.);
}`;

function buildFloorReflection(world) {
  const cfg = CONFIG.render;
  const geo = new THREE.PlaneGeometry(60, 140);
  const reflector = new Reflector(geo, {
    textureWidth: 512, textureHeight: 512, color: 0xffffff, multisample: 0,
    shader: { name: 'ConcreteReflection', uniforms: { color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null }, uStrength: { value: cfg.reflectStrength }, uRough: { value: cfg.reflectRough } },
      vertexShader: REFLECT_VS, fragmentShader: REFLECT_FS },
  });
  // Additive on top of the lit floor: dark concrete stays dark, bright things (spots, neon, screen) mirror into it.
  Object.assign(reflector.material, { transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
  reflector.rotation.x = -Math.PI / 2;
  reflector.position.set(15, 0.004, -60);
  reflector.renderOrder = 1;
  world.scene.add(reflector);
  world.onResize((W, H, dpr) => {
    const k = (isMobile() ? cfg.reflectScaleMobile : cfg.reflectScale) * dpr;
    reflector.getRenderTarget().setSize(Math.round(W * k), Math.round(H * k));
  });
  return reflector;
}

/* ───────── rooms: floor, ceiling, walls with door openings ───────── */
function wallMaterial(room) {
  return new THREE.MeshStandardMaterial({ color: room.wall, roughness: 0.92, metalness: 0, emissive: new THREE.Color(room.mood).multiplyScalar(room.moodK) });
}

/** A wall along one axis with an optional rectangular opening. along: 'x' (runs across x at fixed z) or 'z'. */
function addWall(group, mat, { along, fixed, from, to, h, opening }) {
  const T = CONFIG.wallT;
  const piece = (a, b, y0, y1) => {
    if (b - a < 0.01 || y1 - y0 < 0.01) return;
    const len = b - a, mid = (a + b) / 2;
    const geo = along === 'x' ? new THREE.BoxGeometry(len, y1 - y0, T) : new THREE.BoxGeometry(T, y1 - y0, len);
    const m = new THREE.Mesh(geo, mat);
    if (along === 'x') m.position.set(mid, (y0 + y1) / 2, fixed); else m.position.set(fixed, (y0 + y1) / 2, mid);
    m.receiveShadow = true;
    group.add(m);
  };
  const lo = Math.min(from, to), hi = Math.max(from, to);
  if (!opening) { piece(lo, hi, 0, h); return; }
  const c = opening.c ?? 0;
  piece(lo, c - opening.w / 2, 0, h);
  piece(c + opening.w / 2, hi, 0, h);
  piece(c - opening.w / 2, c + opening.w / 2, opening.h, h);
}

function buildRooms(world, floorMap) {
  const T = CONFIG.wallT, groups = {};
  for (const room of CONFIG.rooms) {
    const g = new THREE.Group(); g.name = room.id;
    const [x0, x1] = room.x, [z0, z1] = room.z, w = x1 - x0, d = Math.abs(z1 - z0), cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
    const fm = floorMap.clone(); fm.needsUpdate = true; fm.repeat.set(w / 5, d / 5);
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({ map: fm, roughness: CONFIG.floor.roughness, metalness: 0.05 }));
    floor.rotation.x = -Math.PI / 2; floor.position.set(cx, 0, cz); floor.receiveShadow = true; g.add(floor);
    const ceil = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({ color: room.ceil, roughness: 1 }));
    ceil.rotation.x = Math.PI / 2; ceil.position.set(cx, room.h, cz); g.add(ceil);
    const mat = wallMaterial(room);
    addWall(g, mat, { along: 'x', fixed: z0 - T / 2, from: x0, to: x1, h: room.h, opening: room.front });
    addWall(g, mat, { along: 'x', fixed: z1 + T / 2, from: x0, to: x1, h: room.h, opening: room.back });
    addWall(g, mat, { along: 'z', fixed: x0 + T / 2, from: z0, to: z1, h: room.h });
    addWall(g, mat, { along: 'z', fixed: x1 - T / 2, from: z0, to: z1, h: room.h, opening: room.right && { c: room.right.z, w: room.right.w, h: room.right.h } });
    world.scene.add(g);
    groups[room.id] = g;
  }
  return groups;
}

/* ───────── gallery spotlights with additive light cones ───────── */
const CONE_VS = `
varying vec2 vUv; varying vec3 vN, vV;
void main() { vUv = uv; vec4 mv = modelViewMatrix * vec4(position, 1.); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`;
const CONE_FS = `
uniform vec3 uColor; uniform float uStrength;
varying vec2 vUv; varying vec3 vN, vV;
void main() {
  float t = 1. - vUv.y;                        // 0 at the lamp, 1 at the far end
  // pow() bases are kept above zero: ANGLE computes pow as exp2(y * log2(x)), and log2(0) turned into NaN pixels
  // that the bloom pass then smeared into large black blocks (2026-09-28).
  float along = smoothstep(0., .08, t) * pow(max(1. - t, 1e-4), 1.6);
  float edge = pow(max(abs(dot(vN, vV)), 1e-4), 2.2);   // soft rim: the cone fades where we look along its surface
  gl_FragColor = vec4(uColor * uStrength * along * edge, 1.);
}`;

function addSpot(parent, { pos, target, color = '#fff2df', intensity, angle, penumbra, cone = 0.05, shadow = false, shadowSize = 1024 }) {
  const light = new THREE.SpotLight(color, intensity, 0, angle, penumbra, 2);
  light.position.set(...pos);
  light.target.position.set(...target);
  if (shadow) {
    light.castShadow = true;
    light.shadow.mapSize.set(shadowSize, shadowSize);
    light.shadow.bias = -0.0004; light.shadow.normalBias = 0.02; light.shadow.radius = 6;
    light.shadow.camera.near = 0.5; light.shadow.camera.far = 14;
  }
  parent.add(light, light.target);

  // The lamp body: a short dark can so the cone visibly starts somewhere.
  const can = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.12, 0.26, 16), new THREE.MeshStandardMaterial({ color: '#1b1c20', roughness: 0.5, metalness: 0.6 }));
  const glowDisc = new THREE.Mesh(new THREE.CircleGeometry(0.1, 20), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(4), toneMapped: false }));
  glowDisc.position.y = -0.131; glowDisc.rotation.x = Math.PI / 2;
  can.add(glowDisc);
  const from = new THREE.Vector3(...pos), to = new THREE.Vector3(...target), dir = to.clone().sub(from).normalize();
  can.position.copy(from);
  can.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), dir);
  parent.add(can);

  let mesh = null;
  if (cone > 0) {
    // Stops short of the lit surface: a cone that pierces the wall draws a dotted seam where they meet.
    const L = from.distanceTo(to) * 0.94, r = L * Math.tan(angle * 0.92);
    const geo = new THREE.ConeGeometry(r, L, 40, 1, true);
    geo.translate(0, -L / 2, 0);
    mesh = new THREE.Mesh(geo, new THREE.ShaderMaterial({
      vertexShader: CONE_VS, fragmentShader: CONE_FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
      uniforms: { uColor: { value: new THREE.Color(color) }, uStrength: { value: cone } },
    }));
    mesh.position.copy(from);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), dir);
    mesh.renderOrder = 2;
    parent.add(mesh);
  }
  return { light, cone: mesh, base: intensity };
}

/** Dim metal environment for the sculptures only (walls stay lit by real lamps, not by an environment). */
function metalEnvironment(renderer) {
  const env = new RoomEnvironment(renderer);
  env.traverse((o) => {
    if (!o.isMesh) return;
    if (o.material.isMeshStandardMaterial) { o.material = o.material.clone(); o.material.color.set('#2a1418'); }
    else if (o.material.isMeshBasicMaterial) { o.material = o.material.clone(); o.material.color.multiplyScalar(0.6); }
  });
  const pmrem = new THREE.PMREMGenerator(renderer);
  const tex = pmrem.fromScene(env, 0.02).texture;
  pmrem.dispose();
  return tex;
}

/* ───────── lobby: MUSEUM as a light installation on the far wall, doors that slide open ───────── */
const WORD_FS = `
uniform sampler2D uMap; uniform float uEdge[7]; uniform float uOn[6]; uniform vec3 uGlow; uniform float uGain;
varying vec2 vUv;
void main() {
  float on = 0.;
  for (int i = 0; i < 6; i++) { if (vUv.x >= uEdge[i] && vUv.x < uEdge[i + 1]) on = uOn[i]; }
  vec2 s = texture2D(uMap, vUv).rg;            // r: the tube, g: its halo
  vec3 tube = mix(uGlow, vec3(1.), .55) * s.r * uGain;
  vec3 halo = uGlow * s.g * .55;
  gl_FragColor = vec4((tube + halo) * on, 1.);
}`;
const WORD_VS = `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`;

/** Draws the word as neon tubes: red channel is the sharp tube, green is a wide blurred halo. Returns letter edges in uv. */
function neonWordTexture(word, font) {
  const c = document.createElement('canvas');
  c.width = 2048; c.height = 520;
  const g = c.getContext('2d');
  g.font = font;
  const widths = [...word].map((ch) => g.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0);
  const scale = Math.min(1, (c.width * 0.9) / total);
  g.setTransform(scale, 0, 0, scale, (c.width - total * scale) / 2, c.height / 2);
  g.textBaseline = 'middle'; g.lineJoin = 'round'; g.lineCap = 'round';
  const pass = (color, lw, blur) => {
    g.globalCompositeOperation = 'lighter';
    g.strokeStyle = color; g.lineWidth = lw; g.shadowColor = color; g.shadowBlur = blur;
    let x = 0;
    [...word].forEach((ch, i) => { g.strokeText(ch, x, 0); x += widths[i]; });
  };
  g.fillStyle = '#000'; g.fillRect(-1e4, -1e4, 2e4, 2e4);
  pass('rgb(0,255,0)', 34, 60);
  pass('rgb(0,160,0)', 20, 22);
  pass('rgb(255,0,0)', 9, 0);
  const x0 = (c.width - total * scale) / 2;
  const edges = [0];
  let acc = 0;
  widths.forEach((w, i) => { acc += w * scale; edges.push(i === widths.length - 1 ? 1 : (x0 + acc) / c.width); });
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return { tex, edges, aspect: c.height / c.width };
}

function initLobby(world) {
  const cfg = CONFIG.lobby, room = roomById('lobby'), g = new THREE.Group();
  world.scene.add(g);

  const { tex, edges, aspect } = neonWordTexture(cfg.word, cfg.font);
  if (edges.length !== 7) throw new Error('lobby word must have six letters for the per-letter switch');
  const on = new Array(6).fill(reduce ? 1 : 0);
  const glow = new THREE.Vector3(...cfg.glow);
  const word = new THREE.Mesh(new THREE.PlaneGeometry(cfg.wordWidth, cfg.wordWidth * aspect), new THREE.ShaderMaterial({
    vertexShader: WORD_VS, fragmentShader: WORD_FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uMap: { value: tex }, uEdge: { value: edges }, uOn: { value: on }, uGlow: { value: glow }, uGain: { value: cfg.glowGain } },
  }));
  word.position.set(0, cfg.wordY, cfg.wallZ + 0.05);
  g.add(word);
  // The installation lights its own wall and floor.
  const wash = new THREE.PointLight('#8fa6ff', 0, 22, 2);
  wash.position.set(0, cfg.wordY - 0.6, cfg.wallZ + 2.2);
  g.add(wash);
  const WASH = 26;

  // Grazing lamps either side of the word.
  [-1, 1].forEach((s) => addSpot(g, { pos: [s * 5.6, room.h - 0.2, -11.5], target: [s * 3.6, 4.4, cfg.wallZ], color: '#cfd9ff', intensity: 38, angle: 0.34, penumbra: 0.9, cone: 0.035 }));
  // Ceiling light strips, dim, so the lobby has a ceiling line in the dark.
  const stripMat = new THREE.MeshBasicMaterial({ color: new THREE.Color('#9fb2ff').multiplyScalar(1.4), toneMapped: false });
  for (let i = 0; i < cfg.strips; i++) {
    const z = -2.5 - i * 2.6;
    const strip = new THREE.Mesh(new THREE.BoxGeometry(9, 0.04, 0.08), stripMat);
    strip.position.set(0, room.h - 0.03, z);
    g.add(strip);
  }
  // Benches.
  const benchMat = new THREE.MeshStandardMaterial({ color: '#1d2233', roughness: 0.6, metalness: 0.2 });
  [-1, 1].forEach((s) => {
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.45, 3.2), benchMat);
    b.position.set(s * 4.4, 0.225, -8.5); b.castShadow = true; b.receiveShadow = true;
    g.add(b);
  });

  // Doors: two dark glass panels in the far-wall opening, with a seam of gallery light between them.
  const doorMat = new THREE.MeshStandardMaterial({ color: '#0b1022', roughness: 0.18, metalness: 0.75 });
  const doorZ = room.z[1] + CONFIG.wallT + 0.04;
  const doors = [-1, 1].map((s) => {
    const d = new THREE.Mesh(new THREE.BoxGeometry(cfg.doorW, cfg.doorH, 0.06), doorMat);
    d.position.set(s * cfg.doorW / 2, cfg.doorH / 2, doorZ);
    g.add(d);
    return d;
  });
  const seam = new THREE.Mesh(new THREE.PlaneGeometry(0.03, cfg.doorH), new THREE.MeshBasicMaterial({ color: new THREE.Color('#fff4e2').multiplyScalar(3), toneMapped: false, transparent: true }));
  seam.position.set(0, cfg.doorH / 2, doorZ + 0.04);
  g.add(seam);

  const start = performance.now();
  const rnd = mulberry32(21);
  const order = [0, 1, 2, 3, 4, 5].map((i) => ({ i, at: 0.25 + i * 0.22 + rnd() * 0.1 }));
  return {
    update(u, time) {
      const secs = (performance.now() - start) / 1000;
      let lit = 0;
      for (const { i, at } of order) {
        // Letters switch on one by one after load, stuttering like a starter until they hold.
        const k = reduce ? 1 : clamp01((secs - at) / 0.5);
        const stutter = k > 0 && k < 1 ? (Math.sin(time * 70 + i * 13) > 0.1 ? 1 : 0.15) : k;
        on[i] = stutter; lit += on[i];
      }
      wash.intensity = WASH * (lit / 6);
      const open = reduce ? (u > 0.5 ? 1 : 0) : smooth(seg(u, ...cfg.doorOpen));
      doors.forEach((d, j) => { d.position.x = (j ? 1 : -1) * (cfg.doorW / 2 + open * (cfg.doorW - 0.05)); });
      seam.material.opacity = 1 - open;
      // Groups holding lights are never hidden: a changed light count recompiles every material mid-walk.
    },
  };
}

/* ───────── painting hall: framed works lit by ceiling spots ───────── */
function initPaintings(world, textures) {
  const cfg = CONFIG.paint, room = roomById('paint'), g = new THREE.Group();

    const tex = textures[p.key];
    if (!tex) throw new Error(`painting texture ${p.key} is missing`);
    tex.anisotropy = 8;
    const aspect = tex.image.width / tex.image.height;
    const h = p.h, w = h * aspect;
    const art = new THREE.Group();
    art.position.set(wallIn(p.side) - p.side * (cfg.frameD / 2 + 0.01), cfg.centerY, p.z);
    art.rotation.y = -p.side * Math.PI / 2;                     // left wall faces +x, right wall faces -x
    g.add(art);

    const canvasMesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.82, metalness: 0 }));
    canvasMesh.position.z = cfg.frameD / 2 - 0.012;
    art.add(canvasMesh);
    const fw = cfg.frameW, fd = cfg.frameD;
    const frameMat = new THREE.MeshStandardMaterial({ color: p.frame, roughness: 0.45, metalness: 0.15 });
    [[w + 2 * fw, fw, 0, h / 2 + fw / 2], [w + 2 * fw, fw, 0, -h / 2 - fw / 2], [fw, h, -w / 2 - fw / 2, 0], [fw, h, w / 2 + fw / 2, 0]].forEach(([bw, bh, x, y]) => {
      const bar = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, fd), frameMat);
      bar.position.set(x, y, 0); bar.castShadow = true;
      art.add(bar);
    });
    // A small printed placard to the viewer's right, as in a real hall.
    const plaque = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.13, 0.01), new THREE.MeshStandardMaterial({ color: '#f4f6f9', roughness: 0.7 }));
    plaque.position.set(w / 2 + fw + 0.34, 1.42 - cfg.centerY, -fd / 2 + 0.005);
    art.add(plaque);

    const lampX = wallIn(p.side) - p.side * cfg.spotOut;
    addSpot(g, { pos: [lampX, room.h - 0.2, p.z], target: [wallIn(p.side), cfg.centerY - 0.05, p.z], intensity: cfg.spot, angle: cfg.spotAngle, penumbra: cfg.penumbra, cone: cfg.cone });
    views.push({ ...p, w, h });
  }
  // Ceiling tracks the lamps hang from.
  const trackMat = new THREE.MeshStandardMaterial({ color: '#1a1b1f', roughness: 0.4, metalness: 0.6 });
  [-1, 1].forEach((s) => {
    const t = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, Math.abs(room.z[1] - room.z[0]) - 1), trackMat);
    t.position.set(wallIn(s) - s * cfg.spotOut, room.h - 0.06, (room.z[0] + room.z[1]) / 2);

}

/* ── src/40-sculpture.js ── */
/* ───────── sculpture room: procedural works on plinths, shadow-casting spots ───────── */
/** A flat steel ribbon twisted about its axis and bent slightly, displaced once on the CPU. */
function twistGeometry() {
  const H = 1.9, geo = new THREE.BoxGeometry(0.62, H, 0.12, 12, 220, 2), p = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const t = v.y / H + 0.5, a = t * 3.6, c = Math.cos(a), s = Math.sin(a);
    const taper = 1 - 0.35 * Math.abs(t - 0.45);
    const x = v.x * taper, z = v.z;
    p.setXYZ(i, x * c - z * s + 0.1 * Math.sin(v.y * 1.8), v.y, x * s + z * c);
  }
  geo.computeVertexNormals();
  return geo;
}

/** A breathing marble pebble: a merged sphere pushed out by layered sines and pinched at the waist. */
function marbleGeometry() {
  const geo = mergeVertices(new THREE.IcosahedronGeometry(0.5, 40)), p = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const n = v.clone().normalize();
    const f = 0.16 * Math.sin(2.1 * n.x * 3 + 0.4) * Math.sin(1.7 * n.y * 3 + 1.1) * Math.sin(2.3 * n.z * 3)
      + 0.08 * Math.sin(4.3 * n.x + 1.7 * n.y * 3) + 0.05 * Math.sin(5.1 * n.z - 3.2 * n.y + 0.7);
    const pinch = 1 - 0.2 * Math.exp(-(((n.y + 0.1) * 2.6) ** 2));
    const r = 0.5 * (1 + f) * pinch;
    p.setXYZ(i, n.x * r, n.y * r * 1.5, n.z * r);
  }
  geo.computeVertexNormals();
  return geo;
}

function marbleMaterial(env) {
  const m = new THREE.MeshPhysicalMaterial({ color: '#f1f3f6', roughness: 0.32, metalness: 0, clearcoat: 0.35, clearcoatRoughness: 0.4, envMap: env, envMapIntensity: 0.35 });
  m.onBeforeCompile = (s) => {
    s.vertexShader = s.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vObj;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvObj = position;');
    s.fragmentShader = s.fragmentShader.replace('#include <common>', `#include <common>\nvarying vec3 vObj;\n${SNOISE}`)
      .replace('#include <map_fragment>', `#include <map_fragment>
        float vn = snoise(vObj * 2.4) + .5 * snoise(vObj * 5.3);
        float vein = 1. - smoothstep(0., .07, abs(sin(vObj.y * 5. + vObj.x * 2.4 + vn * 2.3)));
        float fine = 1. - smoothstep(0., .03, abs(sin(vObj.z * 11. + vn * 4.)));
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(.36, .39, .47), vein * .75 + fine * .18);`);
  };
  return m;
}

function initSculptures(world, env) {
  const cfg = CONFIG.sculpt, room = roomById('sculpt'), g = new THREE.Group();
  world.scene.add(g);
  const plinthMat = new THREE.MeshStandardMaterial({ color: cfg.plinthColor, roughness: 0.8 });
  const [pw, ph, pd] = cfg.plinth;
  const makers = {
    twist: () => ({ geo: twistGeometry(), mat: new THREE.MeshStandardMaterial({ color: '#a9afb9', metalness: 1, roughness: 0.42, envMap: env, envMapIntensity: 0.55 }), y: 0.97 }),
    marble: () => ({ geo: marbleGeometry(), mat: marbleMaterial(env), y: 0.74 }),
    knot: () => ({ geo: new THREE.TorusKnotGeometry(0.4, 0.12, 300, 36, 2, 5), mat: new THREE.MeshStandardMaterial({ color: '#b07a45', metalness: 1, roughness: 0.34, envMap: env, envMapIntensity: 1.2 }), y: 0.72 }),
  };
  const works = CONFIG.sculptures.map((s, i) => {
    const maker = makers[s.kind];
    if (!maker) throw new Error(`unknown sculpture kind ${s.kind}`);
    const plinth = new THREE.Mesh(new THREE.BoxGeometry(pw, ph, pd), plinthMat);
    plinth.position.set(s.x, ph / 2, s.z); plinth.castShadow = true; plinth.receiveShadow = true;
    g.add(plinth);
    const { geo, mat, y } = maker();
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(s.x, ph + y, s.z); mesh.castShadow = true; mesh.receiveShadow = true;
    g.add(mesh);
    addSpot(g, { pos: [s.x + 1.1, room.h - 0.2, s.z + 1.9], target: [s.x, ph + 0.5, s.z], intensity: cfg.spot, angle: cfg.spotAngle, penumbra: cfg.penumbra, cone: cfg.cone,
      shadow: true, shadowSize: isMobile() ? CONFIG.render.shadowMapMobile : CONFIG.render.shadowMap, color: '#fff0e0' });
    return { mesh, phase: i * 2.1 };
  });
  return {
    update(u, time) {
      if (reduce) return;
      for (const w of works) w.mesh.rotation.y = w.phase + time * cfg.spin + u * 0.8;
    },
  };
}

/* ── src/50-lights.js ── */
/* ───────── light room: a hyperboloid of laser strings that winds tighter with walking speed ───────── */
const BEAM_VS = `
varying vec3 vN, vV; varying float vY;
void main() { vY = uv.y; vec4 mv = modelViewMatrix * vec4(position, 1.); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`;
const BEAM_FS = `
uniform vec3 uColor; uniform float uGain, uTime, uPhase;
varying vec3 vN, vV; varying float vY;
void main() {
  float core = pow(max(abs(dot(vN, vV)), 1e-4), 3.);                          // bright centre line, soft sides
  float pulse = .8 + .2 * sin(vY * 40. - uTime * 3. + uPhase);      // light travelling down the string
  gl_FragColor = vec4(uColor * uGain * core * pulse, 1.);
}`;

function initLightRoom(world) {
  const cfg = CONFIG.lights, room = roomById('light'), g = new THREE.Group();
  world.scene.add(g);
  const [cx, cz] = cfg.center;
  const palette = cfg.colors.map((c) => new THREE.Color(c));
  const up = new THREE.Vector3(0, 1, 0);

  const beamGeo = new THREE.CylinderGeometry(cfg.width, cfg.width, 1, 8, 1, true);
  const dotGeo = new THREE.CircleGeometry(0.07, 16);
  const beams = [];
  for (let i = 0; i < cfg.beams; i++) {
    const mat = new THREE.ShaderMaterial({
      vertexShader: BEAM_VS, fragmentShader: BEAM_FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: { uColor: { value: palette[i % palette.length].clone() }, uGain: { value: cfg.gain }, uTime: { value: 0 }, uPhase: { value: i * 0.7 } },
    });
    const beam = new THREE.Mesh(beamGeo, mat);
    const dot = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({ color: palette[i % palette.length].clone().multiplyScalar(1.4), toneMapped: false, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    dot.rotation.x = -Math.PI / 2;
    g.add(beam, dot);
    beams.push({ beam, dot, mat, a: (i / cfg.beams) * Math.PI * 2 });
  }
  // Rings the strings hang between.
  const ringMat = new THREE.MeshBasicMaterial({ color: new THREE.Color('#aab8ff').multiplyScalar(1.3), toneMapped: false });
  const topRing = new THREE.Mesh(new THREE.TorusGeometry(cfg.ringTop, 0.025, 8, 160), ringMat);
  topRing.rotation.x = Math.PI / 2; topRing.position.set(cx, cfg.top, cz);
  g.add(topRing);
  // A faint violet wash so the dark room still has walls and a floor.
  const wash = new THREE.PointLight('#7b5cff', 18, 20, 2);
  wash.position.set(cx, 3.5, cz);
  g.add(wash);
  // Picture-rail glow lines along the side walls, low and dim.
  const railMat = new THREE.MeshBasicMaterial({ color: new THREE.Color('#5a46ff').multiplyScalar(1.3), toneMapped: false });
  [-1, 1].forEach((s) => {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, Math.abs(room.z[1] - room.z[0]) - 2), railMat);
    rail.position.set(s * (room.x[1] - CONFIG.wallT - 0.02), 0.25, cz);
    g.add(rail);
  });

  let vel = 0;
  const from = new THREE.Vector3(), to = new THREE.Vector3(), dir = new THREE.Vector3();
  function pose(u, time) {
    const local = clamp01(u - 3);
    const spin = reduce ? 0.6 : time * cfg.spin;
    const twist = cfg.twist + local * 1.1 + vel * 2.4;
    const hueShift = reduce ? 0 : vel * 2 + time * 0.05;
    beams.forEach((b, i) => {
      const a0 = b.a + spin, a1 = a0 + twist;
      from.set(cx + Math.cos(a0) * cfg.ringTop, cfg.top, cz + Math.sin(a0) * cfg.ringTop);
      to.set(cx + Math.cos(a1) * cfg.ringBottom, 0.02, cz + Math.sin(a1) * cfg.ringBottom);
      dir.subVectors(to, from);
      const len = dir.length();
      b.beam.position.addVectors(from, to).multiplyScalar(0.5);
      b.beam.quaternion.setFromUnitVectors(up, dir.normalize());
      b.beam.scale.set(1, len, 1);
      b.dot.position.copy(to).setY(0.012);
      const c = (i / palette.length + hueShift) % palette.length, k = Math.floor(c), f = c - k;
      b.mat.uniforms.uColor.value.copy(palette[k % palette.length]).lerp(palette[(k + 1) % palette.length], f);
      b.mat.uniforms.uGain.value = cfg.gain * (1 + vel * 1.5);
      b.mat.uniforms.uTime.value = time;
    });
  }
  pose(3, 0);
  return {
    update(u, time) {
      if (u < 2.3 || u > 4.6) return;          // not visible from further away
      const target = clamp(Math.abs(velocity()) * cfg.twistVel, 0, 1);
      vel += (target - vel) * cfg.velEase;
      pose(u, time);
    },
  };
}

/* ── src/60-video.js ── */
/* ───────── video room: a projected screen with a projector beam ───────── */
// Over http the screen is a VideoTexture. On file:// a video frame taints the canvas, so the screen keeps the poster
// (inlined by build.mjs) and says so in the console. Reduced motion also keeps the poster.
function initVideoRoom(world, textures) {
  const cfg = CONFIG.videoRoom, room = roomById('video'), g = new THREE.Group();
  world.scene.add(g);
  const poster = textures.poster;
  const aspect = poster.image.width / poster.image.height;
  const W = cfg.screenW, H = W / aspect;
  const screenMat = new THREE.MeshBasicMaterial({ map: poster, color: new THREE.Color(cfg.gain, cfg.gain, cfg.gain) });
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(W, H), screenMat);
  screen.position.set(0, cfg.screenY, cfg.screenZ);
  g.add(screen);
  // A thin black border reads as a projection surface.
  const border = new THREE.Mesh(new THREE.PlaneGeometry(W + 0.16, H + 0.16), new THREE.MeshBasicMaterial({ color: '#000' }));
  border.position.set(0, cfg.screenY, cfg.screenZ - 0.01);
  g.add(border);

  // Projector beam: a four-sided frustum from the back wall to the screen, additive and faint.
  const proj = new THREE.Vector3(0, room.h - 0.5, room.z[0] - 0.6);
  const L = proj.distanceTo(screen.position);
  const beamGeo = new THREE.CylinderGeometry(0.04, 1, L, 4, 1, true);
  beamGeo.rotateY(Math.PI / 4); beamGeo.translate(0, -L / 2, 0);
  const beam = new THREE.Mesh(beamGeo, new THREE.ShaderMaterial({
    vertexShader: CONE_VS, fragmentShader: CONE_FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    uniforms: { uColor: { value: new THREE.Color('#8fc7ff') }, uStrength: { value: 0.07 } },
  }));
  beam.position.copy(proj);
  beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), screen.position.clone().sub(proj).normalize());
  beam.scale.set((W / 2) * Math.SQRT2, 1, (H / 2) * Math.SQRT2);
  beam.renderOrder = 2;
  g.add(beam);
  // Spill from the screen onto the floor and the benches.
  const spill = new THREE.PointLight('#5f8dff', 16, 18, 2);
  spill.position.set(0, 2.2, cfg.screenZ + 2);
  g.add(spill);
  const benchMat = new THREE.MeshStandardMaterial({ color: '#10383e', roughness: 0.7 });
  [-1, 1].forEach((s) => {
    const b = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.42, 0.6), benchMat);
    b.position.set(s * 2.6, 0.21, -99.5); b.castShadow = true; b.receiveShadow = true;
    g.add(b);
  });

  let video = null, playing = false;
  if (reduce) {
    // Poster only.
  } else if (location.protocol === 'file:') {
    console.warn('MUSEUM: file:// cannot upload video frames to WebGL (tainted canvas), the screen shows the poster still.');
  } else {
    video = document.createElement('video');
    Object.assign(video, { muted: true, loop: true, playsInline: true, preload: 'none', crossOrigin: 'anonymous' });
    video.setAttribute('muted', ''); video.setAttribute('playsinline', '');
    video.src = CONFIG.video;
    video.addEventListener('error', () => console.error('MUSEUM: video failed to load', CONFIG.video, video.error));
    const vt = new THREE.VideoTexture(video);
    vt.colorSpace = THREE.SRGBColorSpace;
    video.addEventListener('playing', () => { screenMat.map = vt; screenMat.needsUpdate = true; }, { once: true });
  }
  return {
    update(u) {
      if (!video) return;
      const want = u >= cfg.playU[0] && u <= cfg.playU[1] && !document.hidden;
      if (want === playing) return;
      playing = want;
      if (want) video.play().catch((e) => { playing = false; console.error('MUSEUM: video play() was refused', e); });
      else video.pause();
    },
  };
}

/* ── src/70-exit.js ── */
/* ───────── exit: glass doors, a terrace, lamps, hills and the night sky ───────── */
const SKY_VS = `varying vec3 vDir; void main() { vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.); gl_Position = p.xyww; }`;
const SKY_FS = `
uniform vec3 uMoon; uniform float uTime;
varying vec3 vDir;
${HASH}
float star(vec3 d, float scale, float thresh) {
  vec3 c = floor(d * scale); vec3 f = fract(d * scale) - .5;
  float h = hash12(c.xy + c.z * 17.13);
  if (h < thresh) return 0.;
  float tw = .65 + .35 * sin(uTime * (1. + h * 3.) + h * 40.);
  return smoothstep(.16, 0., length(f)) * (h - thresh) / (1. - thresh) * tw;
}
void main() {
  vec3 d = normalize(vDir);
  float y = max(d.y, 0.);
  vec3 col = mix(vec3(.05, .07, .16), vec3(.004, .007, .022), pow(max(y, 1e-4), .45));
  col += vec3(.2, .1, .34) * exp(-y * 9.) * .5;                              // violet dusk band on the horizon
  // A tilted milky band.
  vec3 axis = normalize(vec3(.3, .75, .58));
  float bx = dot(d, axis) * 3.2;
  float band = exp(-bx * bx);                     // not pow(): a negative base is NaN in GLSL and bloom spreads it into black blocks
  float neb = fbm(vec2(atan(d.z, d.x) * 3., d.y * 6.) + 3.1);
  col += vec3(.16, .17, .3) * band * neb * .7;
  float s = star(d, 150., .985) * 1.4 + star(d, 330., .992) * .9 + band * star(d, 520., .97) * .6;
  col += vec3(.85, .9, 1.) * s * smoothstep(-.02, .12, d.y);
  // Moon: a lit disc with a soft halo.
  float m = dot(d, normalize(uMoon));
  col += vec3(.55, .62, .85) * pow(max(m, 1e-4), 900.) * .9 + vec3(.25, .3, .5) * pow(max(m, 1e-4), 60.) * .35;
  col += vec3(1.6, 1.62, 1.7) * smoothstep(.99955, .99972, m);
  gl_FragColor = vec4(col, 1.);
}`;

function initExit(world) {
  const cfg = CONFIG.exit, room = roomById('video'), g = new THREE.Group();
  world.scene.add(g);
  const moon = new THREE.Vector3(...cfg.moonDir).normalize();

  const sky = new THREE.Mesh(new THREE.SphereGeometry(cfg.sky, 48, 24), new THREE.ShaderMaterial({
    vertexShader: SKY_VS, fragmentShader: SKY_FS, side: THREE.BackSide, depthWrite: false,
    uniforms: { uMoon: { value: moon }, uTime: { value: 0 } },
  }));
  sky.renderOrder = -1; sky.frustumCulled = false;
  g.add(sky);
  // Moonlight for the terrace (the only directional light, dim and cold).
  const moonLight = new THREE.DirectionalLight('#9fb4ff', 0.5);
  moonLight.position.copy(moon).multiplyScalar(60).add(new THREE.Vector3(20, 0, -97));
  moonLight.target.position.set(20, 0, -97);
  g.add(moonLight, moonLight.target);

  // Terrace ground, just below the room floors so they never fight.
  const groundTex = concreteTexture();
  groundTex.repeat.set(80, 80);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: '#4b5160', map: groundTex, roughness: 0.55 }));
  ground.rotation.x = -Math.PI / 2; ground.position.set(20, -0.03, -97); ground.receiveShadow = true;
  g.add(ground);

  // Hills: a jagged ring of near-black silhouettes around the terrace.
  const rnd = mulberry32(99), N = cfg.hills, R = 240, pos = [];
  const heights = Array.from({ length: N + 1 }, (_, i) => 10 + 26 * Math.abs(Math.sin(i * 0.19) * Math.sin(i * 0.071 + 1)) + rnd() * 6);
  heights[N] = heights[0];
  for (let i = 0; i < N; i++) {
    const a0 = (i / N) * Math.PI * 2, a1 = ((i + 1) / N) * Math.PI * 2;
    const p = (a, h) => [20 + Math.cos(a) * R, h, -97 + Math.sin(a) * R];
    pos.push(...p(a0, -2), ...p(a1, -2), ...p(a1, heights[i + 1]), ...p(a0, -2), ...p(a1, heights[i + 1]), ...p(a0, heights[i]));
  }
  const hillGeo = new THREE.BufferGeometry();
  hillGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.add(new THREE.Mesh(hillGeo, new THREE.MeshBasicMaterial({ color: '#070a16', side: THREE.DoubleSide })));

  // Path lamps: glowing heads with a light pool painted on the ground.
  const poolTex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const x = c.getContext('2d'), gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  })();
  const postMat = new THREE.MeshStandardMaterial({ color: '#191b21', roughness: 0.5, metalness: 0.5 });
  const headMat = new THREE.MeshBasicMaterial({ color: new THREE.Color('#ffd9a8').multiplyScalar(3), toneMapped: false });
  for (let i = 0; i < cfg.lamps; i++) {
    const x = 12 + i * 5.5, z = -97 + (i % 2 ? 3.2 : -3.2);
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 3, 8), postMat);
    post.position.set(x, 1.5, z);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), headMat);
    head.position.set(x, 3.05, z);
    const pool = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.MeshBasicMaterial({ map: poolTex, color: new THREE.Color('#ffcf94').multiplyScalar(0.28), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    pool.rotation.x = -Math.PI / 2; pool.position.set(x, 0.006, z);
    g.add(post, head, pool);
  }

  // Exit doors: two glass panels in the video room's right wall that slide apart.
  const d = room.right, wallX = room.x[1] - CONFIG.wallT - 0.04;
  const glassMat = new THREE.MeshStandardMaterial({ color: '#8fb0d8', roughness: 0.05, metalness: 0.2, transparent: true, opacity: 0.18, depthWrite: false });
  const frameMat = new THREE.MeshStandardMaterial({ color: '#c8ccd4', roughness: 0.3, metalness: 0.9 });
  const panels = [-1, 1].map((s) => {
    const p = new THREE.Group();
    const glass = new THREE.Mesh(new THREE.BoxGeometry(0.03, d.h, d.w / 2), glassMat);
    const edge = new THREE.Mesh(new THREE.BoxGeometry(0.05, d.h, 0.05), frameMat);
    edge.position.z = -s * d.w / 4;
    p.add(glass, edge);
    p.position.set(wallX, d.h / 2, d.z + s * d.w / 4);
    g.add(p);
    return { p, s };
  });

  return {
    update(u, time) {
      sky.material.uniforms.uTime.value = reduce ? 0 : time;
      const open = reduce ? (u > 4.75 ? 1 : 0) : smooth(seg(u, 4.62, 4.86));
      panels.forEach(({ p, s }) => { p.position.z = d.z + s * (d.w / 4 + open * (d.w / 2 - 0.08)); });
    },
  };
}

/* ── src/80-path.js ── */
/* ───────── the walk: keys in path units u (room index + progress), cubic Hermite in time ───────── */
// A hold becomes two stop keys with zero velocity, so the camera eases in, stands still, then eases out.
// Pass keys get Catmull-Rom tangents so walking between holds never jerks at a doorway.
// label: wall text shown while standing at that hold.
function walkEntries() {
  const e = CONFIG.eye, P = CONFIG.paintings, S = CONFIG.sculptures, L = CONFIG.lights, V = CONFIG.videoRoom;
  const paintView = (p) => ({ pos: [p.side * 0.85, e, p.z], look: [p.side * 4.7, CONFIG.paint.centerY - 0.04, p.z] });
  const paintHolds = [[1.06, 1.17], [1.22, 1.33], [1.38, 1.49], [1.54, 1.65], [1.7, 1.81], [1.86, 1.93]];
  const moon = new THREE.Vector3(...CONFIG.exit.moonDir).normalize();
  const endPos = [19, 1.5, -98];
  const endLook = new THREE.Vector3(...endPos).addScaledVector(moon, 30).add(new THREE.Vector3(0, -6, 0));
  return [
    { hold: [0, 0.12], pos: [0, e, -1.2], look: [0, 4.5, -15.8] },
    { u: 0.27, pos: [0.5, e, -5.2], look: [0, 4.1, -15.8] },
    { hold: [0.38, 0.6], pos: [0, e, -8.6], look: [0, 2.9, -15.8] },
    { u: 0.8, pos: [0, e, -13.4], look: [0, 1.9, -24] },
    { u: 0.98, pos: [0, e, -18.4], look: [-2.2, 1.7, -24] },
    ...P.map((p, i) => ({ hold: paintHolds[i], ...paintView(p), label: p })),
    // Turn to face the doorway before passing it, so the view never fills with the door jamb.
    { u: 1.97, pos: [0.2, e, -49], look: [0, 1.7, -60] },
    { u: 2.03, pos: [-0.3, e, -52.6], look: [-2, 1.6, -58] },
    { hold: [2.1, 2.24], pos: [S[0].x + 2.3, 1.55, S[0].z + 2.7], look: [S[0].x, 1.75, S[0].z], label: S[0] },
    { hold: [2.34, 2.48], pos: [S[1].x - 2.3, 1.55, S[1].z + 2.3], look: [S[1].x, 1.6, S[1].z], label: S[1] },
    // Diagonal view of the knot: straight on, the lit laser room sits in the doorway behind it.
    { hold: [2.58, 2.72], pos: [S[2].x - 2.5, e, S[2].z + 2.4], look: [S[2].x, 1.6, S[2].z], label: S[2] },
    { u: 2.86, pos: [-1.6, e, -67.4], look: [0, 2.4, -80] },
    { u: 3.0, pos: [0, e, -71.2], look: [0, 2.6, -80] },
    { hold: [3.08, 3.2], pos: [0, e, -73.6], look: [0, 3.2, -80], label: L },
    { u: 3.36, pos: [-5, 1.5, -77], look: [0, 3.3, -80] },
    { hold: [3.5, 3.66], pos: [0, 1.4, -80], look: [0.4, 7, -80.7] },
    { u: 3.8, pos: [5.3, e, -84.6], look: [0, 2.8, -80] },
    { u: 4.0, pos: [0, e, -91.4], look: [0, 3, -106] },
    { hold: [4.12, 4.6], pos: [0, 1.55, -95], look: [0, 3.1, -106], label: V },
    { u: 4.76, pos: [1.6, e, -97.1], look: [8, 1.8, -97] },
    { u: 5.0, pos: [6.4, e, -97], look: [14, 1.9, -97] },
    { u: 5.24, pos: [11, e, -97], look: [22, 3, -99] },
    { hold: [5.45, 5.6], pos: [16, e, -97.5], look: [40, 6, -106] },
    { hold: [5.78, 6], pos: endPos, look: endLook.toArray() },
  ];
}

/** View angles from a position toward a look point. Camera rotation order is YXZ: yaw about y, then pitch. */
function viewAngles(pos, look) {
  const d = look.clone().sub(pos);
  return new THREE.Vector3(Math.atan2(-d.x, -d.z), Math.atan2(d.y, Math.hypot(d.x, d.z)), 0);
}

function createWalk() {
  const keys = [];
  const holds = [];
  for (const en of walkEntries()) {
    const pos = new THREE.Vector3(...en.pos), ang = viewAngles(pos, new THREE.Vector3(...en.look));
    if (en.hold) {
      keys.push({ u: en.hold[0], pos, ang, stop: true }, { u: en.hold[1], pos, ang, stop: true });
      holds.push({ u0: en.hold[0], u1: en.hold[1], pos, ang, label: en.label ?? null });
    } else keys.push({ u: en.u, pos, ang, stop: false });
  }
  keys.forEach((k, i) => { if (i && k.u <= keys[i - 1].u) throw new Error(`walk keys out of order at u=${k.u}`); });
  // The view is interpolated as angles, not as a look point: a look point swept from one wall to the other
  // passes through the camera and lookAt() flips to the ceiling (seen 2026-09-28 between two paintings).
  // Yaw is unwrapped so every turn takes the short way round.
  for (let i = 1; i < keys.length; i++) {
    const prev = keys[i - 1].ang.x, a = keys[i].ang.clone();
    while (a.x - prev > Math.PI) a.x -= Math.PI * 2;
    while (a.x - prev < -Math.PI) a.x += Math.PI * 2;
    keys[i].ang = a;
  }
  // Tangents per unit u.
  for (let i = 0; i < keys.length; i++) {
    const k = keys[i];
    if (k.stop || i === 0 || i === keys.length - 1) { k.mp = new THREE.Vector3(); k.ma = new THREE.Vector3(); continue; }
    const a = keys[i - 1], b = keys[i + 1], du = b.u - a.u;
    k.mp = b.pos.clone().sub(a.pos).divideScalar(du);
    k.ma = b.ang.clone().sub(a.ang).divideScalar(du);
  }
  const herm = (out, p0, m0, p1, m1, dt, s) => {
    const s2 = s * s, s3 = s2 * s;
    return out.copy(p0).multiplyScalar(2 * s3 - 3 * s2 + 1).addScaledVector(m0, (s3 - 2 * s2 + s) * dt)
      .addScaledVector(p1, -2 * s3 + 3 * s2).addScaledVector(m1, (s3 - s2) * dt);
  };
  const pos = new THREE.Vector3(), ang = new THREE.Vector3();
  const view = () => ({ pos, yaw: ang.x, pitch: ang.y });
  function at(u) {
    const last = keys[keys.length - 1];
    if (u <= keys[0].u) { pos.copy(keys[0].pos); ang.copy(keys[0].ang); return view(); }
    if (u >= last.u) { pos.copy(last.pos); ang.copy(last.ang); return view(); }
    let i = 0;
    while (keys[i + 1].u < u) i++;
    const a = keys[i], b = keys[i + 1], dt = b.u - a.u, s = (u - a.u) / dt;
    herm(pos, a.pos, a.mp, b.pos, b.mp, dt, s);
    herm(ang, a.ang, a.ma, b.ang, b.ma, dt, s);
    return view();
  }
  /** Reduced motion: still views only. The view of the latest hold reached (or the first). */
  function still(u) {
    let h = holds[0];
    for (const x of holds) if (u >= x.u0 - 0.04) h = x;
    pos.copy(h.pos); ang.copy(h.ang);
    return view();
  }
  return { at, still, holds };
}

/* ── src/85-hud.js ── */
/* ───────── overlay: intro line, room words, wall labels, the way out ───────── */
function createHud(holds) {
  const intro = $('#intro'), cue = $('#cue'), word = $('#room-word'), label = $('#label'), title = $('#label-title'), meta = $('#label-meta');
  const fin = $('#fin'), magnet = $('#magnet'), magnetText = magnet.querySelector('span');
  const labelled = holds.filter((h) => h.label);
  const LABEL_EDGE = 0.022;
  const show = (el, k, dy = 0) => { el.style.opacity = k.toFixed(3); el.style.transform = dy ? `translateY(${((1 - k) * dy).toFixed(1)}px)` : ''; };
  const pick = (u, k) => (reduce ? (k > 0.001 ? 1 : 0) : k);
  let wordText = '', labelKey = null, finOn = null;

  // Magnetic button: pulls toward the pointer inside a radius, the label inside moves less.
  const mag = { x: 0, y: 0, tx: 0, ty: 0 };
  const RADIUS = 150, PULL = 0.38, INNER = 0.45;
  addEventListener('pointermove', (e) => {
    const r = magnet.getBoundingClientRect(), cx = r.left + r.width / 2 - mag.x, cy = r.top + r.height / 2 - mag.y;
    const dx = e.clientX - cx, dy = e.clientY - cy, near = Math.hypot(dx, dy) < RADIUS && finOn;
    mag.tx = near ? dx * PULL : 0; mag.ty = near ? dy * PULL : 0;
  });
  const setFin = (on) => {
    if (on === finOn) return;
    finOn = on;
    fin.classList.toggle('on', on);
    fin.setAttribute('aria-hidden', String(!on));
    magnet.tabIndex = on ? 0 : -1;
  };

  return function update(u) {
    show(intro, pick(u, envelope(u, CONFIG.intro)), 16);
    show(cue, reduce ? 0 : 1 - smooth(seg(u, 0, 0.03)));

    const w = CONFIG.words.find((x) => u >= x.u[0] && u <= x.u[3]);
    if (w && w.text !== wordText) { wordText = w.text; word.textContent = wordText; }
    show(word, w ? pick(u, envelope(u, w.u)) : 0, 24);

    const h = labelled.find((x) => u >= x.u0 - LABEL_EDGE && u <= x.u1 + LABEL_EDGE);
    if (h && h.label !== labelKey) { labelKey = h.label; title.textContent = h.label.title; meta.textContent = h.label.meta; }
    const lk = h ? envelope(u, [h.u0 - LABEL_EDGE, h.u0 + 0.004, h.u1 - 0.004, h.u1 + LABEL_EDGE]) : 0;
    show(label, pick(u, lk), 18);

    const fk = reduce ? (u >= CONFIG.finIn[0] ? 1 : 0) : smooth(seg(u, ...CONFIG.finIn));
    show(fin, fk, 30);
    setFin(fk > 0.5);
    if (!reduce) {
      mag.x += (mag.tx - mag.x) * 0.14; mag.y += (mag.ty - mag.y) * 0.14;
      magnet.style.transform = `translate(${mag.x.toFixed(1)}px, ${mag.y.toFixed(1)}px)`;
      magnetText.style.transform = `translate(${(mag.x * INNER).toFixed(1)}px, ${(mag.y * INNER).toFixed(1)}px)`;
    }
  };
}

/* ── src/90-boot.js ── */
/* ───────── boot and the single frame loop ───────── */
function loadTexture(name) {
  return new Promise((resolve, reject) => new THREE.TextureLoader().load(CONFIG.images[name], (t) => { t.colorSpace = THREE.SRGBColorSpace; resolve(t); }, undefined,
    (e) => reject(new Error(`texture ${name} failed to load: ${e?.message ?? e}`))));
}

async function boot() {
  const names = Object.keys(CONFIG.images);
  const [list] = await Promise.all([
    Promise.all(names.map(loadTexture)),
    // The neon word is drawn into a canvas, so its face must be loaded first.
    document.fonts.load(CONFIG.lobby.font).then((faces) => { if (!faces.length) console.error('MUSEUM: display font did not load:', CONFIG.lobby.font); }),
  ]);
  const textures = Object.fromEntries(names.map((n, i) => [n, list[i]]));

  const world = createWorld($('#gl'));
  const { scene, camera, composer, renderer } = world;
  const h = CONFIG.hemi;
  scene.add(new THREE.HemisphereLight(h.sky, h.ground, h.intensity));
  buildFloorReflection(world);
  buildRooms(world, concreteTexture());
  const env = metalEnvironment(renderer);
  const parts = [initLobby(world), initSculptures(world, env), initLightRoom(world), initVideoRoom(world, textures), initExit(world)];
  initPaintings(world, textures);
  const walk = createWalk();
  const hud = createHud(walk.holds);
  world.fit();
  addEventListener('resize', measureRunways);

  // Inspection hook for the Playwright checks only.
  if (new URLSearchParams(location.search).has('debug')) window.__museum = { THREE, world, walk };
  let lastU = -1, dirty = true, prev = performance.now();
  addEventListener('resize', () => { dirty = true; });
  if (reduce) addEventListener('scroll', () => { dirty = true; }, { passive: true });

  function frame(now) {
    requestAnimationFrame(frame);
    if (lenis) lenis.raf(now);
    if (document.hidden) return;                 // paused while the tab is hidden
    const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
    const time = now / 1000, u = pathU();
    if (reduce && !dirty && u === lastU) return;  // reduced motion: draw only when the view changes
    dirty = false; lastU = u;
    stepTilt();
    const v = reduce ? walk.still(u) : walk.at(u);
    camera.position.copy(v.pos);
    camera.rotation.set(v.pitch - tilt.y * CONFIG.look.pitch, v.yaw - tilt.x * CONFIG.look.yaw, 0);
    for (const p of parts) p.update(u, time, dt);
    hud(u);
    composer.render(dt);
  }
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', () => { dirty = true; parts.forEach((p) => p.update(pathU(), performance.now() / 1000, 0)); });
}
boot().catch((e) => console.error('MUSEUM failed to start', e));
