<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>TOY TOWN</title>
<meta name="description" content="하늘에 뜬 장난감 섬에 집이 떨어지고, 길이 그려지고, 해가 지고, 작은 자동차를 따라 골목을 달리는 스크롤 인터랙션 연습.">
<meta property="og:title" content="TOY TOWN">
<meta property="og:image" content="https://ahttoh.github.io/design-lab/assets/thumb/toytown.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    /* Every scene's --len is multiplied by this. 2026-09-28: the owner found 4,850vh too fast, so scenes start long and stretch 1.5x. */
    --scroll-stretch: 1.5;
    --sky: #4fb8ff; --navy: #1b2a6b;
    --tomato: #ff4d3d; --cobalt: #2f5bff; --sun: #ffc92e; --mint: #2fe0a2; --pink: #ff7eb9; --white: #fff;
    --title: clamp(4.6rem, 1rem + 15vw, 17rem);
    --word: clamp(4rem, 1rem + 11vw, 13rem);
    --stroke: .075em;
    --drop: .07em;
    --gutter: clamp(16px, 5vw, 80px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--sky); color: var(--navy); font-family: 'Pretendard Variable', system-ui, sans-serif; overflow-x: clip; }
  ::selection { background: var(--sun); color: var(--navy); }

  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  main { position: relative; z-index: 1; }
  .scene { position: relative; height: calc(var(--len) * var(--scroll-stretch)); }
  .pin { position: sticky; top: 0; height: 100vh; overflow: hidden; pointer-events: none; }

  /* chunky toy lettering: candy fill, navy outline painted under the fill, hard navy drop */
  .title, .word { margin: 0; font-family: 'Fredoka', 'Pretendard Variable', sans-serif; font-weight: 700; line-height: .9; letter-spacing: -.005em; white-space: nowrap; }
  .ln { display: inline-block; }
  .ch { display: inline-block; transform-origin: 50% 85%; will-change: transform; }
  .ci { display: inline-block; color: var(--c); -webkit-text-stroke: var(--stroke) var(--navy); paint-order: stroke fill; text-shadow: 0 var(--drop) 0 var(--navy); }

  .title { position: absolute; left: 0; right: 0; top: 9vh; text-align: center; font-size: var(--title); }
  .title .ln + .ln { margin-left: .26em; }
  .word { position: absolute; font-size: var(--word); }
  .w-build { left: var(--gutter); top: 11vh; }
  .w-night { left: var(--gutter); bottom: 9vh; }
  .w-ride { right: var(--gutter); top: 11vh; text-align: right; }
  .w-tiny { right: var(--gutter); bottom: 9vh; }
  .w-night .ln, .w-ride .ln { display: block; }

  .cue { position: absolute; left: 50%; bottom: 5vh; transform: translateX(-50%); display: grid; justify-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: var(--navy); }
  .ball { width: 18px; height: 18px; border-radius: 50%; background: var(--sun); border: 3px solid var(--navy); animation: hop 1.1s cubic-bezier(.3, 0, .5, 1) infinite alternate; }
  @keyframes hop { from { transform: translateY(-16px); } to { transform: translateY(0) scale(1.15, .85); } }

  .fin-copy { position: absolute; left: 0; right: 0; bottom: 8vh; display: grid; place-items: center; opacity: 0; }
  .magnet { display: grid; place-items: center; width: 150px; height: 150px; border-radius: 50%; background: var(--tomato); border: 4px solid var(--navy); box-shadow: 0 8px 0 var(--navy); color: var(--white); font: 800 1.1rem 'Pretendard Variable', sans-serif; text-decoration: none; will-change: transform; transition: box-shadow .15s, background-color .2s; }
  .magnet span { pointer-events: none; will-change: transform; }
  .magnet:hover { background: var(--cobalt); }
  .magnet:active { box-shadow: 0 2px 0 var(--navy); }
  .magnet:focus-visible { outline: 4px solid var(--sun); outline-offset: 6px; }

  @media (max-width: 760px) {
    :root { --title: 23vw; --word: 21vw; }
    .title .ln { display: block; }
    .title .ln + .ln { margin-left: 0; }
    .title { top: 7vh; }
    .magnet { width: 128px; height: 128px; }
  }
  /* reduced motion: one static finished town, every word visible, one screen per scene */
  .reduce .scene { height: 100vh; }
  .reduce .cue { display: none; }
  .reduce .fin-copy { opacity: 1; }
  .reduce .pin { pointer-events: none; }
  .reduce .fin-copy { pointer-events: auto; }
  @media (prefers-reduced-motion: reduce) { .ball { animation: none; } }
</style>

<body>
<canvas id="gl" aria-hidden="true"></canvas>

<main>
  <section class="scene" id="s-hero" style="--len:900vh">
    <div class="pin">
      <h1 class="title" id="title" data-split data-label="TOY TOWN">TOY|TOWN</h1>
      <div class="cue" id="cue" aria-hidden="true"><span class="ball"></span>스크롤</div>
    </div>
  </section>
  <section class="scene" id="s-build" style="--len:1500vh">
    <div class="pin"><h2 class="word w-build" id="w-build" data-split>BUILD</h2></div>
  </section>
  <section class="scene" id="s-night" style="--len:1300vh">
    <div class="pin"><h2 class="word w-night" id="w-night" data-split data-label="GOOD NIGHT">GOOD|NIGHT</h2></div>
  </section>
  <section class="scene" id="s-ride" style="--len:1300vh">
    <div class="pin"><h2 class="word w-ride" id="w-ride" data-split>RIDE</h2></div>
  </section>
  <section class="scene" id="s-tiny" style="--len:1100vh">
    <div class="pin"><h2 class="word w-tiny" id="w-tiny" data-split>TINY</h2></div>
  </section>
  <section class="scene" id="s-end" style="--len:900vh">
    <div class="pin">
      <h2 class="title" id="fin-title" data-split data-label="TOY TOWN">TOY|TOWN</h2>
      <div class="fin-copy" id="fin-copy"><a class="magnet" id="magnet" href="../"><span>목록으로</span></a></div>
    </div>
  </section>
</main>

<script type="module">
import * as THREE from 'three';

/* ───────── config ───────── */
const CONFIG = {
  dprMax: 1.5, mobileBreak: 760, lenisLerp: 0.08, seed: 11,
  color: {
    navy: '#1b2a6b', tomato: '#ff4d3d', cobalt: '#2f5bff', sun: '#ffc92e', mint: '#2fe0a2', pink: '#ff7eb9', white: '#ffffff',

    glassDay: '#8fd6ff', glassOff: '#434a9e', glassOn: '#ffd84a', bulbOff: '#dfe6f5', bulbOn: '#fff06a', lightDay: '#ffffff', lightNight: '#fff27a',
  },
  candy: ['tomato', 'cobalt', 'sun', 'mint', 'pink'],
  letters: ['var(--tomato)', 'var(--cobalt)', 'var(--sun)', 'var(--mint)', 'var(--pink)'],

  island: {

    // candy layer cake under the sea plate: [top radius, bottom radius, height, colour]
    cake: [[14, 13.2, 0.9, 'tomato'], [13.2, 12, 0.9, 'pink'], [12, 10.4, 0.9, 'sun'], [10.4, 7.6, 1.2, 'mint'], [7.6, 1.2, 3.2, 'cobalt']],
  },

  track: { r: 9.1, rails: [[8.93, 8.99], [9.21, 9.27]], bed: [8.78, 9.42], sleepers: 72, units: 4, gap: 1.08, speed: 0.12 },
  cars: { lane: 6.85, speed: 0.26, phases: [0.3, 1.25, 2.2, 3.1, 4.05, 5.1], colors: ['cobalt', 'sun', 'mint', 'pink', 'white', 'cobalt'], hero: ['tomato', 'sun'] },
  lamps: { ringR: 7.42, armAt: 4.1, armSide: 0.86, height: 1.15 },

  boats: [{ r: 11.7, phase: 0.4, speed: 0.07, hull: 'white', sail: 'sun' }, { r: 12.6, phase: 2.6, speed: -0.05, hull: 'tomato', sail: 'pink' }, { r: 13.2, phase: 4.4, speed: 0.045, hull: 'cobalt', sail: 'mint' }],
  clouds: { count: 8, puffs: 7, r: [12, 19], y: [-5, 7], drift: 0.012 },
  people: { count: 44, r: [1.05, 2.15], speed: [0.22, 0.5] },
  balloons: { count: 28 },
  // build timeline, all in build-scene progress
  build: {
    boats: [0.04, 0.18], ring: [0.03, 0.14], arms: [0.1, 0.2], plaza: [0.18, 0.24], houses: [0.22, 0.7], houseDur: 0.045, fall: 0.42, dropH: 16,
    trees: [0.42, 0.84], treeDur: 0.05, lamps: [0.58, 0.74], lampDur: 0.04, windmill: [0.7, 0.78], track: [0.74, 0.84], train: [0.83, 0.9],
    cars: [0.86, 0.93], people: [0.88, 0.97],
  },
  cam: { fitR: 14.5, portraitFit: 0.86, near: 0.5, far: 2400, sky: 900, stars: 800 },
  hero: { az: [-0.35, 0.55], el: [0.2, 0.64], fit: [1.12, 1.0], ty: [0.8, 1.2], spin: 0.1, curtain: [0.03, 0.4] },
  buildCam: { az: [0.55, 1.7], el: [0.64, 0.58], fit: [1.0, 0.9], ty: [1.2, -0.2] },
  nightCam: { az: [1.7, 2.2], el: [0.58, 0.52], fit: [0.9, 0.96], ty: [-0.2, -0.2] },
  night: { sunset: [0.05, 0.6], sky: [0.3, 0.7], windows: [0.35, 0.8], lamps: [0.45, 0.62], moon: [0.5, 0.95], stars: [0.55, 0.8] },
  ride: {
    lane: 6.15, camR: 6.45, theta0: 2.4, turns: 0.95, behind: 2.3, ahead: 2.4, height: [0.95, 1.6], waves: 1.5, lookY: 0.35, fov: 52,
    blendIn: [0, 0.14], drive: [0.08, 0.9], blendOut: [0.86, 1], dawn: [0.5, 0.9],
  },
  tiny: { target: 0.3, az: [0.8, 1.9], el: [0.88, 0.6], dist: [10, 7], fov: 30, portrait: 1.25, tilt: [0, 0.1], band: 0.07, soft: 0.22, maxPx: 14, sat: 1.1 },
  end: { pull: [0, 0.45], tiltOff: [0, 0.2], az: 0.9, el: 0.68, fit: 1.12, ty: 3.4, spin: 0.05, balloons: [0.15, 0.6], sun: [0.2, 0.45] },
  sunArc: { rest: 0.18, x: [-0.85, 0.95], yBase: 0.25, yArc: 0.55, ySet: -0.55, size: 0.075, depth: 1.5 },
  moonArc: { x: [-0.9, -0.55], y: [-0.4, 0.62], size: 0.055 },
  light: {
    day: { pos: [10, 16, 8], color: '#fff6e8', i: 2.3, hemi: ['#d8f2ff', '#8ee08e', 1.75] },
    sunset: { pos: [-14, 4, 5], color: '#ff9a5a', i: 1.6 },
    night: { pos: [-6, 12, 10], color: '#9fb0ff', i: 0.6, hemi: ['#7d7fe6', '#343889', 0.95] },
  },
  sky: { day: ['#3aa6ff', '#a6e0ff'], sunset: ['#ff6fae', '#ffb35c'], night: ['#26298a', '#6454d6'] },
  words: {
    title: { wobble: [0.08, 0.28, 0.45, 0.52], drop: [0.5, 0.2], cue: [0.02, 0.06] },
    'w-build': { in: [0.02, 0.1], out: [0.2, 0.26], stagger: 0.04 },
    'w-night': { in: [0.72, 0.8], out: [0.93, 0.98], stagger: 0.025 },
    'w-ride': { in: [0.16, 0.24], out: [0.36, 0.42], stagger: 0.04 },
    'w-tiny': { in: [0.08, 0.16], out: [0.42, 0.48], stagger: 0.04 },
    'fin-title': { in: [0.3, 0.42], stagger: 0.035 },
    finCopy: [0.52, 0.6],
  },
};

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const clamp01 = (v) => clamp(v, 0, 1);
const seg = (p, a, b) => clamp01((p - a) / (b - a));
const segR = (p, r) => seg(p, r[0], r[1]);
const smooth = (x) => x * x * (3 - 2 * x);
const lerp = (a, b, t) => a + (b - a) * t;
const lerpR = (r, t) => lerp(r[0], r[1], t);
const bump = (x) => Math.sin(Math.PI * clamp01(x));
const backOut = (t, s = 1.7) => 1 + (s + 1) * (t - 1) ** 3 + s * (t - 1) ** 2;
const backIn = (t, s = 1.7) => (s + 1) * t ** 3 - s * t ** 2;
const elasticOut = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : 2 ** (-10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1);
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const dprNow = () => Math.min(devicePixelRatio || 1, CONFIG.dprMax);
const isMobile = () => innerWidth < CONFIG.mobileBreak;
/** Deterministic PRNG so the town is laid out the same on every load. */
function mulberry32(seed) { let a = seed; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rnd = mulberry32(CONFIG.seed);
const rr = (a, b) => a + rnd() * (b - a);
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
const col = (name) => { const hex = CONFIG.color[name]; if (!hex) throw new Error(`unknown colour ${name}`); return new THREE.Color(hex); };

if (reduce) document.documentElement.classList.add('reduce');

/* ───────── scroll engine ───────── */
gsap.registerPlugin(ScrollTrigger);
const lenis = reduce ? null : new Lenis({ lerp: CONFIG.lenisLerp });
if (lenis) { lenis.on('scroll', ScrollTrigger.update); gsap.ticker.add((t) => lenis.raf(t * 1000)); gsap.ticker.lagSmoothing(0); }
const velocity = () => (lenis ? lenis.velocity : 0);

const SCENES = ['hero', 'build', 'night', 'ride', 'tiny', 'end'];
// 3D progress runs from this scene's top to the next scene's top, so scenes hand off with no dead zone.
// Text progress runs while the sticky pin is fully on screen.
const worldST = {}, textST = {};
SCENES.forEach((k, i) => {
  const trigger = $(`#s-${k}`), last = i === SCENES.length - 1;
  worldST[k] = ScrollTrigger.create({ trigger, start: 'top top', end: last ? 'bottom bottom' : 'bottom top' });
  textST[k] = ScrollTrigger.create({ trigger, start: 'top top', end: 'bottom bottom' });
});
const progressOf = (map) => Object.fromEntries(SCENES.map((k) => [k, reduce ? 1 : map[k].progress]));

/* ───────── lettering ───────── */
function split(el) {
  const lines = el.textContent.split('|');
  el.setAttribute('aria-label', el.dataset.label || lines.join(' '));
  let k = 0;
  const colours = CONFIG.letters;
  el.innerHTML = lines.map((l) => `<span class="ln" aria-hidden="true">${[...l].map((c) => `<span class="ch"><span class="ci" style="--c:${colours[k++ % colours.length]}">${c}</span></span>`).join('')}</span>`).join('');
  return [...el.querySelectorAll('.ch')];
}
const letters = Object.fromEntries($$('[data-split]').map((el) => [el.id, split(el)]));

/** Scroll-driven pop: elastic scale in, back-in shrink out, a little tilt either way. */
function popWord(chs, q, cfg) {
  const n = chs.length;
  chs.forEach((c, i) => {
    const k = n > 1 ? i / (n - 1) : 0;
    const tin = seg(q, cfg.in[0] + k * cfg.stagger, cfg.in[1] + k * cfg.stagger);
    const tout = cfg.out ? seg(q, cfg.out[0] + k * cfg.stagger * 0.5, cfg.out[1] + k * cfg.stagger * 0.5) : 0;
    const s = Math.max(0, elasticOut(tin) * (1 - Math.max(0, backIn(tout)) * 1.02));
    const sign = i % 2 ? 1 : -1;
    const y = (1 - backOut(tin)) * 0.5 - Math.sin(tout * Math.PI) * 0.25;
    const r = sign * (1 - tin) * 24 + sign * tout * 30;
    c.style.visibility = s > 0.002 ? 'visible' : 'hidden';
    c.style.transform = `translateY(${y.toFixed(3)}em) rotate(${r.toFixed(2)}deg) scale(${s.toFixed(4)})`;
  });
}

/** Hero title: popped in on load, wobbles and hops with the scroll, then drops out letter by letter. */
function heroTitle(chs, q) {
  const cfg = CONFIG.words.title, amp = smooth(seg(q, cfg.wobble[0], cfg.wobble[1])) * (1 - smooth(seg(q, cfg.wobble[2], cfg.wobble[3])));
  chs.forEach((c, i) => {
    const w = q * 42 + i * 1.3;
    const start = cfg.drop[0] + i * 0.028, fall = seg(q, start, start + cfg.drop[1]);
    const sign = i % 2 ? 1 : -1;
    const y = -Math.abs(Math.sin(w)) * 0.12 * amp + fall * fall * 6;
    const r = Math.sin(w) * 9 * amp + sign * fall * 50;
    c.style.transform = `translateY(${y.toFixed(3)}em) rotate(${r.toFixed(2)}deg)`;
  });
  $('#cue').style.opacity = 1 - seg(q, cfg.cue[0], cfg.cue[1]);
}

/* ───────── renderer, camera, lights ───────── */
const canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(18, 1, CONFIG.cam.near, CONFIG.cam.far);
const world = new THREE.Group();
scene.add(world);

const hemi = new THREE.HemisphereLight(CONFIG.light.day.hemi[0], CONFIG.light.day.hemi[1], CONFIG.light.day.hemi[2]);
scene.add(hemi);
const sunLight = new THREE.DirectionalLight(CONFIG.light.day.color, CONFIG.light.day.i);
sunLight.castShadow = true;
{
  const s = CONFIG.shadow, c = sunLight.shadow.camera;
  c.left = -s.extent; c.right = s.extent; c.top = s.extent; c.bottom = -s.extent; c.near = 2; c.far = 90;
  sunLight.shadow.bias = s.bias; sunLight.shadow.normalBias = s.normalBias;
  const size = isMobile() ? s.mapMobile : s.map;
  sunLight.shadow.mapSize.set(size, size);
}
scene.add(sunLight, sunLight.target);

/* sky: a screen-space gradient on a dome that rides with the camera */
const skyU = { uTop: { value: new THREE.Color() }, uBot: { value: new THREE.Color() }, uH: { value: 1 } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(CONFIG.cam.sky, 16, 12), new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, depthTest: false,
  vertexShader: `void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `uniform vec3 uTop, uBot; uniform float uH;
    void main(){ float t = clamp(gl_FragCoord.y / uH, 0., 1.); gl_FragColor = vec4(mix(uBot, uTop, smoothstep(0., 1., t)), 1.);
    #include <colorspace_fragment>
    }`,
}));
sky.renderOrder = -10; sky.frustumCulled = false;
scene.add(sky);

const stars = (() => {
  const n = 420, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const v = new THREE.Vector3(rr(-1, 1), rr(-1, 1), rr(-1, 1)).normalize().multiplyScalar(CONFIG.cam.stars);
    pos.set([v.x, v.y, v.z], i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 2.4, sizeAttenuation: false, transparent: true, opacity: 0, depthWrite: false }));
  p.renderOrder = -9; p.frustumCulled = false;
  scene.add(p);
  return p;
})();

/** Soft round sprite texture, drawn in memory so file:// never taints the canvas. */
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(0.35, 'rgba(255,255,255,.45)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const GLOW = glowTexture();

function disc(colour, glowColour) {
  const g = new THREE.Group();
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 4.2), new THREE.MeshBasicMaterial({ color: glowColour, map: GLOW, transparent: true, opacity: 0.55, depthWrite: false }));

/* ───────── cars (ring traffic + the hero car) ───────── */
function buildCars() {

/* ───────── resize ───────── */

  train.update(bp, dt, vel);
  cars.update(bp, dt, reduce ? 0 : (P.tiny > 0 ? 1 : segR(P.ride, CONFIG.ride.drive)), vel, env.tod);
  boats.update(bp, dt);
  clouds.update(dt);
  people.update(bp, dt);
  balloons.update(reduce ? 0 : P.end, dt);
  roads.spout.position.y = 0.95 + Math.sin(clock * 3) * 0.05;
  curtain.update(reduce ? 1 : smooth(segR(Q.hero, CONFIG.hero.curtain)) + (P.build > 0 ? 1 : 0), dist * 0.45);
  // tilt-shift: fades in on arrival over the square, follows the pointer, fades out as the camera pulls away
  const tc = CONFIG.tiny, amount = reduce ? 0 : smooth(seg(P.ride, 0.9, 1)) * (1 - smooth(segR(P.end, CONFIG.end.tiltOff)));
  const idle = performance.now() - pointer.moved > 2500;
  const want = idle ? 0.45 + Math.sin(clock * 0.4) * 0.12 : 1 - pointer.y;
  focus += (want - focus) * 0.08;
  if (amount > 0.001) {
    tilt.uniforms.uFocus.value = focus;
    tilt.uniforms.uAmount.value = amount; tilt.uniforms.uBand.value = tc.band; tilt.uniforms.uSoft.value = tc.soft; tilt.uniforms.uSat.value = tc.sat;
    composer.render(dt);
  } else renderer.render(scene, camera);
  if (!reduce) texts(Q);
}

function texts(Q) {
  const W = CONFIG.words;
  heroTitle(letters.title, Q.hero);
  ['w-build', 'w-night', 'w-ride', 'w-tiny', 'fin-title'].forEach((id) => {
    const key = { 'w-build': 'build', 'w-night': 'night', 'w-ride': 'ride', 'w-tiny': 'tiny', 'fin-title': 'end' }[id];
    popWord(letters[id], Q[key], W[id]);
  });
  const c = segR(Q.end, W.finCopy), copy = $('#fin-copy');
  copy.style.opacity = c; copy.style.transform = `translateY(${(1 - backOut(c)) * 40}px)`;
  copy.style.pointerEvents = c > 0.5 ? 'auto' : 'none';
}

/* ───────── intro, magnet, loop ───────── */
if (!reduce) {
  gsap.from($$('#title .ci'), { scale: 0, yPercent: 60, rotate: (i) => (i % 2 ? 18 : -18), duration: 1.4, ease: 'elastic.out(1, 0.45)', stagger: 0.08, delay: 0.25 });
  const magnet = $('#magnet'), label = magnet.querySelector('span');
  magnet.addEventListener('pointermove', (e) => {
    const r = magnet.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    gsap.to(magnet, { x: dx * 0.45, y: dy * 0.45, duration: 0.4, ease: 'power3.out' });
    gsap.to(label, { x: dx * 0.2, y: dy * 0.2, duration: 0.4, ease: 'power3.out' });
  });
  magnet.addEventListener('pointerleave', () => gsap.to([magnet, label], { x: 0, y: 0, duration: 0.9, ease: 'elastic.out(1, 0.35)' }));
  gsap.ticker.add((t, deltaMs) => { if (!document.hidden) frame(Math.min(deltaMs / 1000, 0.05)); });
} else {
  frame(0);
  document.fonts.ready.then(() => frame(0));
}
document.fonts.ready.then(() => ScrollTrigger.refresh());
// verification hook for Playwright: draw calls per frame
if (new URLSearchParams(location.search).has('debug')) window.__toytown = { info: () => ({ ...renderer.info.render }) };
</script>
